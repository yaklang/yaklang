syntax = "proto3";

package pbbp2;

option go_package = "github.com/yaklang/yaklang/common/notify/drivers/feishu;feishu";

message Header {
  string key = 1;
  string value = 2;
}

// Frame is the binary envelope used by Feishu long connections.
// Field numbers intentionally match the legacy proto2/gogo schema.
message Frame {
  uint64 SeqID = 1;
  uint64 LogID = 2;
  int32 service = 3;
  int32 method = 4;
  repeated Header headers = 5;
  string payload_encoding = 6;
  string payload_type = 7;
  bytes payload = 8;
  string LogIDNew = 9;
}
