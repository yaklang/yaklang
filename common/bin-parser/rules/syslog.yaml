Package:
  Syslog:
    operator: |
      this.ProcessSubNode("Lt")
      if getNodeResult("Lt").Value != 0x3c {
        panic("syslog: expected PRI bracket")
      }
      this.ProcessSubNode("PRI")
      pri = string(getNodeResult("PRI").Value)
      if len(pri) == 0 {
        panic("syslog: empty PRI")
      }
      this.ProcessSubNode("Message")
    Lt: uint8
    PRI: "del:>;type:string"
    Message: "del:\n;type:string"
