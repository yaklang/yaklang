Package:
  ICMPV6:
    Type: uint8
    Code: uint8
    Checksum: uint16
    Payload:
      unpack: true
      operator: |
        type = getNodeResult("@ICMPV6/Type").Value
        switch type {
          case 128:
            this.ProcessByType("Echo Request")
          case 129:
            this.ProcessByType("Echo Reply")
          case 133:
            this.ProcessByType("Router Solicitation")
          case 134:
            this.ProcessByType("Router Advertisement")
          case 135:
            this.ProcessByType("Neighbor Solicitation")
          case 136:
            this.ProcessByType("Neighbor Advertisement")
          default:
            return
        }
Echo Request:
    Identifier: uint16
    Sequence Number: uint16
    Data: raw
Echo Reply:
    Identifier: uint16
    Sequence Number: uint16
    Data: raw
Router Solicitation:
    Reserved: raw,4
    Options: raw
Router Advertisement:
    Hop Limit: uint8
    Flags: uint8
    Router Lifetime: uint16
    Reachable Time: uint32
    Retrans Timer: uint32
    Options: raw
Neighbor Solicitation:
    Reserved: raw,4
    Target Address: raw,16
    Options: raw
Neighbor Advertisement:
    Flags: uint32
    Target Address: raw,16
    Options: raw
Destination Unreachable:
    Code: uint8
    Checksum: uint16
    Unused: uint32
    Payload:
      unpack: true
      operator: |
        code = getNodeResult("@Destination Unreachable/Code").Value
        switch code {
          case 1:
            this.ProcessByType("No Route to Destination")
          case 2:
            this.ProcessByType("Communication with Destination Administratively Prohibited")
          case 3:
            this.ProcessByType("Beyond Scope of Source Address")
          case 4:
            this.ProcessByType("Address Unreachable")
          case 5:
            this.ProcessByType("Port Unreachable")
          default:
            return
        }
