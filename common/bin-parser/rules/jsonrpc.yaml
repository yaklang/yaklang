Package:
  JSONRPC:
    operator: |
      this.ProcessSubNode("Brace")
      if getNodeResult("Brace").Value != 0x7b {
        panic("jsonrpc: expected object")
      }
      this.ProcessSubNode("Line")
      s = string(getNodeResult("Line").Value)
      if !s.Contains("\"jsonrpc\":") {
        panic("jsonrpc: expected jsonrpc key")
      }
      if s.Contains("\"method\":") {
        return
      }
      if s.Contains("\"result\":") || s.Contains("\"error\":") {
        return
      }
      panic("jsonrpc: expected method or result")
    Brace: uint8
    Line: "del:\n;type:string"
