Package:
  JSONRPC:
    operator: |
      this.ProcessSubNode("Brace")
      if getNodeResult("Brace").Value != 0x7b {
        panic("jsonrpc: expected object")
      }
      if this.GetMaxLength() > 0 && this.GetMaxLength() < 1048576 {
        rest = this.GetMaxLength() - this.Length()
        if rest >= 3 {
          this.GetSubNode("Pairs").SetMaxLength(rest)
        }
      }
      this.ProcessSubNode("Pairs")
      hm = getCtx("has_method")
      hr = getCtx("has_result")
      he = getCtx("has_error")
      if hm != 1 && hr != 1 && he != 1 {
        panic("jsonrpc: expected method or result")
      }
    Brace: uint8
    Pairs:
      list: true
      Pair: JSONPair
      operator: |
        for {
          if getCtx("json_end") == 1 {
            break
          }
          ele = this.NewElement()
          if ele.GetMaxLength() < 3 {
            if this.Length() == 0 {
              panic("jsonrpc: empty pairs")
            }
            break
          }
          ele.Process()
        }
JSONPair:
  operator: |
    for {
      res, op = this.TryProcessByType("JSONWhitespaceByte")
      if !op.OK {
        op.Recovery()
        break
      }
      op.Save()
    }
    this.ProcessSubNode("QKey")
    if getNodeResult("QKey").Value != 0x22 {
      panic("jsonrpc: expected quote")
    }
    this.ProcessSubNode("Key")
    for {
      res, op = this.TryProcessByType("JSONWhitespaceByte")
      if !op.OK {
        op.Recovery()
        break
      }
      op.Save()
    }
    this.ProcessSubNode("Colon")
    if getNodeResult("Colon").Value != 0x3a {
      panic("jsonrpc: expected colon")
    }
    for {
      res, op = this.TryProcessByType("JSONWhitespaceByte")
      if !op.OK {
        op.Recovery()
        break
      }
      op.Save()
    }
    this.ProcessSubNode("ValLead")
    lead = getNodeResult("ValLead").Value
    if lead == 0x22 {
      this.ProcessSubNode("StrVal")
    }
    if lead == 0x7b {
      this.ProcessSubNode("Empty Object End")
      if getNodeResult("Empty Object End").Value != 0x7d {
        panic("jsonrpc: non-empty object values are not supported")
      }
    }
    if lead == 0x5b {
      this.ProcessSubNode("Empty Array End")
      if getNodeResult("Empty Array End").Value != 0x5d {
        panic("jsonrpc: non-empty array values are not supported")
      }
    }
    if lead != 0x22 && lead != 0x7b && lead != 0x5b {
      for {
        res, op = this.TryProcessByType("JSONPrimitiveByte")
        if !op.OK {
          op.Recovery()
          break
        }
        op.Save()
      }
    }
    key = string(getNodeResult("Key").Value)
    if key == "method" {
      setCtx("has_method", 1)
    }
    if key == "result" {
      setCtx("has_result", 1)
    }
    if key == "error" {
      setCtx("has_error", 1)
    }
    for {
      res, op = this.TryProcessByType("JSONWhitespaceByte")
      if !op.OK {
        op.Recovery()
        break
      }
      op.Save()
    }
    this.ProcessSubNode("Sep")
    sep = getNodeResult("Sep").Value
    if sep == 0x7d {
      setCtx("json_end", 1)
    } else {
      if sep != 0x2c {
        panic("jsonrpc: expected comma or end")
      }
    }
  QKey: uint8
  Key: "del:\";type:string"
  Colon: uint8
  ValLead: uint8
  StrVal: "del:\";type:string"
  Empty Object End: uint8
  Empty Array End: uint8
  Sep: uint8
JSONWhitespaceByte:
  operator: |
    this.ProcessSubNode("Octet")
    b = getNodeResult("Octet").Value
    if b != 0x20 && b != 0x09 && b != 0x0a && b != 0x0d {
      panic("jsonrpc: expected whitespace")
    }
  Octet: uint8
JSONPrimitiveByte:
  operator: |
    this.ProcessSubNode("Octet")
    b = getNodeResult("Octet").Value
    if b == 0x2c || b == 0x7d || b == 0x20 || b == 0x09 || b == 0x0a || b == 0x0d {
      panic("jsonrpc: primitive separator")
    }
  Octet: uint8
