Package:
  ClientNegotiation:
    operator: |
      if this.ProcessSubNode("Version").Value != 5 { panic("socks5: invalid negotiation version") }
      count = this.ProcessSubNode("NMethods").Value
      if count == 0 { panic("socks5: empty method list") }
      this.ProcessSubNode("Methods")
    Version: uint8
    NMethods: uint8
    Methods:
      list: true
      list-length-from-field: "../NMethods"
      Method: uint8
  ServerNegotiation:
    operator: |
      if this.ProcessSubNode("Version").Value != 5 { panic("socks5: invalid selection version") }
      this.ProcessSubNode("Method")
    Version: uint8
    Method: uint8
  AuthRequest:
    Version: uint8
    ULen: uint8
    UNAME:
      type: string
      length-from-field: ../ULen
    PLen: uint8
    PASSWD:
      type: string
      length-from-field: ../PLen
  AuthReply:
    Version: uint8
    Status: uint8
  Request:
    operator: |
      if this.ProcessSubNode("Version").Value != 5 { panic("socks5: invalid request version") }
      command = this.ProcessSubNode("Command").Value
      if command < 1 || command > 3 { panic("socks5: invalid command") }
      if this.ProcessSubNode("Reserved").Value != 0 { panic("socks5: invalid reserved byte") }
      addressType = this.ProcessSubNode("AddressType").Value
      if addressType != 1 && addressType != 3 && addressType != 4 { panic("socks5: invalid address type") }
      this.ProcessSubNode("DstAddress")
      this.ProcessSubNode("DstPort")
    Version: uint8
    Command: uint8
    Reserved: uint8
    AddressType: uint8
    DstAddress:
      operator: |
        type = getNodeResult("../AddressType").Value
        switch type{
          case 0x1:
            this.ProcessByType("IPV4")
          case 0x3:
            this.ProcessByType("Domain")
          case 0x4:
            this.ProcessByType("IPV6")
        }
    DstPort: uint16
  Replies:
    operator: |
      if this.ProcessSubNode("Version").Value != 5 { panic("socks5: invalid reply version") }
      if this.ProcessSubNode("Reply").Value > 8 { panic("socks5: invalid reply code") }
      if this.ProcessSubNode("Reserved").Value != 0 { panic("socks5: invalid reserved byte") }
      addressType = this.ProcessSubNode("AddressType").Value
      if addressType != 1 && addressType != 3 && addressType != 4 { panic("socks5: invalid address type") }
      this.ProcessSubNode("BndAddress")
      this.ProcessSubNode("BndPort")
    Version: uint8
    Reply: uint8
    Reserved: uint8
    AddressType: uint8
    BndAddress:
      operator: |
        type = getNodeResult("../AddressType").Value
        switch type{
          case 0x1:
            this.ProcessByType("IPV4")
          case 0x3:
            this.ProcessByType("Domain")
          case 0x4:
            this.ProcessByType("IPV6")
        }
    BndPort: uint16
IPV4:
  type: raw
  length: 32

IPV6:
  type: raw
  length: 128

Domain:
  operator: |
    if this.ProcessSubNode("Length").Value == 0 { panic("socks5: empty domain") }
    this.ProcessSubNode("DomainName")
  Length: uint8
  DomainName:
    type: string
    length-from-field: ../Length
