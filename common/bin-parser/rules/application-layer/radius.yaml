endian: big
Package:
  RADIUS:
    operator: |
      this.ProcessSubNode("Code")
      code = getNodeResult("Code").Value
      if code < 1 || (code > 5 && code != 11 && code != 12 && code != 13 && code != 40 && code != 41 && code != 44 && code != 45) {
        panic("radius: unknown code")
      }
      this.ProcessSubNode("Identifier")
      this.ProcessSubNode("Length")
      l = getNodeResult("Length").Value
      if l < 20 {
        panic("radius: length smaller than header")
      }
      if l > 4096 {
        panic("radius: length exceeds 4096")
      }
      this.ProcessSubNode("Authenticator")
      if l > 20 {
        this.GetSubNode("Attributes").SetMaxLength(l - 20)
        this.ProcessSubNode("Attributes")
      }
      return
    Code: uint8
    Identifier: uint8
    Length: uint16
    Authenticator: raw,16
    Attributes:
      list: true
      Attribute: RADIUSAttribute
      operator: |
        for {
          if this.GetMaxLength() < 2 {
            break
          }
          res, op = this.TryProcessByType("PeekByte")
          if !op.OK {
            op.Recovery()
            break
          }
          op.Recovery()
          ele = this.NewElement()
          if ele.GetMaxLength() < 2 {
            break
          }
          prev = this.Length()
          ele.Process()
          if this.Length() <= prev {
            break
          }
        }
RADIUSAttribute:
  operator: |
    this.ProcessSubNode("Type")
    this.ProcessSubNode("Length")
    t = getNodeResult("Type").Value
    al = getNodeResult("Length").Value
    if al < 2 {
      panic("radius: attribute length smaller than 2")
    }
    dlen = al - 2
    if t == 1 {
      if dlen > 0 && dlen < 1048576 {
        this.GetSubNode("User-Name").SetMaxLength(dlen)
        this.ProcessSubNode("User-Name")
      }
      return
    }
    if t == 2 {
      if dlen > 0 && dlen < 1048576 {
        this.GetSubNode("User-Password").SetMaxLength(dlen)
        this.ProcessSubNode("User-Password")
      }
      return
    }
    if t == 4 {
      if dlen != 4 {
        panic("radius: NAS-IP-Address length must be 4")
      }
      this.ProcessSubNode("NAS-IP-Address")
      return
    }
    if t == 5 {
      if dlen != 4 {
        panic("radius: NAS-Port length must be 4")
      }
      this.ProcessSubNode("NAS-Port")
      return
    }
    if t == 80 {
      if dlen > 0 && dlen < 1048576 {
        this.GetSubNode("Message-Authenticator").SetMaxLength(dlen)
        this.ProcessSubNode("Message-Authenticator")
      }
      return
    }
    if dlen > 0 && dlen < 1048576 {
      this.GetSubNode("Attribute Data").SetMaxLength(dlen)
      this.ProcessSubNode("Attribute Data")
    }
    return
  Type: uint8
  Length: uint8
  User-Name: string
  User-Password: string
  NAS-IP-Address: raw,4
  NAS-Port: uint32
  Message-Authenticator: string
  Attribute Data: string
PeekByte: uint8
