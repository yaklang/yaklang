endian: big
unit: byte
Package:
  RDPConnectionRequest:
    operator: |
      this.ProcessSubNode("Version")
      if getNodeResult("Version").Value != 3 {
        panic("rdp: TPKT version must be 3")
      }
      this.ProcessSubNode("Reserved")
      this.ProcessSubNode("PacketLength")
      packetLength = getNodeResult("PacketLength").Value
      if packetLength != this.GetMaxLength() {
        panic("rdp: TPKT length does not match input")
      }
      this.ProcessSubNode("X224Length")
      x224Length = getNodeResult("X224Length").Value
      if x224Length + 5 != packetLength {
        panic("rdp: X224 length does not match TPKT")
      }
      this.ProcessSubNode("TPDUCode")
      if (getNodeResult("TPDUCode").Value & 0xf0) != 0xe0 {
        panic("rdp: expected X224 connection request")
      }
      this.ProcessSubNode("DestinationReference")
      this.ProcessSubNode("SourceReference")
      this.ProcessSubNode("ClassOption")
      this.ProcessSubNode("NegotiationType")
      negotiationType = getNodeResult("NegotiationType").Value
      if negotiationType < 1 || negotiationType > 3 {
        panic("rdp: invalid negotiation type")
      }
      this.ProcessSubNode("NegotiationFlags")
      this.ProcessSubNode("NegotiationLength")
      if getNodeResult("NegotiationLength").Value != 8 {
        panic("rdp: negotiation length must be 8")
      }
      this.ProcessSubNode("RequestedProtocols")
    Version: uint8
    Reserved: uint8
    PacketLength: uint16
    X224Length: uint8
    TPDUCode: uint8
    DestinationReference: uint16
    SourceReference: uint16
    ClassOption: uint8
    NegotiationType: uint8
    NegotiationFlags: uint8
    NegotiationLength:
      endian: little
      type: uint16
    RequestedProtocols:
      endian: little
      type: uint32
  TPKT:
    Version: uint8
    Reserved: uint8
    PacketLength: uint16
    length-from-field: PacketLength
    TPDU: raw
  X224:
    Length: uint8
    Flag: uint8
    Destination: uint16
    Source: uint16
    Class: uint8
    length-from-field: Length
    length-for-start-field: Flag
    VariableData: string
  Negotiation:
    endian: little
    Type: uint8
    Flag: uint8
    Length: uint16
    Protocol: uint32
  Challenge: Challenge
  Authentication: Authentication
  RDP:
    operator: |
      this.ProcessSubNode("Version")
      if getNodeResult("Version").Value != 3 {
        panic("rdp: TPKT version must be 3")
      }
      this.ProcessSubNode("Reserved")
      this.ProcessSubNode("PacketLength")
      l = getNodeResult("PacketLength").Value
      if l < 11 {
        panic("rdp: TPKT too short for X224 CR")
      }
      this.GetSubNode("X224").SetMaxLength(l - 4)
      this.ProcessSubNode("X224")
    Version: uint8
    Reserved: uint8
    PacketLength: uint16
    X224:
      operator: |
        this.ProcessSubNode("Length")
        this.ProcessSubNode("Flag")
        code = getNodeResult("Flag").Value & 0xf0
        if code != 0xe0 && code != 0xd0 && code != 0xf0 && code != 0x80 {
          panic("rdp: unexpected X224 TPDU code")
        }
        this.ProcessSubNode("Destination")
        this.ProcessSubNode("Source")
        this.ProcessSubNode("Class")
        rem = this.GetSubNode("VariableData").GetRemainingSpace()
        if rem > 0 && rem <= 0x10000 {
          this.GetSubNode("VariableData").SetMaxLength(rem)
          this.ProcessSubNode("VariableData")
        }
      Length: uint8
      Flag: uint8
      Destination: uint16
      Source: uint16
      Class: uint8
      VariableData:
        Octets: string
        operator: |
          gotCookie = false
          gotNeg = false
          res,op = this.TryProcessByType("RDPCookie")
          if op.OK {
            err = op.Save()
            if err != nil {
              panic(err)
            }
            gotCookie = true
          } else {
            err = op.Recovery()
            if err != nil {
              panic(err)
            }
          }
          res,op = this.TryProcessByType("RDPNegotiation")
          if op.OK {
            err = op.Save()
            if err != nil {
              panic(err)
            }
            gotNeg = true
          } else {
            err = op.Recovery()
            if err != nil {
              panic(err)
            }
          }
          if !gotCookie && !gotNeg {
            leftover = this.GetSubNode("Octets").GetRemainingSpace()
            if leftover > 0 && leftover <= 0x10000 {
              this.GetSubNode("Octets").SetMaxLength(leftover)
              this.ProcessSubNode("Octets")
            }
          }
RDPCookie:
  operator: |
    this.ProcessSubNode("Line")
    line = string(getNodeResult("Line").Value)
    if !line.HasPrefix("Cookie:") {
      panic("rdp: expected Cookie: mstshash")
    }
  Line: "del:\r\n;type:string"
RDPNegotiation:
  endian: little
  operator: |
    this.ProcessSubNode("Type")
    t = getNodeResult("Type").Value
    if t < 1 || t > 3 {
      panic("rdp: negotiation type must be 1-3")
    }
    this.ProcessSubNode("Flag")
    this.ProcessSubNode("Length")
    if getNodeResult("Length").Value != 8 {
      panic("rdp: negotiation length must be 8")
    }
    this.ProcessSubNode("Protocol")
  Type: uint8
  Flag: uint8
  Length: uint16
  Protocol: uint32

Challenge: "import:application-layer/ntlm.yaml;node:ChallengeMessage"
Authentication: "import:application-layer/ntlm.yaml;node:AuthenticationMessage"
