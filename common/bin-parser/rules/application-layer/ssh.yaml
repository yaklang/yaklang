# RFC4253 initial plaintext framing. Message numbers 30..49 have no method
# meaning without a selected exchange; their bytes remain opaque here.
# Explicit method layouts are in ssh_plaintext.yaml. Neither entry performs
# TCP reassembly, follows NEWKEYS, decrypts a record, or verifies an identity.
endian: big
unit: byte
Package:
  SSH:
    operator: |
      limit = 255
      if this.HasMaxLength() {
        cap = this.GetMaxLength("bit")
        if cap % 8 != 0 { panic("ssh: identification needs an enclosing byte boundary") }
        if cap / 8 < limit { limit = cap / 8 }
      }
      line = this.GetSubNode("Identification")
      line.SetMaxLength(limit)
      // Probe CRLF without consuming bytes. An earlier LF belongs to the
      // first line, even when a later binary packet happens to contain CRLF.
      ident, trial = this.TryProcessSubNode("Identification")
      crlf = trial.OK
      if crlf { crlf = !string(ident.Value).Contains("\n") }
      trial.Recovery()
      ending = "\r\n"
      if !crlf {
        line.SetCfg("delimiter", "\n")
        ending = "\n"
      }
      ident = this.ProcessSubNode("Identification").Value
      err = validateSSHIdentification([]byte(string(ident) + ending))
      if err != nil { panic(err) }
    Identification: "del:\r\n;type:string"
  SSHPacket:
    operator: |
      bounded = this.HasMaxLength()
      cap = 0
      if bounded { cap = this.GetMaxLength("bit") }
      prefix, trial = this.TryProcessSubNode("Packet Length")
      trial.Recovery()
      if !trial.OK { panic("ssh: incomplete packet length") }
      plen = prefix.Value
      if plen < 12 || plen > 34996 { panic("ssh: initial packet exceeds 16..35000-byte bound") }
      total = plen + 4
      if total % 8 != 0 { panic("ssh: initial packet is not eight-byte aligned") }
      if bounded && (cap % 8 != 0 || total * 8 > cap) { panic("ssh: packet exceeds the enclosing byte boundary") }
      this.SetMaxLength(total)
      err = parseSSHPlaintextPacket("transport")
      if err != nil { panic(err) }
    Packet Length: uint32
  SSHKexInitPacket:
    operator: |
      bounded = this.HasMaxLength()
      cap = 0
      if bounded { cap = this.GetMaxLength("bit") }
      prefix, trial = this.TryProcessSubNode("Packet Length")
      trial.Recovery()
      if !trial.OK { panic("ssh: incomplete packet length") }
      plen = prefix.Value
      if plen < 12 || plen > 34996 { panic("ssh: initial packet exceeds 16..35000-byte bound") }
      total = plen + 4
      if total % 8 != 0 { panic("ssh: initial packet is not eight-byte aligned") }
      if bounded && (cap % 8 != 0 || total * 8 > cap) { panic("ssh: packet exceeds the enclosing byte boundary") }
      this.SetMaxLength(total)
      err = parseSSHPlaintextPacket("transport")
      if err != nil { panic(err) }
      if getNodeResult("Payload/Message Number").Value != 20 { panic("ssh: a standalone binary candidate requires a complete KEXINIT") }
    Packet Length: uint32
