Package:
  FTP:
    operator: |
      this.ProcessSubNode("Code")
      code = string(getNodeResult("Code").Value)
      if len(code) != 3 {
        panic("ftp: invalid reply code")
      }
      this.ProcessSubNode("Separator")
      sep = getNodeResult("Separator").Value
      if sep != 0x20 && sep != 0x2d {
        panic("ftp: expected space or hyphen after reply code")
      }
      this.ProcessSubNode("Message")
    Code: string,3
    Separator: uint8
    Message: "del:\r\n;type:string"
  FTPCommand:
    operator: |
      this.ProcessSubNode("Line")
      line = string(getNodeResult("Line").Value)
      if !(line.HasPrefix("USER") || line.HasPrefix("PASS") || line.HasPrefix("QUIT") || line.HasPrefix("SYST") || line.HasPrefix("PWD") || line.HasPrefix("CWD") || line.HasPrefix("LIST") || line.HasPrefix("TYPE") || line.HasPrefix("PASV") || line.HasPrefix("PORT") || line.HasPrefix("RETR") || line.HasPrefix("STOR") || line.HasPrefix("DELE") || line.HasPrefix("MKD") || line.HasPrefix("RMD") || line.HasPrefix("NOOP") || line.HasPrefix("FEAT") || line.HasPrefix("AUTH") || line.HasPrefix("PBSZ") || line.HasPrefix("PROT") || line.HasPrefix("SIZE") || line.HasPrefix("HELP") || line.HasPrefix("REST") || line.HasPrefix("ABOR") || line.HasPrefix("STAT") || line.HasPrefix("NLST") || line.HasPrefix("APPE") || line.HasPrefix("EPSV") || line.HasPrefix("EPRT") || line.HasPrefix("MDTM") || line.HasPrefix("RNFR") || line.HasPrefix("RNTO") || line.HasPrefix("ACCT") || line.HasPrefix("SITE")) {
        panic("ftp: unknown command")
      }
    Line: "del:\r\n;type:string"
