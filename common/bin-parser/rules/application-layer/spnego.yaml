endian: big
Package:
  SPNEGO:
    operator: |
      tag = this.ProcessSubNode("Tag").Value
      if tag != 0x60 {
        panic("spnego: expected GSS-API 0x60")
      }
      this.ProcessSubNode("Length")
      l = getNodeResult("Length").Value
      if l >= 0x80 {
        panic("spnego: long-form BER length not in this rule")
      }
      if l < 2 {
        panic("spnego: token too small")
      }
      if this.HasMaxLength() && l != this.GetMaxLength() - this.Length() { panic("spnego: declared length differs from token boundary") }
      this.SetMaxLength(l + this.Length())
      this.ProcessSubNode("OID Tag")
      if getNodeResult("OID Tag").Value != 0x06 {
        panic("spnego: expected OID tag 0x06")
      }
      this.ProcessSubNode("OID Length")
      ol = getNodeResult("OID Length").Value
      if ol == 0 || ol > 32 || ol > l - 2 {
        panic("spnego: bad OID length")
      }
      this.GetSubNode("OID").SetMaxLength(ol)
      this.ProcessSubNode("OID")
      rest = l - 2 - ol
      oidBytes = []byte(getNodeResult("OID").Value)
      isSPNEGO = len(oidBytes) == 6 && oidBytes[0] == 0x2b && oidBytes[1] == 0x06 && oidBytes[2] == 0x01 && oidBytes[3] == 0x05 && oidBytes[4] == 0x05 && oidBytes[5] == 0x02
      if isSPNEGO && rest == 0 { panic("spnego: SPNEGO mechanism is missing NegotiationToken") }
      if rest > 0 && rest < 1048576 {
        this.GetSubNode("Token").SetMaxLength(rest)
        this.ProcessSubNode("Token")
      }
      return
    Tag: uint8
    Length: uint8
    OID Tag: uint8
    OID Length: uint8
    OID: string
    Token:
      operator: |
        this.ProcessSubNode("NegTag")
        this.ProcessSubNode("NegLength")
        nl = getNodeResult("NegLength").Value
        if nl >= 0x80 { panic("spnego: long-form negotiation length not in this rule") }
        if nl != this.GetMaxLength() - this.Length() { panic("spnego: negotiation token length differs from boundary") }
        if nl < 2 { panic("spnego: negotiation token is missing its sequence") }
        if nl > 0 && nl < 1048576 {
          tag = getNodeResult("NegTag").Value
          if tag == 0xa0 {
            this.ProcessByType("SPNEGOInit")
          } else {
            this.GetSubNode("Octets").SetMaxLength(nl)
            this.ProcessSubNode("Octets")
          }
        }
        return
      NegTag: uint8
      NegLength: uint8
      Octets: string
SPNEGOInit:
  operator: |
    this.ProcessSubNode("Sequence Tag")
    if getNodeResult("Sequence Tag").Value != 0x30 {
      panic("spnego: expected NegTokenInit SEQUENCE")
    }
    this.ProcessSubNode("Sequence Length")
    sl = getNodeResult("Sequence Length").Value
    if sl >= 0x80 || sl != this.GetMaxLength() - this.Length() { panic("spnego: NegTokenInit sequence length differs from boundary") }
    this.ProcessSubNode("MechTypes Tag")
    if getNodeResult("MechTypes Tag").Value != 0xa0 {
      panic("spnego: expected mechTypes [0]")
    }
    this.ProcessSubNode("MechTypes Length")
    mtl = getNodeResult("MechTypes Length").Value
    if mtl < 4 || mtl >= 0x80 || mtl > this.GetMaxLength() - this.Length() { panic("spnego: invalid mechTypes length") }
    this.ProcessSubNode("MechList Tag")
    if getNodeResult("MechList Tag").Value != 0x30 {
      panic("spnego: expected MechTypeList SEQUENCE")
    }
    this.ProcessSubNode("MechList Length")
    mll = getNodeResult("MechList Length").Value
    if mll != mtl - 2 { panic("spnego: mechanism list length differs from mechTypes") }
    mechEnd = this.Length() + mll
    this.ProcessSubNode("MechOID Tag")
    if getNodeResult("MechOID Tag").Value != 0x06 {
      panic("spnego: expected MechType OID")
    }
    this.ProcessSubNode("MechOID Length")
    mol = getNodeResult("MechOID Length").Value
    if mol <= 0 || mol > 32 || mol > mechEnd - this.Length() {
      panic("spnego: bad MechType OID length")
    }
    this.GetSubNode("MechOID").SetMaxLength(mol)
    this.ProcessSubNode("MechOID")
    for this.Length() < mechEnd {
      if mechEnd - this.Length() < 2 { panic("spnego: truncated additional mechanism OID") }
      this.ProcessByType("SPNEGOMechOID", "Additional MechOID")
      if this.Length() > mechEnd { panic("spnego: additional mechanism OID exceeds list") }
    }
    if this.GetMaxLength() > this.Length() {
      // Optional NegTokenInit fields are retained without interpreting their
      // mechanism-specific contents; their enclosing lengths remain checked.
      this.GetSubNode("Optional Fields").SetMaxLength(this.GetMaxLength() - this.Length())
      this.ProcessSubNode("Optional Fields")
    }
    return
  Sequence Tag: uint8
  Sequence Length: uint8
  MechTypes Tag: uint8
  MechTypes Length: uint8
  MechList Tag: uint8
  MechList Length: uint8
  MechOID Tag: uint8
  MechOID Length: uint8
  MechOID: string
  Optional Fields: raw
SPNEGOMechOID:
  operator: |
    tag = this.ProcessSubNode("Tag").Value
    if tag != 0x06 { panic("spnego: expected additional mechanism OID") }
    size = this.ProcessSubNode("Length").Value
    if size == 0 || size > 32 { panic("spnego: bad additional mechanism OID length") }
    this.GetSubNode("OID").SetMaxLength(size)
    this.ProcessSubNode("OID")
  Tag: uint8
  Length: uint8
  OID: raw
