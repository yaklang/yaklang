Package:
  HTTP:
    operator: |
      res,op = this.TryProcessByType("FirstWorld")
      op.Recovery()
      if string(res.Value).HasPrefix("HTTP/") {
        this.ProcessSubNode("HTTP Response")
      }else{
        this.ProcessSubNode("HTTP Request")
      }
    HTTP Request:
      FirstLine:
        unpack: true
        Method: "del: ;type:string"
        Path: "del: ;type:string"
        Version: "del:\r\n;type:string"
      Headers: Headers
      Body: Body
    HTTP Response:
      FirstLine:
        unpack: true
        Version: "del: ;type:string"
        Status: "del: ;type:string"
        Message: "del:\r\n;type:string"
      Headers: Headers
      Body: Body
FirstWorld: "del: ;type:string"
Body:
  operator: |
    if getCtx("isChunked") {
      this.ProcessSubNode("DataChunks")
      return
    }
    l = getCtx("body_length")
    if l {
      if l > 0 && l < 1048576 {
        this.GetSubNode("Octets").SetMaxLength(l)
        this.ProcessSubNode("Octets")
      }
    }
    return
  Octets: string
  DataChunks:
    list: true
    DataChunk:
      operator: |
        res = this.GetSubNode("Size").Process().Value
        s = string(res)
        length = 0
        got = false
        for i = 0; i < len(s); i++ {
          c = s[i]
          v = -1
          if c >= 48 && c <= 57 {
            v = c - 48
          } else if c >= 97 && c <= 102 {
            v = c - 97 + 10
          } else if c >= 65 && c <= 70 {
            v = c - 65 + 10
          } else {
            break
          }
          length = length * 16 + v
          got = true
        }
        if !got {
          panic("http: invalid chunk size")
        }
        if length == 0 {
          setCtx("inList",false)
          return
        }
        if length > 0 && length < 1048576 {
          this.GetSubNode("Octets").SetMaxLength(length)
          this.ProcessSubNode("Octets")
        }
        this.ProcessSubNode("End")
      Size: "type:string;del:\r\n"
      Octets: string
      End: "del:\r\n;type:string"
Headers:
  operator: |
    for {
      data := this.NewElement().Process().Value
      if data == nil || len(data) == 0 {
        // this.SetChildren(this.GetChildren()[:-1])
        return
      }
      if string(data).HasPrefix("Content-Length: ") {
        l = int(string(data)[len("Content-Length: "):])
        setCtx("body_length", l)
      }
      if string(data).HasPrefix("Transfer-Encoding: chunked") {
        setCtx("isChunked", true)
      }
    }
  list: true
  Item: "del:\r\n;type:string"
