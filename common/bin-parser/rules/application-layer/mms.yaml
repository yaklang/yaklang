  MMSPDU:
    operator: |
      this.ProcessSubNode("PDU Tag")
      pduTag = getNodeResult("PDU Tag").Value
      if pduTag != 0xa0 && pduTag != 0xa1 && pduTag != 0xa2 && pduTag != 0xa8 && pduTag != 0xa9 && pduTag != 0x8b && pduTag != 0x8c {
        panic("mms: unsupported PDU tag")
      }
      this.ProcessSubNode("PDU Length")
      pduLength = getNodeResult("PDU Length").Value
      if pduLength >= 0x80 {
        panic("mms: long-form PDU length is unsupported")
      }
      if pduLength != this.GetMaxLength() - this.Length() {
        panic("mms: PDU length does not match input")
      }

      if pduTag == 0xa8 {
        this.GetSubNode("Initiate Request").SetMaxLength(pduLength)
        this.ProcessSubNode("Initiate Request")
      } else if pduTag == 0xa9 {
        this.GetSubNode("Initiate Response").SetMaxLength(pduLength)
        this.ProcessSubNode("Initiate Response")
      } else if pduTag == 0xa0 {
        this.GetSubNode("Confirmed Request").SetMaxLength(pduLength)
        this.ProcessSubNode("Confirmed Request")
      } else if pduTag == 0xa1 {
        this.GetSubNode("Confirmed Response").SetMaxLength(pduLength)
        this.ProcessSubNode("Confirmed Response")
      } else if pduTag == 0xa2 {
        this.GetSubNode("Confirmed Error").SetMaxLength(pduLength)
        this.ProcessSubNode("Confirmed Error")
      } else if pduLength != 0 {
        panic("mms: conclude PDU must have an empty body")
      }
      if this.Length() != this.GetMaxLength() {
        panic("mms: PDU body was not completely consumed")
      }
      return
