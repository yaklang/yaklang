# Explicit passive CQL v4 / pre-READY v5 and modern internode Initiate layouts.
# Complete uncompressed, unflagged envelope; caller supplies TCP/frame context.
# No later v5 CRC24 framing, queries, compression or session inference.
# Internode checksum uses the Apache CRC32 initialization prefix.
endian: big
unit: byte
Package:
  CQLOptions4Fields:
    operator: |
      err = parseCassandraFields("options4")
      if err != nil { panic(err) }
  CQLOptions4FieldsCarrier:
    operator: |
      if !this.HasMaxLength() || this.GetMaxLength("bit") == 0 || this.GetMaxLength("bit") % 8 != 0 { panic("cassandra-fields: explicit nonempty byte boundary required") }
      if this.GetMaxLength() > 1048576 { panic("cassandra-fields: exceeds 1 MiB resource limit") }
      candidate, trial = this.TryProcessByType("CQLOptions4FieldsExact", "CQLOptions4Fields")
      if trial.OK { trial.Save(); return }
      trial.Recovery()
      raw = this.NewUnknownNode("Unparsed Cassandra Wire")
      raw.SetMaxLength(this.GetMaxLength())
      raw.Process()
