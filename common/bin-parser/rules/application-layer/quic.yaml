endian: big
Package:
  QUIC:
    operator: |
      this.ProcessSubNode("First Byte")
      first = getNodeResult("First Byte").Value
      long = (first & 0x80) != 0
      if !long {
        if (first & 0x40) == 0 {
          panic("quic: short header missing fixed bit")
        }
        res, remaining = this.TryProcessByType("QUICPeekByte")
        remaining.Recovery()
        if remaining.OK {
          this.ProcessSubNode("Protected Payload")
        }
        return
      }
      this.ProcessSubNode("Version")
      ver = getNodeResult("Version").Value
      if ver != 0 && (first & 0x40) == 0 {
        panic("quic: long header missing fixed bit")
      }
      this.ProcessSubNode("DCID Length")
      dlen = getNodeResult("DCID Length").Value
      if dlen > 20 {
        panic("quic: DCID longer than 20")
      }
      if dlen > 0 {
        this.GetSubNode("DCID").SetMaxLength(dlen)
        this.ProcessSubNode("DCID")
      }
      this.ProcessSubNode("SCID Length")
      slen = getNodeResult("SCID Length").Value
      if slen > 20 {
        panic("quic: SCID longer than 20")
      }
      if slen > 0 {
        this.GetSubNode("SCID").SetMaxLength(slen)
        this.ProcessSubNode("SCID")
      }
      pktType = (first >> 4) & 0x03
      if (ver == 1 && pktType == 0) || (ver == 0x6b3343cf && pktType == 1) {
        res,op = this.TryProcessByType("QUICToken")
        if op.OK {
          err = op.Save()
          if err != nil {
            panic(err)
          }
        } else {
          err = op.Recovery()
          if err != nil {
            panic(err)
          }
        }
      }
      res, remaining = this.TryProcessByType("QUICPeekByte")
      remaining.Recovery()
      if remaining.OK {
        this.ProcessSubNode("Protected Payload")
      }
    First Byte: uint8
    Version: uint32
    DCID Length: uint8
    DCID: raw
    SCID Length: uint8
    SCID: raw
    Protected Payload:
      list: true
      Octet: uint8
      operator: |
        for {
          res, probe = this.TryProcessByType("QUICPeekByte")
          probe.Recovery()
          if !probe.OK {
            setCtx("inList", false)
            break
          }
          this.NewElement().Process()
        }
  QUICInitialTokenFields: QUICToken

QUICToken:
  operator: |
    first, probe = this.TryProcessByType("QUICPeekByte")
    probe.Recovery()
    if !probe.OK { panic("quic: missing token length") }
    prefix = first.Value >> 6
    if prefix != 0 {
      this.ProcessSubNode("Length Encoding")
      this.GetSubNode("Token Length").SetCfg("type", "uint64")
      this.GetSubNode("Token Length").SetMaxLength((1 << prefix)*8-2, "bit")
    }
    this.ProcessSubNode("Token Length")
    tlen = getNodeResult("Token Length").Value
    if tlen > 20480 { panic("quic: token exceeds selected 20 KiB resource bound") }
    if tlen > 0 {
      this.GetSubNode("Token").SetMaxLength(tlen)
      this.ProcessSubNode("Token")
    }
  Length Encoding: uint8,2bit
  Token Length: uint8
  Token: raw

QUICPeekByte: uint8
