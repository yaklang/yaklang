# Explicit MS-TDS 7.1 or 7.2 SQLBatch/RPC/response layout, complete message.
# Caller supplies version, cleartext context and ordered TCP bytes. All TDS
# packet headers are retained, even when a value spans multiple packets.
# Columns are local to the current response only. No session state or execution.
# Unsupported layouts use exact raw fallback. Bounds: 1 MiB, 4096 packets,
# requests/tokens/columns/values/chunks and 65536 projected leaves.
endian: big
unit: byte
Package:
  TDSBatch71Fields:
    operator: |
      err = parseTDSFields("batch71")
      if err != nil { panic(err) }
  TDSBatch71FieldsCarrier:
    operator: |
      if !this.HasMaxLength() || this.GetMaxLength("bit") == 0 || this.GetMaxLength("bit") % 8 != 0 { panic("tds-fields: explicit nonempty byte boundary required") }
      if this.GetMaxLength() > 1048576 { panic("tds-fields: exceeds 1 MiB resource limit") }
      candidate, trial = this.TryProcessByType("TDSBatch71FieldsExact", "TDSBatch71Fields")
      if trial.OK { trial.Save(); return }
      trial.Recovery()
      raw = this.NewUnknownNode("Unparsed TDS Wire")
      raw.SetMaxLength(this.GetMaxLength())
      raw.Process()
