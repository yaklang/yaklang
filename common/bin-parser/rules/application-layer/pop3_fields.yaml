# Explicit, complete POP3 layouts with caller-selected response context.
# RFC 1939/2449/5034; no command type inferred from numeric response text.
# https://www.rfc-editor.org/rfc/rfc1939.html
# https://www.rfc-editor.org/rfc/rfc2449.html
# https://www.rfc-editor.org/rfc/rfc5034.html
# AUTH without a mechanism is retained as a legacy probe, marked not validated.
# Encoded continuation values remain raw; no mechanism/session outcome claim.
# Message layout: seven-bit dot block, header unfolding and original body lines.
# Historical pop3.yaml is unchanged. No TCP reassembly or session inference.
# Complete messages additionally expose bounded MIME entities/transfer values
# (RFC 2045/2046). Derived values map to original encoded ranges, never invented
# decoded wire leaves. Unknown encodings stay opaque; invalid MIME keeps its
# transport tree with an explicit diagnostic. No rendering or external fetches.
# MIME limits: 64 parts, depth 8, 1 MiB total decoded, 1024 headers per entity.
# Charset text conversion only covers valid US-ASCII/UTF-8; bytes remain available.
# https://www.rfc-editor.org/rfc/rfc2045.html
# https://www.rfc-editor.org/rfc/rfc2046.html
# Local list cap 4096; message cap 1 MiB/8192 lines/1024 headers (1000 per line).
# Base commands <=255 bytes; status/list lines <=512; continuation cap 64 KiB.
endian: big
unit: byte
Package:
  POP3CommandFields:
    operator: |
      err = parsePOP3Fields("command")
      if err != nil { panic(err) }
  POP3CommandFieldsCarrier:
    operator: |
      if !this.HasMaxLength() || this.GetMaxLength("bit") == 0 || this.GetMaxLength("bit") % 8 != 0 { panic("pop3-fields: explicit nonempty byte boundary required") }
      if this.GetMaxLength() > 255 { panic("pop3-fields: exceeds 255-byte resource limit") }
      candidate, trial = this.TryProcessByType("POP3CommandExact", "POP3CommandFields")
      if trial.OK { trial.Save(); return }
      trial.Recovery()
      raw = this.NewUnknownNode("Unparsed POP3 Wire")
      raw.SetMaxLength(this.GetMaxLength())
      raw.Process()
