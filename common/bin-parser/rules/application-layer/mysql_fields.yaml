# Explicit, bounded uncompressed classic-protocol layouts. Old mysql.yaml is unchanged.
# https://dev.mysql.com/doc/dev/mysql-server/latest/PAGE_PROTOCOL.html
# https://mariadb.com/docs/server/reference/clientserver-protocol/4-server-response-packets/result-set-packets
# The caller chooses phase/direction/capabilities, never inferred from packet markers.
# response41 requires MySQL reserved layout; mariadb-response41 requires the
# MariaDB server context, including its third capability word. SSLRequest is a
# request to switch transport, not proof of an established TLS session.
# Command grammar excludes CLIENT_QUERY_ATTRIBUTES; OK41 excludes SESSION_TRACK.
# ResultSet41 requires fresh column definitions and legacy EOF terminators;
# MariaDBTextResultSet additionally requires CACHE_METADATA + EXTENDED_METADATA.
# Cached metadata, compressed framing, binary/prepared rows, local-file requests,
# deprecated-EOF resultsets and multi-packet 0xffffff fragments are not implied.
# Local limits: 1 MiB; 4096 columns, attributes, metadata items, rows/total values.
# SQL and row values retain octets, not evaluated queries or assumed text encoding.
