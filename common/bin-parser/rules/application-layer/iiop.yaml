# CORBA 3.2 Interoperability, chapter 9; GIOP 1.0 through 1.3.
# https://www.omg.org/spec/CORBA/3.2/Interoperability/PDF
# Parse-only CDR envelope and standard message headers. Operation-dependent
# stubs and TaggedProfile data remain opaque; no implicit stream reassembly.
endian: big
unit: byte
Package:
  GIOP:
    operator: |
      err = parseGIOPMessage(true)
      if err != nil { panic(err) }

  GIOPStream:
    list: true
    operator: |
      if !this.HasMaxLength() { panic("giop: stream requires explicit boundary") }
      if this.GetMaxLength("bit") % 8 != 0 || this.GetMaxLength() < 12 {
        panic("giop: incomplete stream boundary")
      }
      count = 0
      for this.Length() < this.GetMaxLength() {
        if count >= 4096 { panic("giop: stream message count exceeds 4096") }
        this.ProcessByType("GIOPStreamMessage", "GIOP")
        count++
      }

  GIOPCarrier:
    operator: |
      if !this.HasMaxLength() || this.GetMaxLength() == 0 { panic("giop: carrier requires a nonempty boundary") }
      if this.GetMaxLength("bit") % 8 != 0 { panic("giop: carrier requires a byte boundary") }
      value, trial = this.TryProcessByType("GIOPExactMessage", "GIOP")
      if trial.OK { trial.Save(); return }
      trial.Recovery()
      raw = this.NewUnknownNode("GIOP Payload")
      raw.SetMaxLength(this.GetMaxLength())
      raw.Process()

GIOPStreamMessage:
  operator: |
    err = parseGIOPMessage(false)
    if err != nil { panic(err) }

GIOPExactMessage: "import:application-layer/iiop.yaml;node:GIOP"
