endian: big
Package:
  GIOP:
    operator: |
      this.ProcessSubNode("Magic")
      mag = getNodeResult("Magic").Value
      if mag[0] != 0x47 || mag[1] != 0x49 || mag[2] != 0x4f || mag[3] != 0x50 {
        panic("giop: magic must be GIOP")
      }
      this.ProcessSubNode("Major")
      this.ProcessSubNode("Minor")
      this.ProcessSubNode("Flags")
      if (getNodeResult("Flags").Value & 1) == 1 {
        panic("giop: little-endian GIOP")
      }
      this.ProcessSubNode("Message Type")
      mt = getNodeResult("Message Type").Value
      if mt > 7 {
        panic("giop: unknown message type")
      }
      this.ProcessSubNode("Message Size")
      l = getNodeResult("Message Size").Value
      if l >= 1048576 {
        panic("giop: message too large")
      }
      if l > 0 {
        this.SetMaxLength(this.Length()+l)
      }
      if mt == 3 && l >= 8 {
        this.ProcessByType("LocateRequest")
        return
      }
      if mt == 0 && l >= 8 {
        this.ProcessByType("GIOPRequest")
        return
      }
    Magic: raw,4
    Major: uint8
    Minor: uint8
    Flags: uint8
    Message Type: uint8
    Message Size: uint32
LocateRequest:
  operator: |
    this.ProcessSubNode("Request ID")
    this.ProcessSubNode("Addr Disc")
    this.ProcessSubNode("Addr Pad")
    this.ProcessSubNode("Key Len")
    n = getNodeResult("Key Len").Value
    if n > 0 && n < 1048576 {
      this.GetSubNode("Object Key").SetMaxLength(n)
      this.ProcessSubNode("Object Key")
    }
  Request ID: uint32
  Addr Disc: uint16
  Addr Pad: raw,2
  Key Len: uint32
  Object Key: string
GIOPRequest:
  operator: |
    this.ProcessSubNode("Request ID")
    this.ProcessSubNode("Response Flags")
    this.ProcessSubNode("Reserved")
    this.ProcessSubNode("Addr Disc")
    this.ProcessSubNode("Addr Pad")
    this.ProcessSubNode("Key Len")
    n = getNodeResult("Key Len").Value
    if n > 0 && n < 1048576 {
      this.GetSubNode("Object Key").SetMaxLength(n)
      this.ProcessSubNode("Object Key")
    }
    this.ProcessSubNode("Op Len")
    ol = getNodeResult("Op Len").Value
    if ol > 0 && ol < 512 {
      this.GetSubNode("Operation").SetMaxLength(ol)
      this.ProcessSubNode("Operation")
    }
  Request ID: uint32
  Response Flags: uint8
  Reserved: raw,3
  Addr Disc: uint16
  Addr Pad: raw,2
  Key Len: uint32
  Object Key: string
  Op Len: uint32
  Operation: string
