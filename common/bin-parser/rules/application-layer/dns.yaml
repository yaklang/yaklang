# Additional named RDATA: RFC 3596 section 2.2 (AAAA), RFC 1035 section
# 3.3.14 (TXT), RFC 8659 section 4.1 (CAA). CAA values remain binary octets;
# exposing a CAA property does not validate DNSSEC or certificate issuance.
endian: big
unit: byte
Package:
  DNS:
      Header:
          operator: |
              this.ForEachChild(func(node) { 
                  res = node.Process()
                  switch node.Name {
                    case "Flags":
                      flags = res.Value
                      qr := (flags >> 15) & 0x1
                      opcode := (flags >> 11) & 0xF
                      aa := (flags >> 10) & 0x1
                      tc := (flags >> 9) & 0x1
                      rd := (flags >> 8) & 0x1
                      ra := (flags >> 7) & 0x1
                      z := (flags >> 4) & 0x7
                      rcode := flags & 0xF
                      node.AddInfo("QR", qr == 0 ? "Query" : "Response")
                      node.AddInfo("Opcode", opcode)
                      node.AddInfo("AA", aa)
                      node.AddInfo("TC", tc)
                      node.AddInfo("RD", rd)
                      node.AddInfo("RA", ra)
                      node.AddInfo("Z", z)
                      node.AddInfo("RCODE", rcode)
                      # dump(qr, opcode, aa, tc, rd, ra, z, rcode)
                  }
              })
          ID: uint16
          Flags: uint16
          Questions: uint16
          Answer RRs: uint16
          Authority RRs: uint16
          Additional RRs: uint16
      Questions:
          list: true
          list-length-from-field: "../Header/Questions"
          Question:
            Name: String
            Type: uint16
            Class: uint16
      Answers:
          list: true
          list-length-from-field: "../Header/Answer RRs"
          Answer:
            operator: |
              this.ProcessSubNode("Name")
              this.ProcessSubNode("Type")
              this.ProcessSubNode("Class")
              this.ProcessSubNode("TTL")
              this.ProcessSubNode("RDLength")
              t = getNodeResult("Type").Value
              l = getNodeResult("RDLength").Value
              if t == 1 && l == 4 {
                this.ProcessByType("DNSA")
                return
              }
              if t == 28 {
                if l != 16 { panic("dns: AAAA RDATA length must be 16") }
                this.ProcessByType("DNSAAAA")
                return
              }
              if t == 16 {
                if l == 0 { panic("DNS TXT requires at least one character-string") }
                this.ProcessByType("DNSTXT")
                return
              }
              if t == 257 {
                if l < 3 { panic("dns: CAA RDATA is too short") }
                this.ProcessByType("DNSCAA")
                return
              }
              if t == 12 && l > 0 && l < 1048576 {
                this.ProcessByType("DNSPTR")
                return
              }
              if l > 0 && l < 1048576 {
                this.GetSubNode("RData").SetMaxLength(l)
                this.ProcessSubNode("RData")
              }
              return
            Name:
              operator: |
                  res,op = this.TryProcessSubNode("PointerFlag")
                  if op.OK {
                      res = res.Value
                      if res == 3 {
                          op.Save()
                          this.ProcessSubNode("Pointer")
                      }else{
                          op.Recovery()
                          this.ProcessSubNode("Labels")
                      }
                  }else{
                      op.Recovery()
                      panic(op.Message)
                  }
              PointerFlag: uint8,2bit
              Pointer: uint16,14bit
              Labels: String
            Type: uint16
            Class: uint16
            TTL: uint32
            RDLength: uint16
            RData: "type:raw;length-from-field:../RDLength"
      Authority:
          list: true
          list-length-from-field: "../Header/Authority RRs"
          Record:
            operator: |
              this.ProcessSubNode("Name")
              this.ProcessSubNode("Type")
              this.ProcessSubNode("Class")
              this.ProcessSubNode("TTL")
              this.ProcessSubNode("RDLength")
              t = getNodeResult("Type").Value
              l = getNodeResult("RDLength").Value
              if t == 1 && l == 4 {
                this.ProcessByType("DNSA")
                return
              }
              if t == 28 {
                if l != 16 { panic("dns: AAAA RDATA length must be 16") }
                this.ProcessByType("DNSAAAA")
                return
              }
              if t == 16 {
                if l == 0 { panic("DNS TXT requires at least one character-string") }
                this.ProcessByType("DNSTXT")
                return
              }
              if t == 257 {
                if l < 3 { panic("dns: CAA RDATA is too short") }
                this.ProcessByType("DNSCAA")
                return
              }
              if t == 12 && l > 0 && l < 1048576 {
                this.ProcessByType("DNSPTR")
                return
              }
              if l > 0 && l < 1048576 {
                this.GetSubNode("RData").SetMaxLength(l)
                this.ProcessSubNode("RData")
              }
              return
            Name:
              operator: |
                  res,op = this.TryProcessSubNode("PointerFlag")
                  if op.OK {
                      res = res.Value
                      if res == 3 {
                          op.Save()
                          this.ProcessSubNode("Pointer")
                      }else{
                          op.Recovery()
                          this.ProcessSubNode("Labels")
                      }
                  }else{
                      op.Recovery()
                      panic(op.Message)
                  }
              PointerFlag: uint8,2bit
              Pointer: uint16,14bit
              Labels: String
            Type: uint16
            Class: uint16
            TTL: uint32
            RDLength: uint16
            RData: "type:raw;length-from-field:../RDLength"
      Additional:
          list: true
          list-length-from-field: "../Header/Additional RRs"
          Record:
            operator: |
              this.ProcessSubNode("Name")
              this.ProcessSubNode("Type")
              this.ProcessSubNode("Class")
              this.ProcessSubNode("TTL")
              this.ProcessSubNode("RDLength")
              t = getNodeResult("Type").Value
              l = getNodeResult("RDLength").Value
              if t == 1 && l == 4 {
                this.ProcessByType("DNSA")
                return
              }
              if t == 28 {
                if l != 16 { panic("dns: AAAA RDATA length must be 16") }
                this.ProcessByType("DNSAAAA")
                return
              }
              if t == 16 {
                if l == 0 { panic("DNS TXT requires at least one character-string") }
                this.ProcessByType("DNSTXT")
                return
              }
              if t == 257 {
                if l < 3 { panic("dns: CAA RDATA is too short") }
                this.ProcessByType("DNSCAA")
                return
              }
              if t == 12 && l > 0 && l < 1048576 {
                this.ProcessByType("DNSPTR")
                return
              }
              if l > 0 && l < 1048576 {
                this.GetSubNode("RData").SetMaxLength(l)
                this.ProcessSubNode("RData")
              }
              return
            Name:
              operator: |
                  res,op = this.TryProcessSubNode("PointerFlag")
                  if op.OK {
                      res = res.Value
                      if res == 3 {
                          op.Save()
                          this.ProcessSubNode("Pointer")
                      }else{
                          op.Recovery()
                          this.ProcessSubNode("Labels")
                      }
                  }else{
                      op.Recovery()
                      panic(op.Message)
                  }
              PointerFlag: uint8,2bit
              Pointer: uint16,14bit
              Labels: String
            Type: uint16
            Class: uint16
            TTL: uint32
            RDLength: uint16
            RData: "type:raw;length-from-field:../RDLength"
String:
  list: true
  Label:
    operator: |
      count = this.ProcessSubNode("Count").Value
      if count == 0 {
        setCtx("inList",false)
        return
      }
      # RFC 1035 4.1.4: a literal label sequence may end in a pointer.
      # Consume exactly the second pointer octet and end this encoded name;
      # interpreting 0xc0 as a label length loses every following RR boundary.
      if (count & 192) == 192 {
        low = this.ProcessSubNode("PointerLow").Value
        this.AddInfo("Pointer Offset", ((count & 63) << 8) | low)
        setCtx("inList",false)
        return
      }
      if count > 63 { panic("dns: reserved label type") }
      this.GetSubNode("Text").SetMaxLength(count)
      this.ProcessSubNode("Text")
    Count: uint8
    PointerLow: uint8
    Text: string
DNSA:
  Address: raw,4
DNSPTR:
  Name: String

DNSAAAA:
  Address: raw,16
DNSTXT:
  length-from-field: ../RDLength
  Strings:
    list: true
    String: DNSCharacterString
    operator: |
      count = 0
      for this.Length() < this.GetMaxLength() {
        if count >= 4096 { panic("dns: TXT exceeds 4096 character-strings") }
        this.NewElement().Process()
        count = count + 1
      }
DNSCharacterString:
  operator: |
    n = this.ProcessSubNode("Length").Value
    if n > this.GetMaxLength() - 1 { panic("dns: TXT character-string exceeds RDATA") }
    if n > 0 {
      this.GetSubNode("Text").SetMaxLength(n)
      this.ProcessSubNode("Text")
    }
  Length: uint8
  Text: string
DNSCAA:
  length-from-field: ../RDLength
  operator: |
    this.ProcessSubNode("Flags")
    n = this.ProcessSubNode("TagLength").Value
    if n == 0 || n > this.GetMaxLength() - 2 { panic("dns: CAA tag length is invalid") }
    this.GetSubNode("Tag").SetMaxLength(n)
    tag = this.ProcessSubNode("Tag").Value
    for _, c = range []byte(tag) {
      if !((c >= 65 && c <= 90) || (c >= 97 && c <= 122) || (c >= 48 && c <= 57)) {
        panic("dns: CAA tag must be ASCII alphanumeric")
      }
    }
    remaining = this.GetMaxLength() - 2 - n
    if remaining > 0 {
      this.GetSubNode("Value").SetMaxLength(remaining)
      this.ProcessSubNode("Value")
    }
  Flags: uint8
  TagLength: uint8
  Tag: string
  Value: raw
