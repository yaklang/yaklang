endian: big
Package:
  PostgreSQL:
    operator: |
      # Startup/SSLRequest have no type byte: first 4 bytes are length.
      # Typed messages start with an ASCII letter then int32 length.
      first = this.ProcessSubNode("First").Value
      if (first >= 0x41 && first <= 0x5a) || (first >= 0x61 && first <= 0x7a) {
        this.ProcessSubNode("Length")
        l = getNodeResult("Length").Value
        if l < 4 || l > 0x1000000 {
          panic("postgresql: length too small or too large")
        }
        if l > 4 {
          this.GetSubNode("Payload").SetMaxLength(l - 4)
          this.ProcessSubNode("Payload")
        }
        return
      }
      # unread First as part of Length: First was the high byte of a 32-bit length.
      # Reconstruct startup: Length = first<<24 | next 3 bytes. Easier to require
      # typed messages OR dedicated Startup/SSLRequest entry points.
      panic("postgresql: use Startup or SSLRequest for untyped client packets")
    First: uint8
    Length: uint32
    Payload:
      operator: |
        first = getNodeResult("../First").Value
        if first == 0x52 {
          this.ProcessSubNode("AuthType")
          return
        }
        if first == 0x51 {
          this.ProcessByType("PostgreSQLQuery")
          return
        }
        if first == 0x45 {
          this.ProcessByType("PostgreSQLError")
          return
        }
        if first == 0x5a {
          this.ProcessSubNode("Ready")
          return
        }
        if first == 0x50 {
          this.ProcessByType("PostgreSQLParse")
          return
        }
        if first == 0x42 {
          this.ProcessByType("PostgreSQLBind")
          return
        }
        if first == 0x54 {
          this.ProcessByType("PostgreSQLRowDescription")
          return
        }
        if first == 0x44 && getCtx("postgresqlDirection") == "backend" {
          this.ProcessByType("PostgreSQLDataRow")
          return
        }
        if first == 0x43 && getCtx("postgresqlDirection") == "backend" {
          this.ProcessByType("PostgreSQLCommandComplete")
          return
        }
        rem = 0
        if this.GetMaxLength() > this.Length() {
          rem = this.GetMaxLength() - this.Length()
        }
        if rem > 0 && rem < 1048576 {
          this.GetSubNode("Octets").SetMaxLength(rem)
          this.ProcessSubNode("Octets")
        }
        return
      AuthType: uint32
      Ready: uint8
      Octets: string
  Startup:
    operator: |
      this.ProcessSubNode("Length")
      l = getNodeResult("Length").Value
      if l < 8 {
        panic("postgresql: startup length too small")
      }
      this.ProcessSubNode("Protocol")
      proto = getNodeResult("Protocol").Value
      if proto == 80877103 {
        return
      }
      if proto != 196608 && proto != 196608+1 && proto != 131072 {
        panic("postgresql: unknown startup protocol")
      }
      this.GetSubNode("Parameters").SetMaxLength(l - 8)
      this.ProcessSubNode("Parameters")
    Length: uint32
    Protocol: uint32
    Parameters:
      list: true
      Pair: PGParam
      operator: |
        for {
          if this.GetRemainingSpace() == 0 {
            break
          }
          ele = this.NewElement()
          ele.Process()
          if ele.GetSubNode("Name").Result().Value == "" {
            break
          }
        }
  SSLRequest:
    operator: |
      this.ProcessSubNode("Length")
      this.ProcessSubNode("Code")
      if getNodeResult("Length").Value != 8 {
        panic("postgresql: SSLRequest length must be 8")
      }
      if getNodeResult("Code").Value != 80877103 {
        panic("postgresql: SSLRequest code mismatch")
      }
    Length: uint32
    Code: uint32
  CancelRequest:
    operator: |
      this.ProcessSubNode("Length")
      this.ProcessSubNode("Code")
      this.ProcessSubNode("ProcessID")
      this.ProcessSubNode("SecretKey")
      if getNodeResult("Code").Value != 80877102 {
        panic("postgresql: CancelRequest code mismatch")
      }
    Length: uint32
    Code: uint32
    ProcessID: uint32
    SecretKey: uint32
PostgreSQLQuery:
  SQL: "del:\0;type:string"
PostgreSQLParse:
  operator: |
    this.ProcessSubNode("Statement")
    this.ProcessSubNode("Query")
    this.ProcessSubNode("Parameter Type Count")
    n = getNodeResult("Parameter Type Count").Value
    if n > 4096 {
      panic("postgresql: too many parameter types")
    }
    if n > 0 { this.ProcessSubNode("Parameter Types") }
  Statement: "del:\0;type:string"
  Query: "del:\0;type:string"
  Parameter Type Count: uint16
  Parameter Types:
    list: true
    Item: PostgreSQLParamOID
    operator: |
      count = getNodeResult("../Parameter Type Count").Value
      i = 0
      for i < count {
        this.NewElement().Process()
        i = i + 1
      }
PostgreSQLBind:
  operator: |
    this.ProcessSubNode("Portal")
    this.ProcessSubNode("Statement")
    this.ProcessSubNode("Parameter Format Count")
    fc = getNodeResult("Parameter Format Count").Value
    if fc > 4096 {
      panic("postgresql: too many parameter formats")
    }
    if fc > 0 { this.ProcessSubNode("Parameter Formats") }
    this.ProcessSubNode("Parameter Count")
    pc = getNodeResult("Parameter Count").Value
    if fc > 1 && fc != pc { panic("postgresql: parameter format count mismatch") }
    if pc > 4096 {
      panic("postgresql: too many parameters")
    }
    if pc > 0 { this.ProcessSubNode("Parameters") }
    this.ProcessSubNode("Result Format Count")
    rc = getNodeResult("Result Format Count").Value
    if rc > 4096 {
      panic("postgresql: too many result formats")
    }
    if rc > 0 { this.ProcessSubNode("Result Formats") }
  Portal: "del:\0;type:string"
  Statement: "del:\0;type:string"
  Parameter Format Count: uint16
  Parameter Count: uint16
  Result Format Count: uint16
  Parameter Formats:
    list: true
    Item: PostgreSQLFormat
    operator: |
      count = getNodeResult("../Parameter Format Count").Value
      i = 0
      for i < count {
        this.NewElement().Process()
        i = i + 1
      }
  Parameters:
    list: true
    Item: PostgreSQLValue
    operator: |
      count = getNodeResult("../Parameter Count").Value
      i = 0
      for i < count {
        this.NewElement().Process()
        i = i + 1
      }
  Result Formats:
    list: true
    Item: PostgreSQLFormat
    operator: |
      count = getNodeResult("../Result Format Count").Value
      i = 0
      for i < count {
        this.NewElement().Process()
        i = i + 1
      }
PostgreSQLParamOID:
  operator: |
    this.ProcessSubNode("OID")
  OID: uint32
PostgreSQLFormat:
  operator: |
    this.ProcessSubNode("Format Code")
    if getNodeResult("Format Code").Value > 1 { panic("postgresql: invalid format code") }
  Format Code: uint16
PostgreSQLValue:
  operator: |
    this.ProcessSubNode("Length")
    n = getNodeResult("Length").Value
    if n == 0xffffffff {
      return
    }
    if n > 1048576 { panic("postgresql: invalid or oversized value length") }
    if n > 0 {
      this.GetSubNode("Value").SetMaxLength(n)
      this.ProcessSubNode("Value")
    }
  Length: uint32
  Value: raw
PostgreSQLRowDescription:
  operator: |
    this.ProcessSubNode("Column Count")
    n = getNodeResult("Column Count").Value
    if n > 4096 {
      panic("postgresql: too many columns")
    }
    if n > 0 { this.ProcessSubNode("Columns") }
  Column Count: uint16
  Columns:
    list: true
    Item: PostgreSQLColumn
    operator: |
      count = getNodeResult("../Column Count").Value
      i = 0
      for i < count {
        this.NewElement().Process()
        i = i + 1
      }
PostgreSQLColumn:
  operator: |
    this.ProcessSubNode("Column Name")
    this.ProcessSubNode("Table OID")
    this.ProcessSubNode("Attribute Number")
    this.ProcessSubNode("Type OID")
    this.ProcessSubNode("Type Size")
    this.ProcessSubNode("Type Modifier")
    this.ProcessSubNode("Format Code")
    if getNodeResult("Format Code").Value > 1 { panic("postgresql: invalid column format code") }
  Column Name: "del:\0;type:string"
  Table OID: uint32
  Attribute Number: int16
  Type OID: uint32
  Type Size: int16
  Type Modifier: int32
  Format Code: uint16
PostgreSQLDataRow:
  operator: |
    this.ProcessSubNode("Column Count")
    n = getNodeResult("Column Count").Value
    if n > 4096 {
      panic("postgresql: too many columns")
    }
    if n > 0 { this.ProcessSubNode("Columns") }
  Column Count: uint16
  Columns:
    list: true
    Item: PostgreSQLValue
    operator: |
      count = getNodeResult("../Column Count").Value
      i = 0
      for i < count {
        this.NewElement().Process()
        i = i + 1
      }
PostgreSQLCommandComplete:
  Tag: "del:\0;type:string"
PostgreSQLError:
  list: true
  Field: PGErrorField
  operator: |
    for {
      if this.GetRemainingSpace() == 0 {
        break
      }
      ele = this.NewElement()
      ele.Process()
      if ele.GetSubNode("Type").Result().Value == 0 {
        break
      }
    }
PGErrorField:
  operator: |
    t = this.ProcessSubNode("Type").Value
    if t == 0 {
      return
    }
    if t == 0x53 {
      this.ProcessSubNode("Severity")
      return
    }
    if t == 0x43 {
      this.ProcessSubNode("SQLState")
      return
    }
    if t == 0x4d {
      this.ProcessSubNode("Message")
      return
    }
    this.ProcessSubNode("Value")
    return
  Type: uint8
  Severity: "del:\0;type:string"
  SQLState: "del:\0;type:string"
  Message: "del:\0;type:string"
  Value: "del:\0;type:string"
PGParam:
  operator: |
    this.ProcessSubNode("Name")
    if getNodeResult("Name").Value == "" {
      return
    }
    this.ProcessSubNode("Value")
  Name: "del:\0;type:string"
  Value: "del:\0;type:string"
