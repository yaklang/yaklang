endian: big
Package:
  PostgreSQL:
    operator: |
      # Startup/SSLRequest have no type byte: first 4 bytes are length.
      # Typed messages start with an ASCII letter then int32 length.
      first = this.ProcessSubNode("First").Value
      if (first >= 0x41 && first <= 0x5a) || (first >= 0x61 && first <= 0x7a) {
        this.ProcessSubNode("Length")
        l = getNodeResult("Length").Value
        if l < 4 || l > 0x1000000 {
          panic("postgresql: length too small or too large")
        }
        if l > 4 {
          this.GetSubNode("Payload").SetMaxLength(l - 4)
          this.ProcessSubNode("Payload")
        }
        return
      }
      # unread First as part of Length: First was the high byte of a 32-bit length.
      # Reconstruct startup: Length = first<<24 | next 3 bytes. Easier to require
      # typed messages OR dedicated Startup/SSLRequest entry points.
      panic("postgresql: use Startup or SSLRequest for untyped client packets")
    First: uint8
    Length: uint32
    Payload:
      operator: |
        first = getNodeResult("../First").Value
        if first == 0x52 {
          this.ProcessSubNode("AuthType")
          return
        }
        if first == 0x51 {
          this.ProcessSubNode("Query")
          return
        }
        if first == 0x45 {
          this.ProcessSubNode("Error")
          return
        }
        if first == 0x5a {
          this.ProcessSubNode("Ready")
          return
        }
        this.ProcessSubNode("Data")
      AuthType: uint32
      Query: raw
      Error: raw
      Ready: uint8
      Data: raw
  Startup:
    operator: |
      this.ProcessSubNode("Length")
      l = getNodeResult("Length").Value
      if l < 8 {
        panic("postgresql: startup length too small")
      }
      this.ProcessSubNode("Protocol")
      proto = getNodeResult("Protocol").Value
      if proto == 80877103 {
        return
      }
      if proto != 196608 && proto != 196608+1 && proto != 131072 {
        panic("postgresql: unknown startup protocol")
      }
      this.GetSubNode("Parameters").SetMaxLength(l - 8)
      this.ProcessSubNode("Parameters")
    Length: uint32
    Protocol: uint32
    Parameters: raw
  SSLRequest:
    operator: |
      this.ProcessSubNode("Length")
      this.ProcessSubNode("Code")
      if getNodeResult("Length").Value != 8 {
        panic("postgresql: SSLRequest length must be 8")
      }
      if getNodeResult("Code").Value != 80877103 {
        panic("postgresql: SSLRequest code mismatch")
      }
    Length: uint32
    Code: uint32
  CancelRequest:
    operator: |
      this.ProcessSubNode("Length")
      this.ProcessSubNode("Code")
      this.ProcessSubNode("ProcessID")
      this.ProcessSubNode("SecretKey")
      if getNodeResult("Code").Value != 80877102 {
        panic("postgresql: CancelRequest code mismatch")
      }
    Length: uint32
    Code: uint32
    ProcessID: uint32
    SecretKey: uint32
