endian: big
Package:
  T3:
    operator: |
      res, op = this.TryProcessByType("T3Hello")
      if op.OK {
        op.Save()
        return
      }
      op.Recovery()
      res, op = this.TryProcessByType("T3Helo")
      if op.OK {
        op.Save()
        return
      }
      op.Recovery()
      this.ProcessByType("T3Identify")
T3Hello:
  operator: |
    this.ProcessSubNode("Proto")
    p = string(getNodeResult("Proto").Value)
    if p != "t3" {
      panic("t3: not handshake")
    }
    this.ProcessSubNode("Space")
    if getNodeResult("Space").Value != 0x20 {
      panic("t3: expected space after t3")
    }
    this.ProcessSubNode("Version")
    this.ProcessSubNode("AS Key")
    if string(getNodeResult("AS Key").Value) != "AS:" {
      panic("t3: expected AS:")
    }
    this.ProcessSubNode("AS")
    this.ProcessSubNode("HL Key")
    if string(getNodeResult("HL Key").Value) != "HL:" {
      panic("t3: expected HL:")
    }
    this.ProcessSubNode("HL")
  Proto: string,2
  Space: uint8
  Version: "del:\n;type:string"
  AS Key: string,3
  AS: "del:\n;type:string"
  HL Key: string,3
  HL: "del:\n;type:string"
T3Helo:
  operator: |
    this.ProcessSubNode("HELO Key")
    if string(getNodeResult("HELO Key").Value) != "HELO:" {
      panic("t3: not HELO")
    }
    this.ProcessSubNode("Banner")
  HELO Key: string,5
  Banner: "del:\n;type:string"
T3Identify:
  operator: |
    this.ProcessSubNode("Total Length")
    l = getNodeResult("Total Length").Value
    if l < 19 {
      panic("t3: length too small")
    }
    if l >= 1048576 {
      panic("t3: length too large")
    }
    this.SetMaxLength(l)
    this.ProcessSubNode("Cmd")
    this.ProcessSubNode("Qos")
    this.ProcessSubNode("Flags")
    this.ProcessSubNode("ResponseId")
    this.ProcessSubNode("InvokableId")
    this.ProcessSubNode("AbbrevOffset")
    if this.GetMaxLength() > this.Length() {
      rest = this.GetMaxLength() - this.Length()
      if rest > 0 && rest < 1048576 {
        this.GetSubNode("Body").SetMaxLength(rest)
        this.ProcessSubNode("Body")
      }
    }
  Total Length: uint32
  Cmd: uint8
  Qos: uint8
  Flags: uint8
  ResponseId: int32
  InvokableId: int32
  AbbrevOffset: int32
  Body: raw
