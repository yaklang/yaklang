endian: big
Package:
  DHCP:
    operator: |
      this.ProcessSubNode("Operation")
      op = getNodeResult("Operation").Value
      if op != 1 && op != 2 {
        panic("dhcp: invalid operation")
      }
      this.ProcessSubNode("Hardware Type")
      this.ProcessSubNode("Hardware Length")
      this.ProcessSubNode("Hops")
      this.ProcessSubNode("Xid")
      this.ProcessSubNode("Seconds")
      this.ProcessSubNode("Flags")
      this.ProcessSubNode("Client IP")
      this.ProcessSubNode("Your IP")
      this.ProcessSubNode("Server IP")
      this.ProcessSubNode("Gateway IP")
      this.ProcessSubNode("Client MAC")
      this.ProcessSubNode("Client Hardware Padding")
      this.ProcessSubNode("Server Host Name")
      this.ProcessSubNode("Boot File")
      this.ProcessSubNode("Magic Cookie")
      cookie = getNodeResult("Magic Cookie").Value
      if cookie != 0x63825363 {
        panic("dhcp: invalid magic cookie")
      }
      this.ProcessSubNode("Options")
    Operation: uint8
    Hardware Type: uint8
    Hardware Length: uint8
    Hops: uint8
    Xid: uint32
    Seconds: uint16
    Flags: uint16
    Client IP: raw,4
    Your IP: raw,4
    Server IP: raw,4
    Gateway IP: raw,4
    Client MAC: raw,6
    Client Hardware Padding: raw,10
    Server Host Name: raw,64
    Boot File: raw,128
    Magic Cookie: uint32
    Options:
      list: true
      Option: Option
      operator: |
        for {
          if this.GetRemainingSpace() == 0 {
            break
          }
          ele = this.NewElement()
          ele.Process()
          if ele.GetSubNode("Code").Result().Value == 255 {
            break
          }
        }
Option:
  operator: |
    code = this.ProcessSubNode("Code").Value
    if code == 0 || code == 255 {
      return
    }
    this.ProcessSubNode("Length")
    l = getNodeResult("Length").Value
    if code == 53 {
      if l != 1 {
        panic("dhcp: message-type length must be 1")
      }
      this.ProcessSubNode("Message Type")
      return
    }
    if code == 12 {
      if l > 0 && l < 1048576 {
        this.GetSubNode("Host Name").SetMaxLength(l)
        this.ProcessSubNode("Host Name")
      }
      return
    }
    if code == 50 {
      if l != 4 {
        panic("dhcp: requested-ip length must be 4")
      }
      this.ProcessSubNode("Requested IP")
      return
    }
    if code == 54 {
      if l != 4 {
        panic("dhcp: server-id length must be 4")
      }
      this.ProcessSubNode("Server ID")
      return
    }
    if code == 1 {
      if l != 4 {
        panic("dhcp: subnet-mask length must be 4")
      }
      this.ProcessSubNode("Subnet Mask")
      return
    }
    if code == 51 {
      if l != 4 {
        panic("dhcp: lease-time length must be 4")
      }
      this.ProcessSubNode("Lease Time")
      return
    }
    if l > 0 && l < 1048576 {
      this.GetSubNode("Octets").SetMaxLength(l)
      this.ProcessSubNode("Octets")
    }
    return
  Code: uint8
  Length: uint8
  Message Type: uint8
  Host Name: string
  Requested IP: raw,4
  Server ID: raw,4
  Subnet Mask: raw,4
  Lease Time: uint32
  Octets: string
