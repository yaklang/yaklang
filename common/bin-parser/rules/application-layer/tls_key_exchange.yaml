# Explicit complete TLS 1.2 Server/ClientKeyExchange handshakes.
# Caller selects the key exchange from known version/cipher context.
# RFC 5246 4.7, 7.4.3, 7.4.7, A.7; RFC 8422 5.4/5.7.
# Named-curve signed ECDHE, signed DHE, explicit client DH/EC, RSA vector.
# No anonymous/implicit/explicit-curve profile, key validation, signature
# verification, decryption, TCP reassembly, generation or automatic dispatch.
endian: big
unit: byte
Package:
  TLS12ECDHEServerKeyExchange:
    operator: |
      err = parseTLS12KeyExchange("ECDHEServer")
      if err != nil { panic(err) }
  TLS12ECDHEServerKeyExchangeCarrier:
    operator: |
      if !this.HasMaxLength() || this.GetMaxLength("bit") == 0 || this.GetMaxLength("bit") % 8 != 0 { panic("tls12-key-exchange: explicit nonempty byte boundary required") }
      if this.GetMaxLength() > 262154 { panic("tls12-key-exchange: carrier exceeds 262154-byte resource limit") }
      candidate, trial = this.TryProcessByType("TLS12ECDHEServerKeyExchangeExact", "TLS12ECDHEServerKeyExchange")
      if trial.OK { trial.Save(); return }
      trial.Recovery()
      raw = this.NewUnknownNode("Unparsed TLS Key Exchange")
      raw.SetMaxLength(this.GetMaxLength())
      raw.Process()
  TLS12DHEServerKeyExchange:
    operator: |
      err = parseTLS12KeyExchange("DHEServer")
      if err != nil { panic(err) }
  TLS12DHEServerKeyExchangeCarrier:
