      if this.GetMaxLength() > 262154 { panic("tls12-key-exchange: carrier exceeds 262154-byte resource limit") }
      candidate, trial = this.TryProcessByType("TLS12ECDHEClientKeyExchangeExact", "TLS12ECDHEClientKeyExchange")
