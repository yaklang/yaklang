      raw = this.NewUnknownNode("Unparsed TLS Key Exchange")
      raw.SetMaxLength(this.GetMaxLength())
      raw.Process()
  TLS12RSAClientKeyExchange:
    operator: |
      err = parseTLS12KeyExchange("RSAClient")
      if err != nil { panic(err) }
  TLS12RSAClientKeyExchangeCarrier:
