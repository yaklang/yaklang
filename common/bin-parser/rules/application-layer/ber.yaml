Package:
  BER Element:
    operator: |
      this.ProcessSubNode("Type")
      this.ProcessSubNode("Length")
      l = getNodeResult("Length").Value
      if l == 0 {
        return
      }
      typ = getNodeResult("Type")
      if typ.Child("Constructed").Value {
        this.GetSubNode("Children").SetMaxLength(l)
        this.ProcessSubNode("Children")
        return
      }
      tag = typ.Child("Tag").Value
      cset = typ.Child("Class").Value
      if cset == 0 && tag == 1 {
        this.ProcessSubNode("Boolean")
        return
      }
      if cset == 0 && tag == 2 {
        this.GetSubNode("Integer").SetMaxLength(l)
        this.ProcessSubNode("Integer")
        return
      }
      if cset == 0 && tag == 4 {
        this.GetSubNode("OCTET STRING").SetMaxLength(l)
        this.ProcessSubNode("OCTET STRING")
        return
      }
      if cset == 0 && tag == 6 {
        this.GetSubNode("OBJECT IDENTIFIER").SetMaxLength(l)
        this.ProcessSubNode("OBJECT IDENTIFIER")
        return
      }
      if cset == 0 && tag == 19 {
        this.GetSubNode("PrintableString").SetMaxLength(l)
        this.ProcessSubNode("PrintableString")
        return
      }
      if cset == 0 && tag == 22 {
        this.GetSubNode("IA5String").SetMaxLength(l)
        this.ProcessSubNode("IA5String")
        return
      }
      if cset == 0 && tag == 23 {
        this.GetSubNode("UTCTime").SetMaxLength(l)
        this.ProcessSubNode("UTCTime")
        return
      }
      this.GetSubNode("Value").SetMaxLength(l)
      this.ProcessSubNode("Value")
      return
    Type:
      type: uint8
      out: |
          if data.Value == nil{
            return
          }
          v = data.Value
          className = v >> 6
          constructed = v >> 5 & 0x1
          tag = v & 0x1f
          vs = []
          vs.Append(newValue("Class",className))
          vs.Append(newValue("Constructed",constructed))
          vs.Append(newValue("Tag",tag))
          return newStructValue(name,vs...)
    Length:
      list: true
      Octet: uint8
      out: |
        data = data.Value
        res = 0
        isLong = false
        isIndefinite = false
        for index,n = range data{
          n = n.Value
          if index == 0{
            if n>>7 == 1{
              if n&0x7f == 0{
                isIndefinite = true
              } else {
                isLong = true
              }
            }else{
                res = n & 0x7f
              }
          }else{
            if isLong{
              res = res << 8 + n
            }else if isIndefinite{
              if n == 0{
                break
              }
              res = res << 8 + n
            }
          }
        }
        return res
      input: |

      operator: |
        n = this.NewElement().Process()
        n = n.Value
        shortForm = n>>7 == 0
        longForm = n>>7 == 1
        var indefiniteForm = false
        if longForm {
          indefiniteForm = n == 0x80
          if indefiniteForm {
            longForm = false
          }
        }
        if shortForm {
          debug("short form")
        }else if longForm {
          debug("long form")
          for i = range n&0x7f {
            n = this.NewElement().Process()
          }
        }else if indefiniteForm {
          for {
              n = this.NewElement().Process()
              if n == 0 {
                break
              }
          }
        }
    Value: raw
    Boolean: uint8
    Integer:
      type: raw
      out: |
        b = data.Value
        res = 0
        for _, x = range b {
          res = (res << 8) + x
        }
        return res
    OCTET STRING: string
    NULL: raw,0
    OBJECT IDENTIFIER: string
    PrintableString: string
    IA5String: string
    UTCTime: string
    Children:
      list: true
      Value: "ref-type:@BER Element"
