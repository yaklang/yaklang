endian: big
Package:
  QinQ:
    PCP: uint8,3bit
    DEI: uint8,1bit
    VID: uint16,12bit
    Type: uint16
    Payload:
      unpack: true
      operator: |
        type = getNodeResult("@QinQ/Type").Value
        if type == 0x8100 {
          this.ProcessByType("VLAN")
          return
        }
        if type == 0x0800 {
          this.ProcessByType("IP")
          return
        }
        if type == 0x86dd {
          this.ProcessByType("IPv6")
          return
        }
        if type == 0x0806 {
          this.ProcessByType("ARP")
          return
        }
VLAN: "import:ieee_802_1q.yaml;node:IEEE 802.1Q"
IP: "import:internet_protocol.yaml;node:Internet Protocol"
IPv6: "import:internet_protocol_version_6.yaml;node:Internet Protocol Version 6"
ARP: "import:address_resolution_protocol.yaml;node:Address Resolution Protocol"
