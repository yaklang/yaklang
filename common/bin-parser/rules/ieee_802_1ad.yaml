endian: big
Package:
  QinQ:
    PCP: uint8,3bit
    DEI: uint8,1bit
    VID High: uint8,4bit
    VID Low: uint8
    Type: uint16
    Payload:
      unpack: true
      operator: |
        typ = getNodeResult("../Type").Value
        if typ == 0x8100 {
          this.ProcessByType("CTag")
          return
        }
        if typ == 0x0800 {
          this.ProcessByType("IP")
          return
        }
        if typ == 0x86dd {
          this.ProcessByType("IPv6")
          return
        }
        if typ == 0x0806 {
          this.ProcessByType("ARP")
          return
        }
        return
CTag:
  PCP: uint8,3bit
  DEI: uint8,1bit
  VID High: uint8,4bit
  VID Low: uint8
  Type: uint16
  Payload:
    unpack: true
    operator: |
      typ = getNodeResult("../Type").Value
      if typ == 0x0800 {
        this.ProcessByType("IP")
        return
      }
      if typ == 0x86dd {
        this.ProcessByType("IPv6")
        return
      }
      if typ == 0x0806 {
        this.ProcessByType("ARP")
        return
      }
      if typ == 0x888e {
        this.ProcessByType("EAPOL")
        return
      }
      return
IP: "import:internet_protocol.yaml;node:Internet Protocol"
IPv6: "import:internet_protocol_version_6.yaml;node:Internet Protocol Version 6"
ARP: "import:address_resolution_protocol.yaml;node:Address Resolution Protocol"
EAPOL: "import:eapol.yaml;node:EAPOL"
