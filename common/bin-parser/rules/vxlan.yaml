endian: big
Package:
  VXLAN:
    operator: |
      this.ProcessSubNode("Flags")
      flags = getNodeResult("Flags").Value
      if (flags & 0x08) == 0 {
        panic("vxlan: I-flag must be set")
      }
      this.ProcessSubNode("Reserved")
      this.ProcessSubNode("VNI")
      this.ProcessSubNode("Reserved2")
      this.ProcessSubNode("Inner")
    Flags: uint8
    Reserved: raw,3
    VNI: uint32,24bit
    Reserved2: uint8
    Inner:
      Destination: raw,6
      Source: raw,6
      Type: uint16
