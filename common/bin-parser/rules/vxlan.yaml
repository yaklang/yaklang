endian: big
Package:
  # A direct/default rule call retains its historical standard VXLAN entry.
  # GPE is selected explicitly by its separate UDP destination service.
  operator: |
    this.ProcessSubNode("VXLAN")
    return
  VXLAN:
    operator: |
      this.ProcessSubNode("G")
      this.ProcessSubNode("Reserved High")
      this.ProcessSubNode("I")
      this.ProcessSubNode("Reserved Low")
      if getNodeResult("I").Value != 1 {
        panic("vxlan: I-flag must be set")
      }
      // Reserved flags/bytes are ignored on receipt (RFC 7348 section 5).
      // GBP remains Ethernet-compatible. These are wire observations; no
      // forwarding/group policy is executed by this parser.
      if getNodeResult("G").Value == 1 {
        this.ProcessSubNode("GBP")
      } else {
        this.ProcessSubNode("Reserved")
      }
      this.ProcessSubNode("VNI")
      this.ProcessSubNode("Reserved2")
      if this.HasMaxLength() {
        remaining = this.GetMaxLength() - this.Length()
        if remaining < 14 { panic("vxlan: incomplete Ethernet child prefix") }
        this.GetSubNode("Inner").SetMaxLength(remaining)
      }
      this.ProcessSubNode("Inner")
      return
    G: uint8,1bit
    Reserved High: uint8,3bit
    I: uint8,1bit
    Reserved Low: uint8,3bit
    Reserved: raw,3
    GBP:
      Reserved High: uint8,1bit
      D: uint8,1bit
      Reserved Middle: uint8,2bit
      A: uint8,1bit
      Reserved Low: uint8,3bit
      Group Policy ID: uint16
    VNI: uint32,24bit
    Reserved2: uint8
    Inner:
      operator: |
        this.ProcessSubNode("Destination")
        this.ProcessSubNode("Source")
        this.ProcessSubNode("Type")
        typ = getNodeResult("Type").Value
        if typ == 0x0800 {
          this.ProcessByType("IP")
          return
        }
        if typ == 0x0806 {
          this.ProcessByType("ARP")
          return
        }
        return
      Destination: raw,6
      Source: raw,6
      Type: uint16
  # The separate destination service selects this bounded v0 header profile.
  # Its payload is deliberately left to the UDP caller as uninterpreted bytes.
  VXLANGPEHeader:
    operator: |
      this.ProcessSubNode("Reserved High")
      this.ProcessSubNode("Version")
      if getNodeResult("Version").Value != 0 { panic("vxlan-gpe: unselected version") }
      this.ProcessSubNode("I")
      if getNodeResult("I").Value != 1 { panic("vxlan-gpe: I-flag must be set") }
      this.ProcessSubNode("P")
      this.ProcessSubNode("B")
      this.ProcessSubNode("O")
      this.ProcessSubNode("Reserved")
      this.ProcessSubNode("Next Protocol")
      p = getNodeResult("P").Value
      next = getNodeResult("Next Protocol").Value
      if (p == 0 && next != 0) || (p == 1 && next == 0) { panic("vxlan-gpe: inconsistent next protocol presence") }
      this.ProcessSubNode("VNI")
      this.ProcessSubNode("Reserved2")
    Reserved High: uint8,2bit
    Version: uint8,2bit
    I: uint8,1bit
    P: uint8,1bit
    B: uint8,1bit
    O: uint8,1bit
    Reserved: raw,2
    Next Protocol: uint8
    VNI: uint32,24bit
    Reserved2: uint8
IP:
  operator: |
    this.ProcessSubNode("Version")
    this.ProcessSubNode("IHL")
    version = getNodeResult("Version").Value
    ihl = getNodeResult("IHL").Value
    if version != 4 || ihl < 5 {
      panic("vxlan: invalid inner IPv4 header")
    }
    this.ProcessSubNode("TOS")
    this.ProcessSubNode("Total Length")
    total = getNodeResult("Total Length").Value
    if total < ihl * 4 || total > this.GetMaxLength() {
      panic("vxlan: invalid inner IPv4 length")
    }
    this.SetMaxLength(total)
    this.ProcessSubNode("Identification")
    this.ProcessSubNode("FlagsFrag")
    this.ProcessSubNode("TTL")
    this.ProcessSubNode("Protocol")
    this.ProcessSubNode("Checksum")
    this.ProcessSubNode("Source")
    this.ProcessSubNode("Destination")
    options = ihl * 4 - 20
    if options > 0 {
      this.GetSubNode("Options").SetMaxLength(options)
      this.ProcessSubNode("Options")
    }
    proto = getNodeResult("Protocol").Value
    if proto == 1 {
      this.ProcessByType("ICMP")
      return
    }
    if proto == 17 {
      this.ProcessByType("VXLANUDP")
      return
    }
    rest = this.GetMaxLength() - this.Length()
    if rest > 0 && rest < 1048576 {
      this.GetSubNode("Payload").SetMaxLength(rest)
      this.ProcessSubNode("Payload")
    }
    return
  Version: uint8,4bit
  IHL: uint8,4bit
  TOS: uint8
  Total Length: uint16
  Identification: uint16
  FlagsFrag: uint16
  TTL: uint8
  Protocol: uint8
  Checksum: uint16
  Source: raw,4
  Destination: raw,4
  Options: raw
  Payload: raw
VXLANUDP:
  operator: |
    this.ProcessSubNode("Source Port")
    this.ProcessSubNode("Destination Port")
    this.ProcessSubNode("Length")
    length = getNodeResult("Length").Value
    if length < 8 || length > this.GetMaxLength() {
      panic("vxlan: invalid inner UDP length")
    }
    this.SetMaxLength(length)
    this.ProcessSubNode("Checksum")
    rest = this.GetMaxLength() - this.Length()
    if rest == 0 {
      return
    }
    source = getNodeResult("Source Port").Value
    destination = getNodeResult("Destination Port").Value
    if source == 53 || destination == 53 {
      this.GetSubNode("DNS").SetMaxLength(rest)
      this.ProcessSubNode("DNS")
      return
    }
    this.GetSubNode("Payload").SetMaxLength(rest)
    this.ProcessSubNode("Payload")
  Source Port: uint16
  Destination Port: uint16
  Length: uint16
  Checksum: uint16
  DNS: "import:application-layer/dns.yaml;node:DNS"
  Payload: raw
ARP: "import:address_resolution_protocol.yaml;node:Address Resolution Protocol"
ICMP: "import:internet_control_message_protocol.yaml;node:ICMP"
