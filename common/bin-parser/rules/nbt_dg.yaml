endian: big
Package:
  NBTDG:
    operator: |
      this.ProcessSubNode("Message Type")
      mt = getNodeResult("Message Type").Value
      if mt < 0x10 || mt > 0x16 {
        panic("nbtdg: unknown message type")
      }
      this.ProcessSubNode("Flags")
      this.ProcessSubNode("Datagram ID")
      this.ProcessSubNode("Source IP")
      this.ProcessSubNode("Source Port")
      this.ProcessSubNode("Length")
      this.ProcessSubNode("Packet Offset")
      if this.GetMaxLength() > this.Length() && this.GetMaxLength() < 1048576 {
        rest = this.GetMaxLength() - this.Length()
        if rest >= 32 {
          this.GetSubNode("Datagram").SetMaxLength(rest)
          this.ProcessSubNode("Datagram")
        }
      }
    Message Type: uint8
    Flags: uint8
    Datagram ID: uint16
    Source IP: raw,4
    Source Port: uint16
    Length: uint16
    Packet Offset: uint16
    Datagram:
      operator: |
        this.ProcessSubNode("Source Name")
        this.ProcessSubNode("Dest Name")
        if this.GetMaxLength() > this.Length() {
          rest = this.GetMaxLength() - this.Length()
          if rest > 0 && rest < 1048576 {
            this.GetSubNode("User Data").SetMaxLength(rest)
            this.ProcessSubNode("User Data")
          }
        }
      Source Name: string,16
      Dest Name: string,16
      User Data: string
