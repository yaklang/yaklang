endian: big
Package:
  Thrift:
    operator: |
      this.ProcessSubNode("Version")
      ver = getNodeResult("Version").Value
      if (ver & 0xffff0000) != 0x80010000 {
        panic("thrift: binary protocol version")
      }
      this.ProcessSubNode("Name Length")
      n = getNodeResult("Name Length").Value
      if n > 256 {
        panic("thrift: name too long")
      }
      if n > 0 {
        this.GetSubNode("Name").SetMaxLength(n)
        this.ProcessSubNode("Name")
      }
      this.ProcessSubNode("Seq ID")
      if this.GetMaxLength() > this.Length() && this.GetMaxLength() < 1048576 {
        rest = this.GetMaxLength() - this.Length()
        if rest >= 1 {
          this.GetSubNode("Fields").SetMaxLength(rest)
          this.ProcessSubNode("Fields")
        }
      }
    Version: uint32
    Name Length: uint32
    Name: string
    Seq ID: uint32
    Fields:
      list: true
      Field: ThriftField
      operator: |
        for {
          ele = this.NewElement()
          if ele.GetMaxLength() < 1 {
            break
          }
          ele.Process()
          if getCtx("thrift_stop") == 1 {
            break
          }
        }
ThriftField:
  operator: |
    this.ProcessSubNode("Type")
    t = getNodeResult("Type").Value
    if t == 0 {
      setCtx("thrift_stop", 1)
      return
    }
    this.ProcessSubNode("Field ID")
    if t == 8 || t == 10 || t == 4 || t == 6 || t == 3 {
      this.ProcessSubNode("I32")
    }
  Type: uint8
  Field ID: uint16
  I32: uint32
