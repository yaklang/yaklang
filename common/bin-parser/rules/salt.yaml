endian: big
Package:
  Salt:
    operator: |
      res, op = this.TryProcessByType("SaltGreeting")
      if op.OK {
        op.Save()
        return
      }
      op.Recovery()
      this.ProcessSubNode("Frames")
    Frames:
      list: true
      Frame: SaltFrame
      operator: |
        for {
          ele = this.NewElement()
          if ele.GetMaxLength() < 4 {
            if this.Length() == 0 {
              panic("salt: empty")
            }
            break
          }
          prev = this.Length()
          ele.Process()
          if this.Length() <= prev {
            break
          }
          if this.GetMaxLength() >= 1048576 {
            break
          }
          if this.GetMaxLength() > 0 && this.Length() >= this.GetMaxLength() {
            break
          }
        }
SaltGreeting:
  operator: |
    this.ProcessSubNode("Signature")
    if getNodeResult("Signature").Value != 0xff {
      panic("salt: not ZMTP greeting")
    }
    this.ProcessSubNode("Revision")
    this.ProcessSubNode("Signature End")
    if getNodeResult("Signature End").Value != 0x7f {
      panic("salt: ZMTP signature end must be 0x7f")
    }
    this.ProcessSubNode("Major")
    if getNodeResult("Major").Value != 3 {
      panic("salt: ZMTP major must be 3")
    }
    this.ProcessSubNode("Minor")
    this.ProcessSubNode("Mechanism")
    this.ProcessSubNode("As Server")
    this.ProcessSubNode("Filler")
  Signature: uint8
  Revision: raw,8
  Signature End: uint8
  Major: uint8
  Minor: uint8
  Mechanism: string,20
  As Server: uint8
  Filler: raw,31
SaltFrame:
  operator: |
    this.ProcessSubNode("Length")
    l = getNodeResult("Length").Value
    if l == 0 || l > 65535 {
      panic("salt: invalid zeromq frame length")
    }
    this.GetSubNode("Command").SetMaxLength(l)
    this.ProcessSubNode("Command")
  Length: uint32
  Command: string
