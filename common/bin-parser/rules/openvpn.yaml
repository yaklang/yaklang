endian: big
Package:
  OpenVPN:
    operator: |
      this.ProcessSubNode("OpcodeKey")
      op = getNodeResult("OpcodeKey").Value >> 3
      if op < 1 || op > 11 {
        panic("openvpn: unknown opcode")
      }
      this.ProcessSubNode("Session ID")
      this.ProcessSubNode("Ack Count")
      n = getNodeResult("Ack Count").Value
      if n > 0 && n < 32 {
        this.GetSubNode("Acks").SetMaxLength(n * 4)
        this.ProcessSubNode("Acks")
      }
      this.ProcessSubNode("Packet ID")
    OpcodeKey: uint8
    Session ID: raw,8
    Ack Count: uint8
    Acks:
      list: true
      Ack: uint32
      operator: |
        for {
          ele = this.NewElement()
          if ele.GetMaxLength() < 4 {
            break
          }
          ele.Process()
        }
    Packet ID: uint32
