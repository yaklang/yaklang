Package:
  SIP:
    operator: |
      res,op = this.TryProcessByType("FirstWorld")
      op.Recovery()
      first = string(res.Value)
      if first.HasPrefix("SIP/") {
        this.ProcessSubNode("SIP Response")
      }else{
        if !(first.HasPrefix("INVITE") || first.HasPrefix("ACK") || first.HasPrefix("BYE") || first.HasPrefix("CANCEL") || first.HasPrefix("REGISTER") || first.HasPrefix("OPTIONS") || first.HasPrefix("INFO") || first.HasPrefix("PRACK") || first.HasPrefix("SUBSCRIBE") || first.HasPrefix("NOTIFY") || first.HasPrefix("UPDATE") || first.HasPrefix("MESSAGE") || first.HasPrefix("REFER") || first.HasPrefix("PUBLISH")) {
          panic("sip: unknown method")
        }
        this.ProcessSubNode("SIP Request")
      }
    SIP Request:
      FirstLine:
        unpack: true
        Method: "del: ;type:string"
        URI: "del: ;type:string"
        Version: "del:\r\n;type:string"
      Headers: SIPHeaders
      Body: SIPBody
    SIP Response:
      FirstLine:
        unpack: true
        Version: "del: ;type:string"
        Status: "del: ;type:string"
        Reason: "del:\r\n;type:string"
      Headers: SIPHeaders
      Body: SIPBody
  SDP:
    Lines:
      list: true
      Line: SDPLine
      operator: |
        for {
          if this.Length() > 0 {
            avail = this.GetMaxLength() - this.Length()
            if avail < 3 || avail > 1048576 {
              break
            }
          }
          ele = this.NewElement()
          if ele.GetMaxLength() == 0 {
            break
          }
          ele.Process()
        }
SDPLine:
  operator: |
    this.ProcessSubNode("Type")
    this.ProcessSubNode("Eq")
    if getNodeResult("Eq").Value != 0x3d {
      panic("sdp: expected =")
    }
    typ = getNodeResult("Type").Value
    if typ != 0x76 && typ != 0x6f && typ != 0x73 && typ != 0x69 && typ != 0x75 && typ != 0x65 && typ != 0x70 && typ != 0x63 && typ != 0x62 && typ != 0x74 && typ != 0x72 && typ != 0x7a && typ != 0x6b && typ != 0x61 && typ != 0x6d {
      panic("sdp: unknown line type")
    }
    this.ProcessSubNode("Value")
  Type: uint8
  Eq: uint8
  Value: "del:\r\n;type:string"
FirstWorld: "del: ;type:string"
SIPBody:
  operator: |
    l = getCtx("body_length")
    if l > 0 {
      this.GetSubNode("Data").SetMaxLength(l)
      this.ProcessSubNode("Data")
    }
  Data: raw
SIPHeaders:
  operator: |
    for {
      data := this.NewElement().Process().Value
      if data == nil || len(data) == 0 {
        return
      }
      s = string(data)
      if s.HasPrefix("Content-Length: ") {
        setCtx("body_length", int(s[len("Content-Length: "):]))
      }
    }
  list: true
  Item: "del:\r\n;type:string"
