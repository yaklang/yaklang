endian: little
Package:
  MongoDB:
    operator: |
      this.ProcessSubNode("Message Length")
      l = getNodeResult("Message Length").Value
      if l < 16 {
        panic("mongodb: message length smaller than 16")
      }
      this.ProcessSubNode("Request ID")
      this.ProcessSubNode("Response To")
      this.ProcessSubNode("Op Code")
      op = getNodeResult("Op Code").Value
      if op == 2004 && l >= 32 {
        this.ProcessSubNode("OP_QUERY")
        return
      }
      if op == 2013 && l >= 21 {
        this.ProcessSubNode("OP_MSG")
        return
      }
    Message Length: uint32
    Request ID: uint32
    Response To: uint32
    Op Code: uint32
    OP_QUERY:
      operator: |
        this.ProcessSubNode("Flags")
        this.ProcessSubNode("Collection")
        this.ProcessSubNode("Skip")
        this.ProcessSubNode("Return")
        this.ProcessSubNode("Query")
      Flags: uint32
      Collection: "del:\x00;type:string"
      Skip: uint32
      Return: uint32
      Query:
        operator: |
          this.ProcessSubNode("Size")
          sz = getNodeResult("Size").Value
          if sz < 5 {
            panic("bson: document too small")
          }
          body = sz - 4
          if body > 0 && body < 1048576 {
            this.GetSubNode("Elements").SetMaxLength(body)
            this.ProcessSubNode("Elements")
          }
        Size: uint32
        Elements:
          list: true
          Element:
            operator: |
              this.ProcessSubNode("Type")
              t = getNodeResult("Type").Value
              if t == 0 {
                setCtx("bson_eoo", 1)
                return
              }
              this.ProcessSubNode("Name")
              if t == 0x10 {
                this.ProcessSubNode("Int32")
                return
              }
              if t == 0x12 {
                this.ProcessSubNode("Int64")
                return
              }
              if t == 0x01 {
                this.ProcessSubNode("Double")
                return
              }
              if t == 0x09 {
                this.ProcessSubNode("Datetime")
                return
              }
              if t == 0x07 {
                this.ProcessSubNode("ObjectId")
                return
              }
              if t == 0x02 {
                this.ProcessSubNode("StrLen")
                sl = getNodeResult("StrLen").Value
                if sl > 0 && sl < 1048576 {
                  this.GetSubNode("Str").SetMaxLength(sl)
                  this.ProcessSubNode("Str")
                }
                return
              }
              if t == 0x05 {
                this.ProcessSubNode("BinLen")
                bl = getNodeResult("BinLen").Value
                this.ProcessSubNode("BinSubtype")
                if bl > 0 && bl < 1048576 {
                  this.GetSubNode("Binary").SetMaxLength(bl)
                  this.ProcessSubNode("Binary")
                }
                return
              }
              if t == 0x08 {
                this.ProcessSubNode("Bool")
                return
              }
              if t == 0x0a {
                return
              }
            Type: uint8
            Name: "del:\x00;type:string"
            Int32: uint32
            Int64: uint64
            Double: raw,8
            Datetime: uint64
            ObjectId: raw,12
            StrLen: uint32
            Str: string
            BinLen: uint32
            BinSubtype: uint8
            Binary: string
            Bool: uint8
          operator: |
            for {
              ele = this.NewElement()
              if ele.GetMaxLength() < 2 {
                break
              }
              ele.Process()
              if getCtx("bson_eoo") == 1 {
                break
              }
            }
    OP_MSG:
      operator: |
        this.ProcessSubNode("Flag Bits")
        this.ProcessSubNode("Section Kind")
        this.ProcessSubNode("Document")
      Flag Bits: uint32
      Section Kind: uint8
      Document:
        operator: |
          this.ProcessSubNode("Size")
