Package:
  RTSP:
    operator: |
      res,op = this.TryProcessByType("FirstWorld")
      op.Recovery()
      first = string(res.Value)
      if first.HasPrefix("RTSP/") {
        this.ProcessSubNode("RTSP Response")
      }else{
        if !(first.HasPrefix("OPTIONS") || first.HasPrefix("DESCRIBE") || first.HasPrefix("SETUP") || first.HasPrefix("PLAY") || first.HasPrefix("PAUSE") || first.HasPrefix("TEARDOWN") || first.HasPrefix("GET_PARAMETER") || first.HasPrefix("SET_PARAMETER") || first.HasPrefix("ANNOUNCE") || first.HasPrefix("RECORD") || first.HasPrefix("REDIRECT")) {
          panic("rtsp: unknown method")
        }
        this.ProcessSubNode("RTSP Request")
      }
    RTSP Request:
      FirstLine:
        unpack: true
        Method: "del: ;type:string"
        URI: "del: ;type:string"
        Version: "del:\r\n;type:string"
      Headers: RTSPHeaders
    RTSP Response:
      FirstLine:
        unpack: true
        Version: "del: ;type:string"
        Status: "del: ;type:string"
        Reason: "del:\r\n;type:string"
      Headers: RTSPHeaders
FirstWorld: "del: ;type:string"
RTSPHeaders:
  operator: |
    for {
      data := this.NewElement().Process().Value
      if data == nil || len(data) == 0 {
        return
      }
    }
  list: true
  Item: "del:\r\n;type:string"
