endian: big
Package:
  Loopback:
    operator: |
      this.ProcessSubNode("Function")
      p = getNodeResult("Function").Value
      if this.GetMaxLength() > this.Length() && this.GetMaxLength() < 1048576 {
        rest = this.GetMaxLength() - this.Length()
        if rest >= 2 {
          this.ProcessSubNode("Receipt")
        }
      }
      if p == 0x0800 {
        this.ProcessByType("IP")
        return
      }
      if p == 0x86dd {
        this.ProcessByType("IPv6")
        return
      }
      return
    Function: uint16
    Receipt: uint16
    Ident: uint16
    Bytes: string
IP: "import:internet_protocol.yaml;node:Internet Protocol"
IPv6: "import:internet_protocol_version_6.yaml;node:Internet Protocol Version 6"
