endian: little
Package:
  Loopback:
    operator: |
      this.ProcessSubNode("Skip Count")
      rest = 0
      if this.GetMaxLength() > this.Length() {
        rest = this.GetMaxLength() - this.Length()
      }
      if rest >= 2 && rest < 1048576 {
        this.GetSubNode("Functions").SetMaxLength(rest)
        this.ProcessSubNode("Functions")
        return
      }
      if rest >= 2 {
        res, op = this.TryProcessByType("LoopFunction")
        if op.OK {
          op.Recovery()
          this.ProcessSubNode("Functions")
        }
      }
      return
    Skip Count: uint16
    Functions:
      list: true
      Function: LoopFunction
      operator: |
        bounded = this.GetMaxLength() > 0 && this.GetMaxLength() < 1048576
        for {
          if bounded {
            ele = this.NewElement()
            if ele.GetMaxLength() < 2 {
              break
            }
            prev = this.Length()
            ele.Process()
            if this.Length() <= prev {
              break
            }
          } else {
            prev = this.Length()
            res, op = this.TryProcessByType("LoopFunction")
            if !op.OK {
              op.Recovery()
              break
            }
            op.Save()
            if this.Length() <= prev {
              break
            }
          }
        }
LoopFunction:
  operator: |
    this.ProcessSubNode("Function")
    ftype = getNodeResult("Function").Value
    if ftype == 1 {
      this.ProcessSubNode("Reply")
      return
    }
    if ftype == 2 {
      this.ProcessSubNode("Forward")
      return
    }
    panic("loopback: unknown function")
  Function: uint16
  Reply:
    Receipt Number: uint16
  Forward:
    Forwarding Address: raw,6
