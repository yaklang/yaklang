endian: big
Package:
  EAPOL:
    operator: |
      this.ProcessSubNode("Protocol Version")
      this.ProcessSubNode("Packet Type")
      this.ProcessSubNode("Body Length")
      packetType = getNodeResult("Packet Type").Value
      bodyLength = getNodeResult("Body Length").Value
      if bodyLength == 0 {
        return
      }
      this.GetSubNode("Body").SetMaxLength(bodyLength)
      this.ProcessSubNode("Body")
    Protocol Version: uint8
    Packet Type: uint8
    Body Length: uint16
    Body:
      unpack: true
      operator: |
        packetType = getNodeResult("@EAPOL/Packet Type").Value
        if packetType == 0 {
          this.ProcessByType("EAPPacket")
          return
        }
        if packetType == 3 {
          this.ProcessByType("EAPOLKey")
          return
        }
        if packetType == 4 {
          this.ProcessByType("EAPOLASFAlert")
          return
        }
        res, op = this.TryProcessByType("PeekByte")
        op.Recovery()
        if op.OK {
          this.ProcessByType("Next Protocol Data")
        }
        return
EAPPacket:
  operator: |
    this.ProcessSubNode("Code")
    this.ProcessSubNode("Identifier")
    this.ProcessSubNode("Length")
    el = getNodeResult("Length").Value
    if el >= 5 {
      this.ProcessSubNode("Type")
    }
    if el > 5 {
      t = getNodeResult("Type").Value
      dlen = el - 5
      if t == 1 && dlen > 0 && dlen < 1048576 {
        this.GetSubNode("Identity").SetMaxLength(dlen)
        this.ProcessSubNode("Identity")
        return
      }
      if t == 4 && dlen > 1 && dlen < 1048576 {
        this.GetSubNode("MD5-Challenge").SetMaxLength(dlen)
        this.ProcessSubNode("MD5-Challenge")
        return
      }
    }
    return
  Code: uint8
  Identifier: uint8
  Length: uint16
  Type: uint8
  Identity: string
  MD5-Challenge:
    operator: |
      this.ProcessSubNode("Value Size")
      vs = getNodeResult("Value Size").Value
      if vs > 0 && vs < 255 {
        this.GetSubNode("Value").SetMaxLength(vs)
        this.ProcessSubNode("Value")
      }
      rest = this.GetMaxLength() - this.Length()
      if rest > 0 && rest < 1048576 {
        this.GetSubNode("Name").SetMaxLength(rest)
        this.ProcessSubNode("Name")
      }
    Value Size: uint8
    Value: string
    Name: string
EAPOLKey:
  operator: |
    this.ProcessSubNode("Descriptor Type")
    this.ProcessSubNode("Key Information")
    this.ProcessSubNode("Key Length")
    this.ProcessSubNode("Replay Counter")
    this.ProcessSubNode("Key Nonce")
    this.ProcessSubNode("Key IV")
    this.ProcessSubNode("Key RSC")
    this.ProcessSubNode("Key ID")
    this.ProcessSubNode("Key MIC")
    this.ProcessSubNode("Key Data Length")
    kdl = getNodeResult("Key Data Length").Value
    if kdl > 0 {
      this.GetSubNode("Key Data").SetMaxLength(kdl)
      this.ProcessSubNode("Key Data")
    }
  Descriptor Type: uint8
  Key Information: uint16
  Key Length: uint16
  Replay Counter: raw,8
  Key Nonce: raw,32
  Key IV: raw,16
  Key RSC: raw,8
  Key ID: raw,8
  Key MIC: raw,16
  Key Data Length: uint16
  Key Data: raw
EAPOLASFAlert:
  Vendor ID: uint32
  Vendor Type: uint32
Next Protocol Data:
  list: true
  Octet: uint8
  operator: |
    for {
      res, op = this.TryProcessByType("PeekByte")
      if !op.OK {
        op.Recovery()
        break
      }
      op.Recovery()
      ele = this.NewElement()
      ele.Process()
    }
PeekByte: uint8
