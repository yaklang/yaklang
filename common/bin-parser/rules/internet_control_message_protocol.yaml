Package:
  ICMP:
    Type: uint8
    Code: uint8
    Checksum: uint16
    Payload:
      unpack: true
      operator: |
        type = getNodeResult("@ICMP/Type").Value
        switch type {
          case 8:
            this.ProcessByType("ICMP Echo")
          case 0:
            this.ProcessByType("ICMP Echo Reply")
          case 3:
            this.ProcessByType("ICMP Destination Unreachable")
          case 11:
            this.ProcessByType("ICMP Time Exceeded")
          default:
            return
        }
ICMP Echo:
  Identifier: uint16
  Sequence Number: uint16
  Data: raw
ICMP Echo Reply:
  Identifier: uint16
  Sequence Number: uint16
  Data: raw
ICMP Destination Unreachable:
  Unused: raw,4
  Data: raw
ICMP Time Exceeded:
  Unused: raw,4
  Data: raw