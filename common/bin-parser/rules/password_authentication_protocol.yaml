endian: big
Package:
  PAP:
    operator: |
      this.ProcessSubNode("Code")
      code = getNodeResult("Code").Value
      if code < 1 || code > 3 {
        panic("pap: unknown code")
      }
      this.ProcessSubNode("Identifier")
      this.ProcessSubNode("Length")
      l = getNodeResult("Length").Value
      if l < 4 {
        panic("pap: length smaller than 4")
      }
      if l > 4 && l < 1048576 {
        this.GetSubNode("Data").SetMaxLength(l-4)
        this.ProcessSubNode("Data")
      }
    Code: uint8
    Identifier: uint8
    Length: uint16
    Data:
      unpack: true
      operator: |
        code = getNodeResult("@PAP/Code").Value
        if code == 1 {
          this.ProcessByType("Request")
          return
        }
        if code == 2 || code == 3 {
          this.ProcessByType("Response")
          return
        }
Request:
  operator: |
    this.ProcessSubNode("Peer ID Length")
    n = getNodeResult("Peer ID Length").Value
    if n > 0 && n < 256 {
      this.GetSubNode("Peer ID").SetMaxLength(n)
      this.ProcessSubNode("Peer ID")
    }
    this.ProcessSubNode("Password Length")
    p = getNodeResult("Password Length").Value
    if p > 0 && p < 256 {
      this.GetSubNode("Password").SetMaxLength(p)
      this.ProcessSubNode("Password")
    }
  Peer ID Length: uint8
  Peer ID: string
  Password Length: uint8
  Password: string
Response:
  operator: |
    this.ProcessSubNode("Message Length")
    n = getNodeResult("Message Length").Value
    if n > 0 && n < 256 {
      this.GetSubNode("Message").SetMaxLength(n)
      this.ProcessSubNode("Message")
    }
  Message Length: uint8
  Message: string
