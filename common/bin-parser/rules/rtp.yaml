endian: big
Package:
  RTP:
    operator: |
      this.ProcessSubNode("VersionPXPCC")
      vpc = getNodeResult("VersionPXPCC").Value
      ver = vpc >> 6
      if ver != 2 {
        panic("rtp: version must be 2")
      }
      cc = vpc & 0x0f
      this.ProcessSubNode("MarkerPayload")
      this.ProcessSubNode("Sequence")
      this.ProcessSubNode("Timestamp")
      this.ProcessSubNode("SSRC")
      n = vpc & 0x0f
      if n > 0 {
        this.ProcessSubNode("CSRCs")
      }
      xbit = (vpc >> 4) & 1
      if xbit == 1 {
        this.ProcessSubNode("Ext Profile")
        this.ProcessSubNode("Ext Length")
        el = getNodeResult("Ext Length").Value
        if el > 0 && el < 1024 {
          this.GetSubNode("Extension").SetMaxLength(el * 4)
          this.ProcessSubNode("Extension")
        }
      }
      if this.Length() < this.GetMaxLength() {
        rest = this.GetMaxLength() - this.Length()
        if rest > 0 && rest < 1048576 {
          this.GetSubNode("Payload").SetMaxLength(rest)
          this.ProcessSubNode("Payload")
        }
      }
    VersionPXPCC: uint8
    MarkerPayload: uint8
    Sequence: uint16
    Timestamp: uint32
    SSRC: uint32
    Ext Profile: uint16
    Ext Length: uint16
    Extension: string
    CSRCs:
      list: true
      CSRC: uint32
      operator: |
        vpc = getNodeResult("../VersionPXPCC").Value
        n = vpc & 0x0f
        i = 0
        for {
          if i >= n {
            break
          }
          ele = this.NewElement()
          if ele.GetMaxLength() < 4 {
            break
          }
          ele.Process()
          i = i + 1
        }
    Payload: raw
  RTCP:
    operator: |
      messageLength = this.GetMaxLength()
      bounded = messageLength > 0 && messageLength < 1048576
      this.ProcessSubNode("VersionPCount")
      vpc = getNodeResult("VersionPCount").Value
      ver = vpc >> 6
      if ver != 2 {
        panic("rtcp: version must be 2")
      }
      this.ProcessSubNode("Packet Type")
      pt = getNodeResult("Packet Type").Value
      if pt < 200 || pt > 204 {
        panic("rtcp: unexpected packet type")
      }
      this.ProcessSubNode("Length")
      l = getNodeResult("Length").Value
      total = (l + 1) * 4
      if total < 8 {
        panic("rtcp: length too small")
      }
      if total >= 1048576 {
        panic("rtcp: packet too large")
      }
      if bounded && total > messageLength {
        panic("rtcp: packet length exceeds input")
      }
      this.ProcessSubNode("SSRC")
      if pt == 200 {
        senderRemaining = total - this.Length()
        if senderRemaining < 20 {
          if total != 8 {
            panic("rtcp: sender report is truncated")
          }
        } else {
          this.ProcessByType("RTCPSR")
        }
      }
      reports = vpc & 0x1f
      if pt == 200 || pt == 201 {
        reportBytes = reports * 24
        if reportBytes > total - this.Length() {
          panic("rtcp: report blocks exceed packet length")
        }
        if reportBytes > 0 {
          this.GetSubNode("Report Blocks").SetMaxLength(reportBytes)
          this.ProcessSubNode("Report Blocks")
        }
      }
      firstRemaining = total - this.Length()
      if firstRemaining > 0 {
        this.GetSubNode("First Packet Payload").SetMaxLength(firstRemaining)
        this.ProcessSubNode("First Packet Payload")
      }
      if bounded && messageLength > this.Length() {
        compoundLength = messageLength - this.Length()
        this.GetSubNode("Compound Packets").SetMaxLength(compoundLength)
        this.ProcessSubNode("Compound Packets")
      }
    VersionPCount: uint8
    Packet Type: uint8
    Length: uint16
    SSRC: uint32
    Report Blocks:
      list: true
      Report Block:
        SSRC: uint32
        Fraction Lost: uint8
        Cumulative Packets Lost: raw,3
        Extended Highest Sequence: uint32
        Interarrival Jitter: uint32
        Last SR: uint32
        Delay Since Last SR: uint32
      operator: |
        for {
          if this.Length() >= this.GetMaxLength() {
            break
          }
          this.NewElement().Process()
        }
    First Packet Payload: raw
    Compound Packets:
      list: true
      Packet: RTCPPacket
      operator: |
        for {
          if this.Length() >= this.GetMaxLength() {
            break
          }
          previous = this.Length()
          this.NewElement().Process()
          if this.Length() <= previous {
            panic("rtcp: compound packet made no progress")
          }
        }
RTCPSR:
  NTP MSW: uint32
  NTP LSW: uint32
  RTP Timestamp: uint32
  Packet Count: uint32
  Octet Count: uint32
RTCPPacket:
  operator: |
    packetMaximum = this.GetMaxLength()
    this.ProcessSubNode("VersionPCount")
    vpc = getNodeResult("VersionPCount").Value
    if vpc >> 6 != 2 {
      panic("rtcp: compound packet version must be 2")
    }
    this.ProcessSubNode("Packet Type")
    pt = getNodeResult("Packet Type").Value
    if pt < 200 || pt > 204 {
      panic("rtcp: unexpected compound packet type")
    }
    this.ProcessSubNode("Length")
    total = (getNodeResult("Length").Value + 1) * 4
    if total < 8 || total >= 1048576 {
      panic("rtcp: invalid compound packet length")
    }
    if total > packetMaximum {
      panic("rtcp: compound packet length exceeds input")
    }
    this.ProcessSubNode("SSRC")
    remaining = total - this.Length()
    if remaining > 0 {
      this.GetSubNode("Payload").SetMaxLength(remaining)
      this.ProcessSubNode("Payload")
    }
  VersionPCount: uint8
  Packet Type: uint8
  Length: uint16
  SSRC: uint32
  Payload: raw
