endian: big
Package:
  STP:
    operator: |
      // Validate the entire selected message before publishing the historical
      // leaf layout. Recovery keeps the original cursor and child names.
      complete = true
      failure = ""
      if this.HasMaxLength() {
        staged, operation = this.TryProcessByType("STPValidation")
        operation.Recovery()
        complete = operation.OK
        failure = operation.Message
        prefix, peek = this.TryProcessByType("STPHeaderPrefix")
        peek.Recovery()
        if peek.OK && ((prefix.Value >> 8) & 255) == 3 && (prefix.Value & 255) == 2 {
          this.ProcessByType("STPValidation")
          return
        }
      }
      this.ProcessSubNode("Protocol ID")
      if getNodeResult("Protocol ID").Value != 0 {
        panic("stp: protocol id must be 0")
      }
      this.ProcessSubNode("Version")
      version = getNodeResult("Version").Value
      this.ProcessSubNode("BPDU Type")
      btype = getNodeResult("BPDU Type").Value
      if btype == 0x80 {
        if !complete { panic(failure) }
        return
      }
      if btype == 0x00 || btype == 0x02 {
        this.ProcessSubNode("Config")
        if !complete { panic(failure) }
        if !(btype == 0 || (version == 2 && btype == 2)) { panic("stp: unsupported version/type") }
        return
      }
      panic("stp: unknown bpdu type")
    Protocol ID: uint16
    Version: uint8
    BPDU Type: uint8
    Config:
      operator: |
        this.ProcessSubNode("Flags")
        this.ProcessSubNode("Root Priority")
        this.ProcessSubNode("Root Ext High")
        this.ProcessSubNode("Root Ext Low")
        this.ProcessSubNode("Root MAC")
        this.ProcessSubNode("Root Path Cost")
        this.ProcessSubNode("Bridge Priority")
        this.ProcessSubNode("Bridge Ext High")
        this.ProcessSubNode("Bridge Ext Low")
        this.ProcessSubNode("Bridge MAC")
        this.ProcessSubNode("Port ID")
        this.ProcessSubNode("Message Age")
        this.ProcessSubNode("Max Age")
        this.ProcessSubNode("Hello Time")
        this.ProcessSubNode("Forward Delay")
        btype = getNodeResult("../BPDU Type").Value
        if btype == 0x02 {
          this.ProcessSubNode("Version 1 Length")
        }
        return
      Flags: uint8
      Root Priority: uint8,4bit
      Root Ext High: uint8,4bit
      Root Ext Low: uint8
      Root MAC: raw,6
      Root Path Cost: uint32
      Bridge Priority: uint8,4bit
      Bridge Ext High: uint8,4bit
      Bridge Ext Low: uint8
      Bridge MAC: raw,6
      Port ID: uint16
      Message Age: uint16
      Max Age: uint16
      Hello Time: uint16
      Forward Delay: uint16
      Version 1 Length: uint8
  STPFields:
    operator: |
      err = parseObservedSession("stp")
      if err != nil { panic(err) }
  PVSTFields:
    operator: |
      err = parseObservedSession("pvst")
      if err != nil { panic(err) }
STPValidation:
  operator: |
    err = parseObservedSession("stp")
    if err != nil { panic(err) }
STPHeaderPrefix: uint32
