Package:
  CHAP:
    Code: uint8
    Identifier: uint8
    Length: uint16
    length-from-field: "Length"
    Info:
      unpack: true
      operator: |
        type = getNodeResult("@CHAP/Code").Value
        switch type {
           case 0x01:
              this.ProcessByType("Data")
           case 0x02:
              this.ProcessByType("Data")
           default:
              this.ProcessByType("Message")
        }
Data:
  operator: |
    this.ProcessSubNode("Value Size")
    vs = getNodeResult("Value Size").Value
    if vs > 0 && vs < 255 {
      this.GetSubNode("Value").SetMaxLength(vs)
      this.ProcessSubNode("Value")
    }
    rest = this.GetMaxLength() - this.Length()
    if rest > 0 && rest < 1048576 {
      this.GetSubNode("Name").SetMaxLength(rest)
      this.ProcessSubNode("Name")
    }
  Value Size: uint8
  Value: string
  Name: string
Message:
  operator: |
    rest = this.GetMaxLength() - this.Length()
    if rest > 0 && rest < 1048576 {
      this.GetSubNode("Text").SetMaxLength(rest)
      this.ProcessSubNode("Text")
    }
  Text: string
