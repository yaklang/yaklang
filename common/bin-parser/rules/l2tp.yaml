endian: big
Package:
  L2TP:
    operator: |
      this.ProcessSubNode("Flags")
      flags = getNodeResult("Flags").Value
      ver = flags & 0x0f
      if ver != 2 {
        panic("l2tp: version must be 2")
      }
      this.ProcessSubNode("Length")
      this.ProcessSubNode("Tunnel ID")
      this.ProcessSubNode("Session ID")
      this.ProcessSubNode("Ns")
      this.ProcessSubNode("Nr")
      if this.Length() < this.GetMaxLength() {
        rest = this.GetMaxLength() - this.Length()
        if rest > 0 && rest < 1048576 {
          this.GetSubNode("Payload").SetMaxLength(rest)
          this.ProcessSubNode("Payload")
        }
      }
    Flags: uint16
    Length: uint16
    Tunnel ID: uint16
    Session ID: uint16
    Ns: uint16
    Nr: uint16
    Payload: raw
