endian: big
unit: byte
Package:
    TCP:
        Source Port: uint16
        Destination Port: uint16
        Sequence Number: raw,4
        Acknowledgement Number: raw,4
        Header Length: uint8,4bit
        Flags: raw,12bit
        Window: raw,2
        Checksum: raw,2
        Urgent Pointer: raw,2
        Options: # 字节数需要是4的倍数，不足补0
            list: true
            Option: Option
            operator: |
                this.SetMaxLength(getNodeResult("../Header Length").Value*4 - 20)
                for {
                    ele = this.NewElement()
                    if ele.GetMaxLength() == 0{
                        break
                    }
                    ele.Process()
                    if ele.GetSubNode("Kind").Result().Value == 0 {
                        break
                    }
                }
                if this.Length() < this.GetMaxLength() {
                    this.NewEmptyNode().Process()
                }
        Payload:
            unpack: true
            operator: |
                src = getNodeResult("@TCP/Source Port").Value
                dst = getNodeResult("@TCP/Destination Port").Value
                typeNameList = ["TLS", "HTTP", "SSH", "Redis", "MQTT", "FTP", "SMTP"]
                if src == 22 || dst == 22 {
                  typeNameList = ["SSH"]
                } else if src == 21 || dst == 21 {
                  typeNameList = ["FTP"]
                } else if src == 25 || dst == 25 || src == 587 || dst == 587 {
                  typeNameList = ["SMTP"]
                } else if src == 6379 || dst == 6379 {
                  typeNameList = ["Redis"]
                } else if src == 1883 || dst == 1883 || src == 8883 || dst == 8883 {
                  typeNameList = ["MQTT"]
                } else if src == 443 || dst == 443 {
                  typeNameList = ["TLS", "HTTP"]
                } else if src == 80 || dst == 80 || src == 8080 || dst == 8080 {
                  typeNameList = ["HTTP", "TLS"]
                }
                for typeName in typeNameList{
                    res,op = this.TryProcessByType(typeName)
                    if op.OK {
                        err = op.Save()
                        if err != nil{
                            panic(err)
                        }
                        return
                    }else{
                        err = op.Recovery()
                        if err != nil{
                            panic(err)
                        }
                        debug("parse node %s failed: %v", typeName, op.Message)
                    }
                }
Option:
    operator: |
        n = this.ProcessSubNode("Kind").Value
        switch n {
        case 0:
            break
        case 1:
            break
        default:
            this.ProcessSubNode("Length")
            if this.GetSubNode("Data").GetRemainingSpace() != 0 {
                this.ProcessSubNode("Data")
            }    
        }
    length-from-field: Length
    Kind: uint8
    Length: uint8
    Data: raw
TLS: "import:application-layer/tls.yaml;node:Transport Layer Security"
HTTP: "import:application-layer/http.yaml;node:HTTP"
SSH: "import:application-layer/ssh.yaml;node:SSH"
FTP: "import:application-layer/ftp.yaml;node:FTP"
SMTP: "import:application-layer/smtp.yaml;node:SMTP"
Redis: "import:application-layer/redis.yaml;node:RESP"
MQTT: "import:application-layer/mqtt.yaml;node:MQTT"