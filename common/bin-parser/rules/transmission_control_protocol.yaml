endian: big
unit: byte
Package:
    TCP:
        Source Port: uint16
        Destination Port: uint16
        Sequence Number: raw,4
        Acknowledgement Number: raw,4
        Header Length: uint8,4bit
        Flags: raw,12bit
        Window: raw,2
        Checksum: raw,2
        Urgent Pointer: raw,2
        Options: # 字节数需要是4的倍数，不足补0
            list: true
            Option: Option
            operator: |
                this.SetMaxLength(getNodeResult("../Header Length").Value*4 - 20)
                for {
                    ele = this.NewElement()
                    if ele.GetMaxLength() == 0{
                        break
                    }
                    ele.Process()
                    if ele.GetSubNode("Kind").Result().Value == 0 {
                        break
                    }
                }
                if this.Length() < this.GetMaxLength() {
                    this.NewEmptyNode().Process()
                }
        Payload:
            unpack: true
            operator: |
                src = getNodeResult("@TCP/Source Port").Value
                dst = getNodeResult("@TCP/Destination Port").Value
                typeNameList = ["TLS", "HTTP", "SSH", "Redis", "MQTT", "FTP", "SMTP"]
                if src == 22 || dst == 22 {
                  typeNameList = ["SSHPacket", "SSH"]
                } else if src == 21 || dst == 21 {
                  typeNameList = ["FTP", "FTPCommand"]
                } else if src == 25 || dst == 25 || src == 587 || dst == 587 {
                  typeNameList = ["SMTP", "SMTPCommand"]
                } else if src == 6379 || dst == 6379 {
                  typeNameList = ["Redis"]
                } else if src == 1883 || dst == 1883 || src == 8883 || dst == 8883 {
                  typeNameList = ["MQTT"]
                } else if src == 3306 || dst == 3306 {
                  typeNameList = ["MySQL"]
                } else if src == 5432 || dst == 5432 {
                  typeNameList = ["PostgreSQL", "PGSSLRequest", "PGCancel", "PGStartup"]
                } else if src == 1433 || dst == 1433 {
                  typeNameList = ["TDS"]
                } else if src == 8009 || dst == 8009 {
                  typeNameList = ["AJP"]
                } else if src == 88 || dst == 88 {
                  typeNameList = ["KerberosTCP", "Kerberos"]
                } else if src == 445 || dst == 445 {
                  typeNameList = ["SMB3Transform", "SMB2", "SMB", "NBSS"]
                } else if src == 139 || dst == 139 {
                  typeNameList = ["NBSS", "SMB2", "SMB"]
                } else if src == 443 || dst == 443 {
                  typeNameList = ["TLS", "HTTP2Preface", "HTTP2", "HTTP"]
                } else if src == 80 || dst == 80 || src == 8080 || dst == 8080 {
                  typeNameList = ["HTTP2Preface", "HTTP2", "WebSocket", "HTTP", "TLS"]
                } else if src == 1521 || dst == 1521 {
                  typeNameList = ["TNS"]
                } else if src == 135 || dst == 135 {
                  typeNameList = ["DCERPC"]
                } else if src == 1099 || dst == 1099 {
                  typeNameList = ["RMI", "JavaSer"]
                } else if src == 3389 || dst == 3389 {
                  typeNameList = ["RDP", "TPKT"]
                } else if src == 389 || dst == 389 {
                  typeNameList = ["LDAPMessage"]
                } else if src == 23 || dst == 23 {
                  typeNameList = ["Telnet"]
                } else if src == 110 || dst == 110 {
                  typeNameList = ["POP3"]
                } else if src == 143 || dst == 143 {
                  typeNameList = ["IMAP"]
                } else if src == 179 || dst == 179 {
                  typeNameList = ["BGP"]
                } else if src == 1080 || dst == 1080 {
                  typeNameList = ["SOCKS4", "SOCKS5Req"]
                } else if src == 1723 || dst == 1723 {
                  typeNameList = ["PPTP"]
                } else if src == 5900 || dst == 5900 {
                  typeNameList = ["VNC"]
                } else if src == 27017 || dst == 27017 {
                  typeNameList = ["MongoDB"]
                } else if src == 11211 || dst == 11211 {
                  typeNameList = ["Memcached"]
                } else if src == 5672 || dst == 5672 {
                  typeNameList = ["AMQP"]
                } else if src == 9092 || dst == 9092 {
                  typeNameList = ["Kafka"]
                } else if src == 465 || dst == 465 || src == 636 || dst == 636 || src == 853 || dst == 853 || src == 993 || dst == 993 || src == 995 || dst == 995 {
                  typeNameList = ["TLS"]
                } else if src == 554 || dst == 554 {
                  typeNameList = ["RTSP"]
                } else if src == 1935 || dst == 1935 {
                  typeNameList = ["RTMP"]
                } else if src == 5005 || dst == 5005 {
                  typeNameList = ["JDWP"]
                } else if src == 9000 || dst == 9000 {
                  typeNameList = ["FastCGI"]
                } else if src == 49 || dst == 49 {
                  typeNameList = ["TACACS"]
                } else if src == 20 || dst == 20 {
                  typeNameList = ["FTPData", "TLS", "HTTP"]
                } else if src == 111 || dst == 111 {
                  typeNameList = ["ONCRPC", "TLS", "HTTP"]
                } else if src == 2809 || dst == 2809 {
                  typeNameList = ["GIOP", "TLS", "HTTP"]
                } else if src == 7001 || dst == 7001 {
                  typeNameList = ["T3", "TLS", "HTTP"]
                } else if src == 873 || dst == 873 {
                  typeNameList = ["Rsync", "TLS", "HTTP"]
                } else if src == 10050 || dst == 10050 {
                  typeNameList = ["Zabbix", "TLS", "HTTP"]
                } else if src == 6881 || dst == 6881 {
                  typeNameList = ["BitTorrent", "TLS", "HTTP"]
                } else if src == 4505 || dst == 4505 {
                  typeNameList = ["Salt", "TLS", "HTTP"]
                } else if src == 8545 || dst == 8545 {
                  typeNameList = ["JSONRPC", "TLS", "HTTP"]
                } else if src == 9090 || dst == 9090 {
                  typeNameList = ["Thrift", "TLS", "HTTP"]
                } else if src == 8088 || dst == 8088 {
                  typeNameList = ["NetRemoting", "TLS", "HTTP"]
                } else if src == 50000 || dst == 50000 {
                  typeNameList = ["Jenkins", "TLS", "HTTP", "SSH", "Redis", "MQTT", "FTP", "SMTP"]
                } else if src == 8089 || dst == 8089 {
                  typeNameList = ["Hessian", "TLS", "HTTP"]
                } else if src == 7777 || dst == 7777 {
                  typeNameList = ["PHPSer", "TLS", "HTTP"]
                } else if src == 11312 || dst == 11312 {
                  typeNameList = ["Pickle", "TLS", "HTTP"]
                } else if src == 4011 || dst == 4011 {
                  typeNameList = ["Protobuf", "TLS", "HTTP"]
                }
                for typeName in typeNameList{
                    res,op = this.TryProcessByType(typeName)
                    if op.OK {
                        err = op.Save()
                        if err != nil{
                            panic(err)
                        }
                        return
                    }else{
                        err = op.Recovery()
                        if err != nil{
                            panic(err)
                        }
                        debug("parse node %s failed: %v", typeName, op.Message)
                    }
                }
Option:
    operator: |
        this.ProcessSubNode("Kind")
        k = getNodeResult("Kind").Value
        if k == 0 {
          return
        }
        if k == 1 {
          return
        }
        this.ProcessSubNode("Length")
        if k == 2 {
          this.ProcessSubNode("MSS")
          return
        }
        if k == 3 {
          this.ProcessSubNode("Shift Count")
          return
        }
        if k == 4 {
          return
        }
        if k == 8 {
          this.ProcessSubNode("TS Val")
          this.ProcessSubNode("TS Echo Reply")
          return
        }
        if this.GetSubNode("Option Data").GetRemainingSpace() != 0 {
          this.ProcessSubNode("Option Data")
        }
        return
    length-from-field: Length
    Kind: uint8
    Length: uint8
    MSS: uint16
    Shift Count: uint8
    TS Val: uint32
    TS Echo Reply: uint32
    Option Data: string
