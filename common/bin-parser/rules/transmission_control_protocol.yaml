endian: big
unit: byte
Package:
    TCP:
        Source Port: uint16
        Destination Port: uint16
        Sequence Number: raw,4
        Acknowledgement Number: raw,4
        Header Length: uint8,4bit
        Flags: raw,12bit
        Window: raw,2
        Checksum: raw,2
        Urgent Pointer: raw,2
        Options: # 字节数需要是4的倍数，不足补0
            list: true
            Option: Option
            operator: |
                this.SetMaxLength(getNodeResult("../Header Length").Value*4 - 20)
                for {
                    ele = this.NewElement()
                    if ele.GetMaxLength() == 0{
                        break
                    }
                    ele.Process()
                    if ele.GetSubNode("Kind").Result().Value == 0 {
                        break
                    }
                }
                if this.Length() < this.GetMaxLength() {
                    this.NewEmptyNode().Process()
                }
        Payload:
            unpack: true
            operator: |
                src = getNodeResult("@TCP/Source Port").Value
                dst = getNodeResult("@TCP/Destination Port").Value
                typeNameList = ["TLS", "HTTP", "SSH", "Redis", "MQTT", "FTP", "SMTP"]
                if src == 22 || dst == 22 {
                  typeNameList = ["SSHPacket", "SSH"]
                } else if src == 21 || dst == 21 {
                  typeNameList = ["FTP", "FTPCommand"]
                } else if src == 25 || dst == 25 || src == 587 || dst == 587 {
                  typeNameList = ["SMTP", "SMTPCommand"]
                } else if src == 6379 || dst == 6379 {
                  typeNameList = ["Redis"]
                } else if src == 1883 || dst == 1883 || src == 8883 || dst == 8883 {
                  typeNameList = ["MQTT"]
                } else if src == 3306 || dst == 3306 {
                  typeNameList = ["MySQL"]
                } else if src == 5432 || dst == 5432 {
                  typeNameList = ["PostgreSQL", "PGSSLRequest", "PGCancel", "PGStartup"]
                } else if src == 1433 || dst == 1433 {
                  typeNameList = ["TDS"]
                } else if src == 8009 || dst == 8009 {
                  typeNameList = ["AJP"]
                } else if src == 88 || dst == 88 {
                  typeNameList = ["KerberosTCP", "Kerberos"]
                } else if src == 445 || dst == 445 {
                  typeNameList = ["SMB3Transform", "SMB2", "SMB", "NBSS"]
                } else if src == 139 || dst == 139 {
                  typeNameList = ["NBSS", "SMB2", "SMB"]
                } else if src == 443 || dst == 443 {
                  typeNameList = ["TLS", "HTTP2Preface", "HTTP2", "HTTP"]
                } else if src == 80 || dst == 80 || src == 8080 || dst == 8080 {
                  typeNameList = ["HTTP2Preface", "HTTP2", "WebSocket", "HTTP", "TLS"]
                } else if src == 1521 || dst == 1521 {
                  typeNameList = ["TNS"]
                } else if src == 135 || dst == 135 {
                  typeNameList = ["DCERPC"]
                } else if src == 1099 || dst == 1099 {
                  typeNameList = ["JavaSer"]
                } else if src == 3389 || dst == 3389 {
                  typeNameList = ["TPKT"]
                } else if src == 389 || dst == 389 {
                  typeNameList = ["LDAPMessage"]
                }
                for typeName in typeNameList{
                    res,op = this.TryProcessByType(typeName)
                    if op.OK {
                        err = op.Save()
                        if err != nil{
                            panic(err)
                        }
                        return
                    }else{
                        err = op.Recovery()
                        if err != nil{
                            panic(err)
                        }
                        debug("parse node %s failed: %v", typeName, op.Message)
                    }
                }
Option:
    operator: |
        n = this.ProcessSubNode("Kind").Value
        switch n {
        case 0:
            break
        case 1:
            break
        default:
            this.ProcessSubNode("Length")
            if this.GetSubNode("Data").GetRemainingSpace() != 0 {
                this.ProcessSubNode("Data")
            }    
        }
    length-from-field: Length
    Kind: uint8
    Length: uint8
    Data: raw
TLS: "import:application-layer/tls.yaml;node:Transport Layer Security"
HTTP: "import:application-layer/http.yaml;node:HTTP"
SSH: "import:application-layer/ssh.yaml;node:SSH"
SSHPacket: "import:application-layer/ssh.yaml;node:SSHPacket"
FTP: "import:application-layer/ftp.yaml;node:FTP"
FTPCommand: "import:application-layer/ftp.yaml;node:FTPCommand"
SMTP: "import:application-layer/smtp.yaml;node:SMTP"
SMTPCommand: "import:application-layer/smtp.yaml;node:SMTPCommand"
Redis: "import:application-layer/redis.yaml;node:RESP"
MQTT: "import:application-layer/mqtt.yaml;node:MQTT"
SMB2: "import:application-layer/smb2.yaml;node:SMB2"
SMB: "import:application-layer/smb.yaml;node:SMB"
NBSS: "import:application-layer/nbss.yaml;node:NBSS"
MySQL: "import:application-layer/mysql.yaml;node:MySQLPacket"
Kerberos: "import:application-layer/kerberos.yaml;node:Kerberos"
KerberosTCP: "import:application-layer/kerberos.yaml;node:KerberosTCP"
PostgreSQL: "import:application-layer/postgresql.yaml;node:PostgreSQL"
PGStartup: "import:application-layer/postgresql.yaml;node:Startup"
PGSSLRequest: "import:application-layer/postgresql.yaml;node:SSLRequest"
PGCancel: "import:application-layer/postgresql.yaml;node:CancelRequest"
TDS: "import:application-layer/tds.yaml;node:TDS"
AJP: "import:application-layer/ajp.yaml;node:AJP"
HTTP2Preface: "import:application-layer/http2.yaml;node:HTTP2Preface"
HTTP2: "import:application-layer/http2.yaml;node:HTTP2"
WebSocket: "import:application-layer/websocket.yaml;node:WebSocket"
TNS: "import:application-layer/tns.yaml;node:TNS"
DCERPC: "import:application-layer/dcerpc.yaml;node:DCERPC"
JavaSer: "import:application-layer/java_ser.yaml;node:JavaSer"
SMB3Transform: "import:application-layer/smb3.yaml;node:SMB3Transform"
TPKT: "import:application-layer/msrdp.yaml;node:TPKT"
