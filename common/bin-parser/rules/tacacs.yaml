endian: big
Package:
  TACACS:
    operator: |
      this.ProcessSubNode("Version")
      ver = getNodeResult("Version").Value
      major = ver >> 4
      if major != 12 {
        panic("tacacs: major version must be 12")
      }
      this.ProcessSubNode("Type")
      typ = getNodeResult("Type").Value
      if typ < 1 || typ > 3 {
        panic("tacacs: type must be 1-3")
      }
      this.ProcessSubNode("Sequence")
      this.ProcessSubNode("Flags")
      this.ProcessSubNode("Session ID")
      this.ProcessSubNode("Length")
      l = getNodeResult("Length").Value
      if typ == 1 && l >= 8 {
        this.ProcessSubNode("AuthenStart")
        ul = getNodeResult("User Len").Value
        pl = getNodeResult("Port Len").Value
        rl = getNodeResult("RemAddr Len").Value
        dl = getNodeResult("Data Len").Value
        if ul > 0 && ul < 512 {
          this.GetSubNode("User").SetMaxLength(ul)
          this.ProcessSubNode("User")
        }
        if pl > 0 && pl < 512 {
          this.GetSubNode("Port").SetMaxLength(pl)
          this.ProcessSubNode("Port")
        }
        if rl > 0 && rl < 512 {
          this.GetSubNode("RemAddr").SetMaxLength(rl)
          this.ProcessSubNode("RemAddr")
        }
        if dl > 0 && dl < 512 {
          this.GetSubNode("Token").SetMaxLength(dl)
          this.ProcessSubNode("Token")
        }
        return
      }
    Version: uint8
    Type: uint8
    Sequence: uint8
    Flags: uint8
    Session ID: uint32
    Length: uint32
    AuthenStart:
      unpack: true
      Action: uint8
      Priv Lvl: uint8
      Authen Type: uint8
      Service: uint8
      User Len: uint8
      Port Len: uint8
      RemAddr Len: uint8
      Data Len: uint8
    User: string
    Port: string
    RemAddr: string
    Token: string
