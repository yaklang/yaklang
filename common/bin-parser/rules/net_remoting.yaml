endian: big
Package:
  NetRemoting:
    operator: |
      this.ProcessSubNode("Preamble")
      p = string(getNodeResult("Preamble").Value)
      if p != ".NET" {
        panic("net-remoting: preamble must be .NET")
      }
      this.ProcessSubNode("Major")
      this.ProcessSubNode("Minor")
      this.ProcessSubNode("Operation Type")
      this.ProcessSubNode("Content Length")
      l = getNodeResult("Content Length").Value
      if l > 0 && l < 1048576 {
        this.GetSubNode("Serialized").SetMaxLength(l)
        this.ProcessSubNode("Serialized")
      }
    Preamble: raw,4
    Major: uint16
    Minor: uint16
    Operation Type: uint16
    Content Length: uint32
    Serialized: string
