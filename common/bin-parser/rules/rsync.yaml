Package:
  Rsync:
    operator: |
      this.ProcessSubNode("Magic")
      mag = string(getNodeResult("Magic").Value)
      if mag != "@RSYNCD:" {
        panic("rsync: expected @RSYNCD banner")
      }
      this.ProcessSubNode("Space")
      this.ProcessSubNode("Major")
      this.ProcessSubNode("Minor")
    Magic: string,8
    Space: uint8
    Major: "del:.;type:string"
    Minor: "del:\n;type:string"
