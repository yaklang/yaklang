Package:
  Rsync:
    operator: |
      this.ProcessSubNode("Magic")
      mag = string(getNodeResult("Magic").Value)
      if mag != "@RSYNCD:" {
        panic("rsync: expected @RSYNCD banner")
      }
      this.ProcessSubNode("Space")
      this.ProcessSubNode("Version")
    Magic: string,8
    Space: uint8
    Version: "del:\n;type:string"
