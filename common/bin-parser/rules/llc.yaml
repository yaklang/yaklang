endian: big
Package:
  LLC:
    operator: |
      this.ProcessSubNode("DSAP")
      this.ProcessSubNode("SSAP")
      this.ProcessSubNode("Control")
      dsap = getNodeResult("DSAP").Value
      ssap = getNodeResult("SSAP").Value
      ctrl = getNodeResult("Control").Value
      this.AddInfo("Group Destination", dsap & 1 != 0)
      this.AddInfo("Response", ssap & 1 != 0)
      if (ctrl & 0x03) != 0x03 {
        extended = this.ProcessSubNode("Control Extended").Value
        this.AddInfo("Poll Final", extended & 1 != 0)
        this.AddInfo("Receive Sequence", extended >> 1)
        if ctrl & 1 == 0 {
          this.AddInfo("Control Format", "information")
          this.AddInfo("Send Sequence", ctrl >> 1)
        } else {
          this.AddInfo("Control Format", "supervisory")
          this.AddInfo("Supervisory Function", (ctrl >> 2) & 3)
        }
      } else {
        this.AddInfo("Control Format", "unnumbered")
        this.AddInfo("Poll Final", ctrl & 0x10 != 0)
        this.AddInfo("Unnumbered Function", ctrl & 0xef)
      }
      // Only I and UI frames carry the upper-layer message. In particular,
      // an F0 SAP on RR, SABME, UA or DISC must not be called NetBIOS data.
      carriesData = (ctrl & 1) == 0 || (ctrl & 0xef) == 3
      if (ctrl & 0xef) == 3 && dsap == 0xfe && ssap == 0xfe {
        this.ProcessByType("ISIS")
        return
      }
      if carriesData && (dsap & 0xfe) == 0xf0 && (ssap & 0xfe) == 0xf0 {
        this.ProcessByType("NetBIOSFrame")
        return
      }
      if carriesData && (dsap & 0xfe) == 0xe0 && (ssap & 0xfe) == 0xe0 {
        // IPX's length excludes any remaining link data. Keep the direct
        // IPX entry strict; only this explicitly bounded carrier separates
        // the two regions. The trailer is not assumed to be zero padding.
        if !this.HasMaxLength() { panic("llc: IPX carrier boundary is required") }
        remaining = this.GetMaxLength() - this.Length()
        prefix, operation = this.TryProcessByType("IPXPrefix")
        operation.Recovery()
        if !operation.OK { panic("llc: incomplete IPX length prefix") }
        length = prefix.Value & 0xffff
        if length < 30 || length > remaining { panic("llc: IPX length exceeds carrier or is shorter than its header") }
        packet = this.NewSubNode("IPX")
        packet.SetMaxLength(length)
        packet.Process()
        if this.Length() < this.GetMaxLength() {
          this.GetSubNode("IPX Link Trailer").SetMaxLength(this.GetMaxLength() - this.Length())
          this.ProcessSubNode("IPX Link Trailer")
        }
        return
      }
      if dsap == 0x42 {
        this.ProcessByType("STP")
        return
      }
      if dsap == 0xaa {
        // Keep legacy SNAP dispatch unchanged for other PIDs. AARP needs
        // the canonical UI SAP pair, not merely an aa destination SAP.
        this.AddInfo("Canonical SNAP UI", ssap == 0xaa && ctrl == 3)
        this.ProcessByType("SNAP")
        return
      }
      if ctrl == 0xaf || ctrl == 0xbf {
        this.ProcessSubNode("XID Format")
        if getNodeResult("XID Format").Value != 0x81 {
          panic("llc: XID format identifier must be 0x81")
        }
        this.ProcessSubNode("XID Types")
        this.ProcessSubNode("XID Window")
        return
      }
      if this.HasMaxLength() && this.Length() < this.GetMaxLength() {
        this.ProcessSubNode("LLC Payload")
      }
      return
    DSAP: uint8
    SSAP: uint8
    Control: uint8
    Control Extended: uint8
    XID Format: uint8
    XID Types: uint8
    XID Window: uint8
    LLC Payload: raw
    IPX Link Trailer: raw
SNAP:
  operator: |
    this.ProcessSubNode("OUI")
    this.ProcessSubNode("Type")
    typ = getNodeResult("Type").Value
    oui = getNodeResult("OUI").Value
    if typ == 0x809b && oui[0] == 8 && oui[1] == 0 && oui[2] == 7 && this.GetParent().GetInfo("Canonical SNAP UI") == true {
      this.ProcessByType("DDPCarrier")
      return
    }
    if typ == 0x80f3 && oui[0] == 0 && oui[1] == 0 && oui[2] == 0 && this.GetParent().GetInfo("Canonical SNAP UI") == true {
      this.ProcessByType("AARPCarrier")
      return
    }
    if typ == 0x0800 {
      this.ProcessByType("IP")
      return
    }
    if typ == 0x0806 {
      this.ProcessByType("ARP")
      return
    }
    if typ == 0x2000 {
      this.ProcessByType("CDP")
      return
    }
    remaining = this.GetMaxLength() - this.Length()
    if this.HasMaxLength() && remaining > 0 {
      this.GetSubNode("SNAP Payload").SetMaxLength(remaining)
      this.ProcessSubNode("SNAP Payload")
    }
    return
  OUI: raw,3
  Type: uint16
  SNAP Payload: raw
STP: "import:stp.yaml;node:STP"
CDP: "import:cdp.yaml;node:CDP"
IP: "import:internet_protocol.yaml;node:Internet Protocol"
ARP: "import:address_resolution_protocol.yaml;node:Address Resolution Protocol"
AARPCarrier: "import:aarp.yaml;node:AARPCarrier"
DDPCarrier: "import:appletalk.yaml;node:DDPCarrier"
NetBIOSFrame: "import:netbios_frame.yaml;node:NetBIOSFrame"
IPX: "import:ipx.yaml;node:IPX"
IPXPrefix: uint32
ISIS: "import:isis.yaml;node:ISIS"
