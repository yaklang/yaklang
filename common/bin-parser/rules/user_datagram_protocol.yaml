Package:
    UDP:
        Source Port: uint16
        Destination Port: uint16
        Length: uint16
        Checksum: uint16
        Payload:
            unpack: true
            operator: |
              src = getNodeResult("@UDP/Source Port").Value
              dst = getNodeResult("@UDP/Destination Port").Value
              typeNameList = ["DNS", "DHCP", "NTP", "SNMP"]
              if src == 53 || dst == 53 {
                typeNameList = ["DNS"]
              } else if src == 67 || dst == 67 || src == 68 || dst == 68 {
                typeNameList = ["DHCP"]
              } else if src == 123 || dst == 123 {
                typeNameList = ["NTP"]
              } else if src == 161 || dst == 161 || src == 162 || dst == 162 {
                typeNameList = ["SNMP"]
              } else if src == 88 || dst == 88 {
                typeNameList = ["Kerberos"]
              } else if src == 137 || dst == 137 {
                typeNameList = ["NBNS"]
              } else if src == 5355 || dst == 5355 {
                typeNameList = ["LLMNR"]
              } else if src == 1812 || dst == 1812 || src == 1813 || dst == 1813 || src == 1645 || dst == 1645 {
                typeNameList = ["RADIUS"]
              } else if src == 443 || dst == 443 {
                typeNameList = ["QUIC"]
              } else if src == 389 || dst == 389 {
                typeNameList = ["LDAPMessage"]
              }
              for typeName in typeNameList{
                  res,op = this.TryProcessByType(typeName)
                  if op.OK {
                      err = op.Save()
                      if err != nil{
                          panic(err)
                      }
                      return
                  }else{
                      debug(op.Message)
                      err = op.Recovery()
                      if err != nil{
                          panic(err)
                      }
                  }
              }
DNS: "import:application-layer/dns.yaml;node:DNS"
DHCP: "import:application-layer/dhcp.yaml;node:DHCP"
NTP: "import:application-layer/ntp.yaml;node:NTP"
SNMP: "import:application-layer/snmp.yaml;node:SNMP"
Kerberos: "import:application-layer/kerberos.yaml;node:Kerberos"
NBNS: "import:application-layer/nbns.yaml;node:NBNS"
LLMNR: "import:application-layer/nbns.yaml;node:LLMNR"
RADIUS: "import:application-layer/radius.yaml;node:RADIUS"
QUIC: "import:application-layer/quic.yaml;node:QUIC"
LDAPMessage: "import:application-layer/ldap.yaml;node:LDAPMessage"
