Package:
    UDP:
        Source Port: uint16
        Destination Port: uint16
        Length: uint16
        Checksum: uint16
        Payload:
            unpack: true
            operator: |
              payloadStart = getCurrentPosition()
              maximum = this.GetMaxLength()
              bounded = maximum > 0 && maximum < 1048576
              src = getNodeResult("@UDP/Source Port").Value
              dst = getNodeResult("@UDP/Destination Port").Value
              typeNameList = ["DNS", "DHCP", "NTP", "SNMP"]
              if src == 53 || dst == 53 {
                typeNameList = ["DNS"]
              } else if src == 5353 || dst == 5353 {
                typeNameList = ["MDNS"]
              } else if src == 67 || dst == 67 || src == 68 || dst == 68 {
                typeNameList = ["DHCP"]
              } else if src == 546 || dst == 546 || src == 547 || dst == 547 {
                typeNameList = ["DHCPv6"]
              } else if src == 123 || dst == 123 {
                typeNameList = ["NTP"]
              } else if src == 161 || dst == 161 || src == 162 || dst == 162 {
                typeNameList = ["SNMPv3", "SNMP"]
              } else if src == 88 || dst == 88 {
                typeNameList = ["Kerberos"]
              } else if src == 137 || dst == 137 {
                typeNameList = ["NBNS"]
              } else if src == 138 || dst == 138 {
                typeNameList = ["NBTDG"]
              } else if dst == 173 {
                typeNameList = ["XYPLEXRequestCarrier"]
              } else if src == 173 {
                typeNameList = ["XYPLEXReplyCarrier"]
              } else if src == 5355 || dst == 5355 {
                typeNameList = ["LLMNR"]
              } else if src == 1812 || dst == 1812 || src == 1813 || dst == 1813 || src == 1645 || dst == 1645 {
                typeNameList = ["RADIUS"]
              } else if src == 443 || dst == 443 {
                typeNameList = ["QUIC", "DTLS"]
              } else if src == 389 || dst == 389 {
                typeNameList = ["LDAPMessage"]
              } else if src == 69 || dst == 69 {
                typeNameList = ["TFTP"]
              } else if src == 514 || dst == 514 {
                typeNameList = ["Syslog"]
              } else if src == 520 || dst == 520 {
                typeNameList = ["RIP"]
              } else if src == 521 || dst == 521 {
                typeNameList = ["RIPng"]
              } else if src == 524 || dst == 524 {
                typeNameList = ["NCPCarrier"]
              } else if src == 6081 || dst == 6081 {
                typeNameList = ["Geneve"]
              } else if src == 4789 || dst == 4789 {
                typeNameList = ["VXLAN"]
              } else if src == 500 || dst == 500 {
                typeNameList = ["IKE"]
              } else if src == 4500 || dst == 4500 {
                typeNameList = ["NATT"]
              } else if src == 1701 || dst == 1701 {
                typeNameList = ["L2TP"]
              } else if src == 5060 || dst == 5060 {
                typeNameList = ["SIP"]
              } else if src == 4569 || dst == 4569 {
                typeNameList = ["IAX2"]
              } else if src == 5050 || dst == 5050 {
                typeNameList = ["EtherSBus"]
              } else if src == 6060 || dst == 6060 {
                typeNameList = ["EtherSIO"]
              } else if src == 5006 || dst == 5006 {
                typeNameList = ["SDP"]
              } else if src == 3478 || dst == 3478 {
                typeNameList = ["STUN"]
              } else if src == 27036 || dst == 27036 {
                typeNameList = ["SteamDiscoveryCarrier"]
              } else if src == 3483 || dst == 3483 || src == 1069 || dst == 1069 {
                typeNameList = ["SliMP3Carrier"]
              } else if src == 9956 || dst == 9956 {
                typeNameList = ["AllJoynNSCarrier"]
              } else if src == 1900 || dst == 1900 {
                typeNameList = ["SSDP"]
              } else if src == 3702 || dst == 3702 {
                typeNameList = ["WSDiscovery"]
              } else if src == 4712 || dst == 4712 || src == 4713 || dst == 4713 {
                typeNameList = ["C37118"]
              } else if src == 623 || dst == 623 {
                typeNameList = ["IPMI"]
              } else if src == 111 || dst == 111 {
                typeNameList = ["ONCRPC"]
              } else if src == 1194 || dst == 1194 {
                typeNameList = ["OpenVPN"]
              } else if src == 51820 || dst == 51820 {
                typeNameList = ["WireGuard"]
              } else if src == 1985 || dst == 1985 {
                typeNameList = ["HSRP"]
              } else if src == 5004 || dst == 5004 {
                typeNameList = ["RTP"]
              } else if src == 5005 || dst == 5005 {
                typeNameList = ["RTCP"]
              } else if src == 18246 || dst == 18246 {
                typeNameList = ["EGD"]
              } else if src == 17224 || dst == 17224 || src == 17225 || dst == 17225 {
                typeNameList = ["TRDP"]
              }
              for typeName in typeNameList{
                  res,op = this.TryProcessByType(typeName)
                  if op.OK {
                      err = op.Save()
                      if err != nil{
                          panic(err)
                      }
                      if bounded {
                          consumed = getCurrentPosition() - payloadStart
                          if consumed < maximum {
                              remaining = maximum - consumed
                              tail = this.NewUnknownNode("Remaining Payload")
                              tail.SetMaxLength(remaining)
                              tail.Process()
                          }
                      }
                      return
                  }else{
                      debug(op.Message)
                      err = op.Recovery()
                      if err != nil{
                          panic(err)
                      }
                  }
              }
              if bounded {
                  consumed = getCurrentPosition() - payloadStart
                  if consumed < maximum {
                      remaining = maximum - consumed
                      tail = this.NewUnknownNode("Remaining Payload")
                      tail.SetMaxLength(remaining)
                      tail.Process()
                  }
              }
