endian: big
Package:
  LinuxSLL:
    operator: |
      this.ProcessSubNode("Packet Type")
      pt = getNodeResult("Packet Type").Value
      if pt > 7 {
        panic("linux_sll: unknown packet type")
      }
      this.ProcessSubNode("ARPHRD")
      this.ProcessSubNode("Address Length")
      this.ProcessSubNode("Source MAC")
      this.ProcessSubNode("Unused")
      this.ProcessSubNode("Protocol")
      p = getNodeResult("Protocol").Value
      if p == 0x0800 {
        this.ProcessByType("IP")
        return
      }
      if p == 0x86dd {
        this.ProcessByType("IPv6")
        return
      }
      if p == 0x0806 {
        this.ProcessByType("ARP")
        return
      }
      if p == 0x0004 {
        this.ProcessByType("LLC")
        return
      }
      return
    Packet Type: uint16
    ARPHRD: uint16
    Address Length: uint16
    Source MAC: raw,6
    Unused: raw,2
    Protocol: uint16
IP: "import:internet_protocol.yaml;node:Internet Protocol"
IPv6: "import:internet_protocol_version_6.yaml;node:Internet Protocol Version 6"
ARP: "import:address_resolution_protocol.yaml;node:Address Resolution Protocol"
LLC: "import:llc.yaml;node:LLC"
