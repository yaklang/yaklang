endian: little
Package:
  Pickle:
    operator: |
      this.ProcessSubNode("PROTO")
      if getNodeResult("PROTO").Value != 0x80 {
        panic("pickle: expected PROTO opcode")
      }
      this.ProcessSubNode("Version")
      v = getNodeResult("Version").Value
      if v < 2 || v > 5 {
        panic("pickle: protocol version 2-5")
      }
      this.ProcessSubNode("BININT1")
      if getNodeResult("BININT1").Value != 0x4b {
        panic("pickle: expected BININT1")
      }
      this.ProcessSubNode("Value")
      this.ProcessSubNode("STOP")
      if getNodeResult("STOP").Value != 0x2e {
        panic("pickle: expected STOP")
      }
    PROTO: uint8
    Version: uint8
    BININT1: uint8
    Value: uint8
    STOP: uint8
