endian: big
Package:
  OSPF:
    operator: |
      this.ProcessSubNode("Version")
      v = getNodeResult("Version").Value
      if v != 2 && v != 3 {
        panic("ospf: version must be 2 or 3")
      }
      this.ProcessSubNode("Type")
      typ = getNodeResult("Type").Value
      if typ < 1 || typ > 5 {
        panic("ospf: unknown packet type")
      }
      this.ProcessSubNode("Packet Length")
      this.ProcessSubNode("Router ID")
      this.ProcessSubNode("Area ID")
      this.ProcessSubNode("Checksum")
      this.ProcessSubNode("AuType")
      this.ProcessSubNode("Authentication")
      if this.Length() < this.GetMaxLength() {
        rest = this.GetMaxLength() - this.Length()
        if rest > 0 && rest < 1048576 {
          this.GetSubNode("Body").SetMaxLength(rest)
          this.ProcessSubNode("Body")
        }
      }
    Version: uint8
    Type: uint8
    Packet Length: uint16
    Router ID: raw,4
    Area ID: raw,4
    Checksum: uint16
    AuType: uint16
    Authentication: raw,8
    Body: raw
