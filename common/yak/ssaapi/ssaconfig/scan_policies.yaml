# 扫描策略配置
# Policy = 预设 Filter（标准 Tag + 列字段条件）
# 见 docs/design/rule-package.md

version: "2.0"
updated_at: "2026-07-24"

policies:
  owasp-web:
    name: "OWASP Top 10 合规扫描"
    description: "按 OWASP Top 10 相关 CWE 原子标签筛选规则"
    icon: "shield"
    # 代表性 CWE（完整映射由 enricher/mappings 维护；此处为策略选中的原子 Tag）
    tags:
      - cwe:22
      - cwe:77
      - cwe:78
      - cwe:79
      - cwe:89
      - cwe:90
      - cwe:94
      - cwe:200
      - cwe:259
      - cwe:287
      - cwe:352
      - cwe:434
      - cwe:502
      - cwe:601
      - cwe:611
      - cwe:798
      - cwe:862
      - cwe:863
      - cwe:918
      - cwe:1336

  critical-high:
    name: "高危漏洞快速扫描"
    description: "仅扫描严重和高危级别漏洞"
    icon: "rocket"
    severity:
      - critical
      - high

  fullstack:
    name: "全栈深度扫描"
    description: "高危等级 + 常见框架/SCA 标签"
    icon: "stack"
    severity:
      - critical
      - high
      - middle
    tags:
      - spring
      - shiro
      - thinkphp
      - sca

  cwe-top25:
    name: "CWE Top 25"
    description: "CWE Top 25 (2023) 相关规则"
    icon: "warning"
    tags:
      - cwe:787
      - cwe:79
      - cwe:89
      - cwe:416
      - cwe:78
      - cwe:20
      - cwe:125
      - cwe:22
      - cwe:352
      - cwe:434
      - cwe:862
      - cwe:476
      - cwe:287
      - cwe:190
      - cwe:502
      - cwe:77
      - cwe:119
      - cwe:798
      - cwe:918
      - cwe:306
      - cwe:362
      - cwe:269
      - cwe:94
      - cwe:863
      - cwe:276

  custom:
    name: "自定义规则"
    description: "手动选择 Tag / 等级 / 用途"
    icon: "settings"
    tags: []

categories:
  - id: "compliance"
    name: "合规扫描"
    policies: ["owasp-web", "cwe-top25"]
  - id: "quick"
    name: "快速扫描"
    policies: ["critical-high"]
  - id: "comprehensive"
    name: "全面扫描"
    policies: ["fullstack"]
  - id: "custom"
    name: "自定义"
    policies: ["custom"]

# 自定义策略可选的标准 Tag（前端标签选择器）
custom_rule_tags:
  framework:
    - name: spring
      display_name: "Spring"
    - name: shiro
      display_name: "Apache Shiro"
    - name: thinkphp
      display_name: "ThinkPHP"
    - name: sca
      display_name: "依赖组件 (SCA)"
  tech_point:
    - name: sqli
      display_name: "SQL 注入"
    - name: xss
      display_name: "XSS"
    - name: ssrf
      display_name: "SSRF"
    - name: rce
      display_name: "命令/代码执行"
    - name: xxe
      display_name: "XXE"
    - name: deserialization
      display_name: "反序列化"
    - name: path-traversal
      display_name: "路径穿越"
