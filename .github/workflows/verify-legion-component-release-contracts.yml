name: Verify Legion Component Release Contracts

on:
  pull_request:
    paths:
      - ".github/scripts/build-legion-component-oss-index.sh"
      - ".github/scripts/build-legion-node-engine-import-bundle.sh"
      - ".github/scripts/build-legion-product-node.sh"
      - ".github/scripts/build-legion-linux-musl.sh"
      - ".github/scripts/test-build-legion-linux-musl.sh"
      - ".github/scripts/verify-linux-nss-startup.sh"
      - ".github/scripts/package-legion-ai-session-runtime.sh"
      - ".github/scripts/sign-legion-node-release-index.go"
      - ".github/scripts/test-build-legion-component-oss-index.sh"
      - ".github/scripts/test-build-legion-node-engine-import-bundle.sh"
      - ".github/scripts/test-legion-component-workflow-contract.sh"
      - ".github/scripts/test-package-legion-ai-session-runtime.sh"
      - ".github/workflows/build-legion-ai-session-runtime-alpha.yml"
      - ".github/workflows/build-legion-ai-session-runtime-common.yml"
      - ".github/workflows/build-legion-node-alpha.yml"
      - ".github/workflows/build-legion-product-node.yml"
      - ".github/workflows/verify-legion-component-release-contracts.yml"
      - "docker/session-runtime/**"
      - "docs/legion-ai-session-runtime-release.md"
      - "docs/legion-linux-hids-readiness.md"

permissions:
  contents: read

concurrency:
  group: verify-legion-component-release-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Verify release and alpha node contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install the minimal static Runtime fixture compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check shell syntax and lint
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            .github/scripts/build-legion-component-oss-index.sh
            .github/scripts/build-legion-node-engine-import-bundle.sh
            .github/scripts/build-legion-product-node.sh
            .github/scripts/build-legion-linux-musl.sh
            .github/scripts/test-build-legion-linux-musl.sh
            .github/scripts/package-legion-ai-session-runtime.sh
            .github/scripts/test-build-legion-component-oss-index.sh
            .github/scripts/test-build-legion-node-engine-import-bundle.sh
            .github/scripts/test-legion-component-workflow-contract.sh
            .github/scripts/test-package-legion-ai-session-runtime.sh
          )
          bash -n "${scripts[@]}"
          shellcheck "${scripts[@]}"
          gofmt -w .github/scripts/sign-legion-node-release-index.go
          git diff --exit-code -- .github/scripts/sign-legion-node-release-index.go

      - name: Test tag, architecture, and package metadata contracts
        run: |
          set -euo pipefail
          ./.github/scripts/test-legion-component-workflow-contract.sh
          ./.github/scripts/test-build-legion-linux-musl.sh
          ./.github/scripts/test-build-legion-component-oss-index.sh
          ./.github/scripts/test-build-legion-node-engine-import-bundle.sh
          ./.github/scripts/test-package-legion-ai-session-runtime.sh

  build-targets:
    name: Compile Linux ${{ matrix.goarch }} release targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-22.04
            file_machine: x86-64
          - goarch: arm64
            runner: ubuntu-24.04-arm
            file_machine: ARM aarch64
    steps:
      - name: Check out source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Compile Product Node without packaging
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.goarch }}
          FILE_MACHINE: ${{ matrix.file_machine }}
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local
          binary="${RUNNER_TEMP}/legion-smoke-node-${TARGET_ARCH}"
          ./.github/scripts/build-legion-linux-musl.sh \
            --goarch "$TARGET_ARCH" --profile product --output "$binary"
          file "$binary" | grep -q "$FILE_MACHINE"
          file "$binary" | grep -q 'statically linked'
          if readelf -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "node binary declares dynamic library dependencies" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Runtime image without packaging
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/session-runtime/Dockerfile
          platforms: linux/${{ matrix.goarch }}
          push: false
          load: true
          tags: local.invalid/yaklang/legion-ai-session-runtime:verify-${{ matrix.goarch }}
          provenance: false
          sbom: false

      - name: Inspect Runtime image
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          image="local.invalid/yaklang/legion-ai-session-runtime:verify-${TARGET_ARCH}"
          [[ "$(docker image inspect --format '{{.Architecture}}' "$image")" == "$TARGET_ARCH" ]]
          inspect_dir="${RUNNER_TEMP}/runtime-inspect-${TARGET_ARCH}"
          mkdir -p "$inspect_dir"
          container_id="$(docker create "$image")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/usr/local/bin/legion-session-runtime" "$inspect_dir/legion-session-runtime"
          docker cp "$container_id:/usr/local/share/legion/session-runtime-musl-build.json" "$inspect_dir/musl-build.json"
          ./.github/scripts/build-legion-linux-musl.sh --verify-binary \
            "$inspect_dir/legion-session-runtime" "$TARGET_ARCH" runtime
          jq -e '.c_library == "musl" and .link_mode == "external-static" and .builder_execution == "native"' \
            "$inspect_dir/musl-build.json" >/dev/null
          docker save "$image" | gzip -n -1 \
            >"${RUNNER_TEMP}/runtime-${TARGET_ARCH}.docker.tar.gz"
          gzip -t "${RUNNER_TEMP}/runtime-${TARGET_ARCH}.docker.tar.gz"

  alpha-node-targets:
    name: Compile alpha node for ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            file_fragment: Mach-O 64-bit executable x86_64
          - goos: darwin
            goarch: arm64
            runner: macos-15
            file_fragment: Mach-O 64-bit executable arm64
          - goos: linux
            goarch: amd64
            runner: ubuntu-22.04
            file_fragment: ELF 64-bit LSB executable, x86-64
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            file_fragment: ELF 64-bit LSB executable, ARM aarch64
    steps:
      - name: Check out source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Compile portable Legion Node
        shell: bash
        env:
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          EXPECTED_FILE_FRAGMENT: ${{ matrix.file_fragment }}
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local
          binary="${RUNNER_TEMP}/legion-smoke-node-${TARGET_OS}-${TARGET_ARCH}"
          if [[ "$TARGET_OS" == linux ]]; then
            ./.github/scripts/build-legion-linux-musl.sh \
              --goarch "$TARGET_ARCH" --profile portable --output "$binary"
          else
            CGO_ENABLED=1 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" go build \
              -trimpath \
              -buildvcs=true \
              -ldflags '-s -w -buildid=' \
              -o "$binary" \
              ./cmd/legion-smoke-node
          fi
          file "$binary" | grep -Fq "$EXPECTED_FILE_FRAGMENT"
          go version -m "$binary"
