name: updateCve

on:
  workflow_dispatch:
  push:
    branches:
      - "cve/*"
  schedule:
    # 定时任务，在每周一0点更新
    - cron: '0 0 * * 1'

jobs:

  test:
    name: Load CVE Database
    runs-on: ubuntu-22.04

    steps:
      - name: Download latest yak binary
        run: |
          set -euo pipefail
          YAK_OSS_BASE="https://yaklang.oss-accelerate.aliyuncs.com"
          DOWNLOAD_URL="${YAK_OSS_BASE}/yak/latest/yak_linux_amd64"
          echo "Downloading yak from $DOWNLOAD_URL"
          curl -fsSL "$DOWNLOAD_URL" -o ./yak
          chmod +x ./yak
          # 验证 yak 可执行
          ./yak version || { echo "ERROR: downloaded yak binary is not functional"; exit 1; }
          echo "Yak binary ready"

      - name: LoadCVE-Description
        run: mkdir -p ~/yakit-projects && wget -O ~/yakit-projects/default-cve-description.db.gzip https://cve-db.oss-cn-beijing.aliyuncs.com/default-cve-description.db.gzip

      - name: Check file size(Pre Checking!)
        run: |
          FILE_PATH=~/yakit-projects/default-cve-description.db.gzip
          FILE_SIZE=$(stat -c%s "$FILE_PATH")
          echo "File size: $FILE_SIZE bytes"

          SIZE_LIMIT=$((10 * 1024 * 1024)) # 10MB size limit
          if [ $FILE_SIZE -lt $SIZE_LIMIT ]; then
            echo "File size is less than 10MB. Aborting GitHub Actions."
            exit 1
          fi

      - name: Loadcve
        run: ./yak build-cve-database --no-gzip && ./yak build-cve-database --cwe

      - name: Setup Ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: "oss-cn-beijing.aliyuncs.com"
          access-key-id: ${{ secrets.OSS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_KEY_SECRET }}

      - name: Check file size
        run: |
          FILE_PATH=~/yakit-projects/default-cve.db.gzip
          FILE_SIZE=$(stat -c%s "$FILE_PATH")
          echo "File size: $FILE_SIZE bytes"
          
          SIZE_LIMIT=$((10 * 1024 * 1024)) # 10MB size limit
          if [ $FILE_SIZE -lt $SIZE_LIMIT ]; then
            echo "File size is less than 10MB. Aborting GitHub Actions."
            exit 1
          fi

      - name: Deply To OSS
        run: ossutil cp ~/yakit-projects/default-cve.db.gzip oss://cve-db/ -rf
