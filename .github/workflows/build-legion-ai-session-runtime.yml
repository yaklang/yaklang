name: Build Trusted Legion AI Session Runtime

on:
  push:
    tags:
      - "legion-runtime-v*"

permissions: {}

jobs:
  build:
    name: Build and publish trusted Runtime artifacts
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-legion-ai-session-runtime-common.yml
    with:
      source_mode: release
      retention_days: 14
      producer_workflow_name: Build Trusted Legion AI Session Runtime
    secrets:
      OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
      OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
