name: ssa2llvm-test

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'common/yak/ssa2llvm/**'
      - '.github/workflows/ssa2llvm-test.yml'

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    # Hard ceiling for one run: queue wait, toolchain install, CLI build and the
    # test step all count. Queue alone has varied from 5m to 17m, and shared
    # runners have died silently around the 100m mark, so the goal is to keep
    # the whole job well below that. Each lane below bounds itself with a 60m
    # go-test timeout; this cap only stops a runaway job.
    timeout-minutes: 150

    env:
      # go-llvm vendors the LLVM 18.1.3 static archives inside the module, but
      # not the LLVM C/C++ headers (the module zip has none). install_deps
      # adds the official apt.llvm.org repo for jammy; point cgo at the
      # versioned headers so the distro default (LLVM 14) cannot shadow them.
      CGO_CFLAGS: -I/usr/lib/llvm-18/include
      CGO_CXXFLAGS: -I/usr/lib/llvm-18/include
      # go-llvm's bundled LLVM 18.1.3 static archives were built against a
      # newer glibc (they reference __isoc23_*/arc4random, absent on Ubuntu
      # 22.04's glibc 2.35). Put the system LLVM 18.1.8 lib dir first so the
      # link uses the distro-compatible archives.
      CGO_LDFLAGS: -L/usr/lib/llvm-18/lib

    steps:
    - name: Check out code
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.pull_request.head.sha }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # The runtime patch (runtime/patch, elfsplit) is validated against the
        # Go 1.26 moduledata layout. go.mod only declares a minimum (1.22.12);
        # using 1.22.12 here produces binaries whose moduledata fields sit at
        # different offsets and fail runtime.moduledataverify.
        go-version: '1.26.5'
        cache: false
      id: go

    - name: Install LLVM dependencies
      run: |
        sudo bash common/yak/ssa2llvm/scripts/install_deps_ubuntu.sh

    - name: Patch Go runtime text section lookup
      run: bash common/yak/ssa2llvm/scripts/patch_go_runtime.sh

    - name: Init Module
      run: go mod tidy

    - name: Build CLI and embedded runtime assets
      # The embedded libyak.a/crt/libc assets are gitignored (generated), and
      # the CLI embeds them, so build the whole self-contained CLI up front:
      # later test builds reuse the Go build cache and EnsureRuntimeArchive
      # sees a fresh runtime/libyak.a.
      run: |
        bash common/yak/ssa2llvm/scripts/build_cli.sh -o build/tools/ssa2llvm

    - name: Test
      # -x is intentionally NOT passed: it prints every external command and is
      # only useful for manual debugging. Keep CI output lean and deterministic.
      #
      # The suite is three independent groups. Running them as one serial go
      # test walk took 36-75m on shared runners and twice died at ~100m with no
      # logs, so they run as three lanes here. Each lane keeps -p 1 (no
      # concurrent multi-GB Go/LLVM linkers inside a lane) and has its own 60m
      # go-test timeout. Lane output is streamed with a prefix instead of
      # buffered to a file, so a killed step still leaves usable logs.
      #
      # Lane mustpass: the 117-script mustpass sweep.
      # Lane heavy: runtime/coreplugin compile sweeps.
      # Lane rest: every other package and test.
      run: |
        set -u
        heavy='^(TestMustPass_SSA2LLVM_AllScripts|TestRuntime_ShadowLifecycle|TestCorePlugin_CompileAll|TestArtifactPruning_DualEvidence|TestCorePluginBaseYakPluginsCompileToIR|TestCorePlugin_RunSSADetectProject|TestCorePluginSSADetectPrunedRuntimeDependencies)$'

        ( set -o pipefail
          bash scripts/ssa-test.sh -p 1 -count=1 -timeout 60m -v \
            -run '^TestMustPass_SSA2LLVM_AllScripts$' ./common/yak/ssa2llvm/tests 2>&1 \
            | sed -u 's/^/[mustpass] /'
        ) & p_mustpass=$!

        ( set -o pipefail
          bash scripts/ssa-test.sh -p 1 -count=1 -timeout 60m -v \
            -run "$heavy" ./common/yak/ssa2llvm/tests 2>&1 \
            | sed -u 's/^/[heavy] /'
        ) & p_heavy=$!

        ( set -o pipefail
          bash scripts/ssa-test.sh -p 1 -count=1 -timeout 60m -v \
            -skip "$heavy" ./common/yak/ssa2llvm/... 2>&1 \
            | sed -u 's/^/[rest] /'
        ) & p_rest=$!

        status=0
        wait "$p_mustpass" || status=1
        wait "$p_heavy" || status=1
        wait "$p_rest" || status=1
        exit "$status"
