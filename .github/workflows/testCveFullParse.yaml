name: testCveFullParse

# 全量 CVE 解析 CI：下载全部年份 NVD 2.0 + CVE 5.0，构建完整数据库
# 不上传 OSS，不依赖 AI 翻译描述库，只做解析和保存
# 验证全量数据链路（含 CPE / CVSS / CWE / ProductsTable）

on:
  workflow_dispatch:
  push:
    branches:
      - "rookie/enhance/cve-parse"

jobs:
  full-parse:
    name: Full CVE Parse (All Years NVD 2.0 + 5.0)
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "./go.mod"
          cache: false
        id: go

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Build yak
        run: |
          go build -o ./yak ./common/yak/cmd/yak.go
          chmod +x ./yak

      # 全量构建：下载全部年份 NVD 2.0 + 5.0 全量 zip，不跳过任何步骤
      - name: Build Full CVE Database (NVD 2.0 all years + 5.0)
        run: |
          ./yak build-cve-database --no-gzip --output /tmp/cve-full.db
          echo "Full build finished"

      # 验证数据库完整性
      - name: Verify Full Database
        run: |
          echo "=== Database File ==="
          ls -lh /tmp/cve-full.db

          TOTAL=$(sqlite3 /tmp/cve-full.db "SELECT COUNT(*) FROM cves;")
          echo "Total CVEs: $TOTAL"
          if [ "$TOTAL" -lt 200000 ]; then
            echo "ERROR: Expected >200k CVEs, got $TOTAL"
            exit 1
          fi

          echo "=== Field Coverage ==="
          sqlite3 /tmp/cve-full.db "
          SELECT
            COUNT(*) as total,
            COUNT(CASE WHEN title != '' THEN 1 END) as with_title,
            COUNT(CASE WHEN vendor != '' AND vendor != 'n/a' THEN 1 END) as with_vendor,
            COUNT(CASE WHEN product != '' AND product != 'n/a' THEN 1 END) as with_product,
            COUNT(CASE WHEN solution != '' THEN 1 END) as with_solution,
            COUNT(CASE WHEN cwe != '' THEN 1 END) as with_cwe,
            COUNT(CASE WHEN cvss_version != '' THEN 1 END) as with_cvss,
            COUNT(CASE WHEN severity != '' THEN 1 END) as with_severity,
            COUNT(CASE WHEN length(cpe_configurations) > 10 THEN 1 END) as with_cpe,
            COUNT(CASE WHEN exploitability_score > 0 THEN 1 END) as with_exploit_score,
            COUNT(CASE WHEN impact_score > 0 THEN 1 END) as with_impact_score,
            COUNT(CASE WHEN [references] IS NOT NULL AND length([references]) > 2 THEN 1 END) as with_refs
          FROM cves;
          "

          echo "=== Year Distribution (top 10) ==="
          sqlite3 -header /tmp/cve-full.db "
          SELECT substr(cve,5,4) as year, COUNT(*) as cnt
          FROM cves GROUP BY year ORDER BY cnt DESC LIMIT 10;
          "

          echo "=== Year Range ==="
          sqlite3 /tmp/cve-full.db "
          SELECT substr(cve,5,4) as year, COUNT(*) as cnt
          FROM cves GROUP BY year ORDER BY year;
          "

          echo "=== Title Coverage by Year ==="
          sqlite3 -header /tmp/cve-full.db "
          SELECT substr(cve,5,4) as year,
            COUNT(*) as total,
            COUNT(CASE WHEN title != '' THEN 1 END) as with_title,
            ROUND(COUNT(CASE WHEN title != '' THEN 1 END) * 100.0 / COUNT(*), 1) as pct
          FROM cves GROUP BY year ORDER BY year;
          "

          echo "=== ProductsTable ==="
          sqlite3 /tmp/cve-full.db "SELECT COUNT(*) FROM products_tables;"

          echo "=== Sample CVEs (with all fields) ==="
          sqlite3 -header /tmp/cve-full.db "
          SELECT cve, title, vendor, product, severity, cvss_version, base_cvs_sv2_score, cwe
          FROM cves WHERE title != '' AND cpe_configurations IS NOT NULL AND length(cpe_configurations) > 10
          LIMIT 5;
          "

          echo "=== Sample Old CVE (pre-2018, should have CPE but no title) ==="
          sqlite3 -header /tmp/cve-full.db "
          SELECT cve, title, vendor, product, severity, cvss_version, base_cvs_sv2_score
          FROM cves WHERE cve LIKE 'CVE-2010-%' LIMIT 5;
          "

          echo "=== CVE with CPE ==="
          sqlite3 -header /tmp/cve-full.db "
          SELECT cve, vendor, product, substr(cpe_configurations, 1, 80) as cpe_preview
          FROM cves WHERE length(cpe_configurations) > 10 LIMIT 3;
          "

          echo "=== CVE with Solution ==="
          sqlite3 -header /tmp/cve-full.db "
          SELECT cve, title, substr(solution, 1, 60) as solution_preview
          FROM cves WHERE solution != '' LIMIT 3;
          "

      - name: Upload full database artifact
        uses: actions/upload-artifact@v4
        with:
          name: cve-full-database
          path: /tmp/cve-full.db
          retention-days: 7
