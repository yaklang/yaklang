name: Auto Update Embed FS

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths:
      - 'common/syntaxflow/sfbuildin/buildin/**'
      - 'common/ai/aid/aitool/buildinaitools/yakscripttools/yakscriptforai/**'
      - 'common/aiforge/buildinforge/**'
      - 'common/coreplugin/base-yak-plugin/**'

permissions:
  contents: write

concurrency:
  group: embed-fs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Rebase onto main
        run: |
          git fetch origin main
          git rebase origin/main || true
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          if [[ -n "$CONFLICTS" ]]; then
            echo "Conflicts detected. Stopping CI."
            exit 1
          else
            echo "No conflicts. Continuing workflow."
          fi

      - name: Check bot commit and resource changes
        id: check
        run: |
          RESOURCE_DIRS=(
            "common/coreplugin/base-yak-plugin"
            "common/syntaxflow/sfbuildin/buildin"
            "common/aiforge/buildinforge"
            "common/ai/aid/aitool/buildinaitools/yakscripttools/yakscriptforai"
          )

          BOT_COMMIT=""
          for c in $(git rev-list --reverse origin/main..HEAD); do
            if git log -1 --pretty=%s "$c" | grep -q "\[bot commit\]"; then
              BOT_COMMIT="$c"
            fi
          done

          if [ -n "$BOT_COMMIT" ]; then
            echo "Found bot commit: $BOT_COMMIT"
            CHANGED_AFTER=$(git diff --name-only "$BOT_COMMIT"..HEAD -- "${RESOURCE_DIRS[@]}")
            if [ -z "$CHANGED_AFTER" ]; then
              echo "No resource changes after bot commit. Skipping."
              echo "SKIP_CI=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Resource changes after bot commit. Dropping bot commit and regenerating."
            BRANCH=$(git branch --show-current)

            # Human commits after the bot commit may also touch these generated
            # files (e.g. a hand-run hash sync). Their values are stale either
            # way: the workflow regenerates them below, so resolve those
            # conflicts to the side being rebased and continue. Other conflicts
            # are real and must stop CI.
            PRODUCT_FILES=(
              "common/consts/coreplugin-hash.go"
              "common/consts/syntaxflow-hash.go"
              "common/consts/forge-hash.go"
              "common/consts/aitool-hash.go"
              "common/syntaxflow/sfdb/rule_versions.json"
            )
            is_product_file() {
              local f
              for f in "${PRODUCT_FILES[@]}"; do
                [ "$f" = "$1" ] && return 0
              done
              return 1
            }

            git rebase --onto "$BOT_COMMIT^" "$BOT_COMMIT" "$BRANCH" || true
            while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
              CONFLICTS=$(git diff --name-only --diff-filter=U)
              if [ -z "$CONFLICTS" ]; then
                echo "::error::rebase stopped without conflicts; aborting"
                git rebase --abort
                exit 1
              fi
              HANDLED=0
              while IFS= read -r f; do
                if is_product_file "$f"; then
                  echo "Discarding stale bot-generated content for $f (will regenerate)"
                  if git checkout --ours -- "$f" 2>/dev/null; then
                    git add -- "$f"
                  else
                    git rm -f -- "$f"
                  fi
                  HANDLED=1
                else
                  echo "::error::unexpected rebase conflict in $f"
                  git rebase --abort
                  exit 1
                fi
              done <<< "$CONFLICTS"
              if [ "$HANDLED" != "1" ]; then
                echo "::error::no product conflict resolved; aborting rebase"
                git rebase --abort
                exit 1
              fi
              GIT_EDITOR=true git rebase --continue || break
            done
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              echo "::error::bot commit removal rebase still in progress"
              git status --short
              exit 1
            fi
          else
            echo "No bot commit found. Continuing."
          fi

      - name: Set up Go
        if: ${{ env.SKIP_CI != 'true' }}
        uses: actions/setup-go@v6
        with:
          go-version-file: "./go.mod"
          cache: false

      - name: Download or build Yak Binary
        if: ${{ env.SKIP_CI != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # 优先用 active_versions 列表最新发布版；缺少所需参数时由脚本从 checkout 编译。
          echo "YAK=$(bash ./scripts/prepare-yak.sh --out "$RUNNER_TEMP/yak")" >> "$GITHUB_ENV"

      - name: Format SyntaxFlow rules and generate rule versions
        if: ${{ env.SKIP_CI != 'true' }}
        run: |
          "$YAK" syntaxflow-format ./common/syntaxflow/sfbuildin/buildin --rule-version-output ./common/syntaxflow/sfdb/rule_versions.json

      - name: Sync embed FS hash files
        if: ${{ env.SKIP_CI != 'true' }}
        run: |
          # Regenerates every resource hash from the checkout; each file is only rewritten
          # when its hash actually changed, so an unchanged run leaves no diff and the
          # commit step below produces no bot commit.
          YAK="$YAK" bash scripts/sync-embed-fs-hash.sh

      - name: Commit changes
        if: ${{ success() && env.SKIP_CI != 'true' }}
        run: |
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update embed files [bot commit]"
          git push --force origin ${{ github.event.pull_request.head.ref }}
