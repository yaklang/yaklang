name: Diff-Code-Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
    paths:
      - "common/**"
      - ".github/workflows/diff-code-check.yml"
      - "common/ssa_bootstrapping/ci_rule/**"
      - "scripts/get-yak-version.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-wip:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      statuses: read
    outputs:
      should_run_tests: ${{ steps.pre_check.outputs.should_run_tests }}
    steps:
      - name: 'Check Out'
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run Pre-Check
        id: pre_check
        uses: ./.github/actions/pre-check
        with:
          failed-labels: 'do-not-merge,work in progress,wip,rfc'
          skip-labels: 'pass-diff-check'
          cache-key-prefix: 'diff-code-check'

  setup:
    runs-on: ubuntu-22.04
    needs: [check-wip]
    if: needs.check-wip.outputs.should_run_tests == 'true'
    permissions:
      contents: read
      pull-requests: read
      actions: read
      security-events: write
    outputs:
      should_skip: ${{ steps.validate.outputs.should_skip }}
      skip_reason: ${{ steps.validate.outputs.skip_reason }}
    steps:
      - name: Initialize workflow context
        id: init
        run: |
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          
          echo "HEAD_SHA=$HEAD_SHA" >> $GITHUB_ENV
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV

      - name: Set Cache Key
        id: cache_key
        run: |
          CACHE_SHA="${{ env.HEAD_SHA }}"
          echo "sha=$CACHE_SHA" >> $GITHUB_OUTPUT
          echo "Cache key will be: go-$CACHE_SHA"

      - name: Validate PR state
        id: validate
        run: |
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "should_skip=false" >> $GITHUB_OUTPUT
            echo "skip_reason=dispatch" >> $GITHUB_OUTPUT
            echo "Manual dispatch without PR context, scanning current commit"
            exit 0
          fi
          PR_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ env.PR_NUMBER }}")
          
          PR_STATE=$(echo "$PR_RESPONSE" | jq -r '.state // "unknown"')
          PR_HEAD_SHA=$(echo "$PR_RESPONSE" | jq -r '.head.sha // "unknown"')
          
          if [ "$PR_STATE" != "open" ]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "skip_reason=pr_not_open" >> $GITHUB_OUTPUT
            echo "::notice::PR is not open, skipping security check"
            exit 0
          fi
          
          if [ "$PR_HEAD_SHA" != "${{ env.HEAD_SHA }}" ]; then
            echo "should_skip=true" >> $GITHUB_OUTPUT
            echo "skip_reason=sha_mismatch" >> $GITHUB_OUTPUT
            echo "::notice::PR head SHA has changed, skipping security check"
            exit 0
          fi
          
          echo "should_skip=false" >> $GITHUB_OUTPUT
          echo "skip_reason=none" >> $GITHUB_OUTPUT
          echo "PR validation passed"

      - name: Skip if validation failed
        if: steps.validate.outputs.should_skip == 'true'
        run: |
          echo "Workflow skipped: ${{ steps.validate.outputs.skip_reason }}"
          exit 0

      - name: Check out code
        if: steps.validate.outputs.should_skip != 'true'
        uses: actions/checkout@v3
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          clean: false

      - name: Fetch Main And Reset Main
        if: steps.validate.outputs.should_skip != 'true'
        run: |
          git fetch --all
          git checkout main
          git reset --hard origin/main

      - name: Install Yak
        if: steps.validate.outputs.should_skip != 'true'
        env: 
          SKIP_SYNC_EMBED_RULE_IN_GITHUB: "true"
        run: |
          echo "::group::Finding latest Yak version"
          
          # 使用脚本获取合适的版本（匹配所有 alpha / beta 版本，排除 -yakit- 和 -irify-）
          SELECTED_VERSION=$(bash ./scripts/get-yak-version.sh --pattern 'alpha|beta')
          
          if [ -z "$SELECTED_VERSION" ]; then
            echo "::error::No suitable version found (alpha / beta)"
            exit 1
          fi
          
          echo "Selected version: $SELECTED_VERSION"
          echo "SELECTED_VERSION=$SELECTED_VERSION" >> $GITHUB_ENV
          echo "::endgroup::"
          
          echo "::group::Downloading Yak binary"
          
          # 检测操作系统和架构
          OS=""
          ARCH=""
          case "$(uname -s)" in
            Linux*)   OS="linux" ;;
            Darwin*)  OS="darwin" ;;
            MINGW*)   OS="windows" ;;
            *)        echo "::error::Unsupported OS: $(uname -s)"; exit 1 ;;
          esac
          
          case "$(uname -m)" in
            x86_64)   ARCH="amd64" ;;
            aarch64)  ARCH="arm64" ;;
            arm64)    ARCH="arm64" ;;
            *)        echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          
          # Windows 需要 .exe 后缀
          BINARY_NAME="yak_${OS}_${ARCH}"
          if [ "$OS" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          
          DOWNLOAD_URL="https://aliyun-oss.yaklang.com/yak/${SELECTED_VERSION}/${BINARY_NAME}"
          echo "Downloading from: $DOWNLOAD_URL"
          
          if ! curl -sS -L "$DOWNLOAD_URL" -o yak; then
            echo "::error::Failed to download Yak binary"
            exit 1
          fi
          
          chmod +x yak
          echo "::endgroup::"
          
          echo "::group::Verifying Yak installation"
          if ! ./yak version; then
            echo "::error::Yak installation verification failed"
            exit 1
          fi
          
          # 将 yak 移动到 PATH
          if command -v sudo >/dev/null 2>&1; then
            sudo mv yak /usr/local/bin/yak || sudo mv yak /usr/bin/yak || mv yak ~/.local/bin/yak
          else
            mv yak /usr/local/bin/yak 2>/dev/null || mv yak /usr/bin/yak 2>/dev/null || mv yak ~/.local/bin/yak
          fi
          
          # 确保 yak 在 PATH 中
          if ! command -v yak >/dev/null 2>&1; then
            export PATH="$HOME/.local/bin:$PATH"
          fi
          
          # 最终验证
          if ! yak version; then
            echo "::error::Yak installation verification failed after moving to PATH"
            exit 1
          fi
          
          echo "Yak installed successfully: $(yak version)"
          echo "::endgroup::"

      - name: Generate Prog
        id: generate_prog
        if: steps.validate.outputs.should_skip != 'true'
        run: |
          echo "::group::Checking out target commit"
          if ! git checkout ${{ env.HEAD_SHA }}; then
            echo "::error::Failed to checkout commit ${{ env.HEAD_SHA }}"
            exit 1
          fi
          echo "::endgroup::"
          
          echo "::group::Importing SyntaxFlow rules"
          if ! yak sf-import --file common/ssa_bootstrapping/ci_rule/ --format raw; then
            echo "::error::Failed to import SyntaxFlow rules"
            exit 1
          fi
          echo "::endgroup::"
          
          echo "::group::Generating file system snapshot"
          
          # Method 1: using merge base and commit range
          MERGE_BASE=$(git merge-base main ${{ env.HEAD_SHA }})
          if [ -z "$MERGE_BASE" ]; then
            echo "::error::Failed to find merge base between main and ${{ env.HEAD_SHA }}"
            exit 1
          fi
          echo "Merge base: $MERGE_BASE"
          
          if ! yak gitefs --start $MERGE_BASE --end ${{ env.HEAD_SHA }} --output ./fs.zip; then
            echo "::error::Failed to generate file system snapshot"
            exit 1
          fi
          
          # Method 2: using PR file changes API (commented out)
          # REPO_OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          # REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          # echo "Using PR mode: PR #${{ env.PR_NUMBER }} from $REPO_OWNER/$REPO_NAME"
          # 
          # if ! yak gitefs --pr ${{ env.PR_NUMBER }} --owner "$REPO_OWNER" --github-repo "$REPO_NAME" --token "${{ secrets.GITHUB_TOKEN }}" --output ./fs.zip; then
          #   echo "::error::Failed to generate file system snapshot from PR"
          #   exit 1
          # fi
          
          # Method 3: using branch name (convenient for local testing and CI)
          # BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          # BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          # echo "Using branch mode: branch $BRANCH_NAME against base $BASE_BRANCH"
          # if ! yak gitefs --branch "$BRANCH_NAME" --base-branch "$BASE_BRANCH" --output ./fs.zip; then
          #   echo "::error::Failed to generate file system snapshot from branch"
          #   exit 1
          # fi
          
          if [ ! -f "./fs.zip" ]; then
            echo "::error::fs.zip was not created"
            exit 1
          fi

          ALL_GO_COUNT=$(unzip -Z1 ./fs.zip | awk '/\.go$/ { count++ } END { print count + 0 }')
          # code-scan drops *_test.go. A test-only diff still matches /\.go$/,
          # then the scanner exits with "not found can compiled file".
          GO_FILE_COUNT=$(unzip -Z1 ./fs.zip | awk '/\.go$/ && !/_test\.go$/ { count++ } END { print count + 0 }')
          echo "Go files in diff: $ALL_GO_COUNT (compilable, excluding *_test.go: $GO_FILE_COUNT)"
          if [ "$GO_FILE_COUNT" -eq 0 ]; then
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            if [ "$ALL_GO_COUNT" -eq 0 ]; then
              echo "skip_reason=no_go_files" >> "$GITHUB_OUTPUT"
              echo "::notice::No .go files found in diff; skipping compilation and security scan"
            else
              echo "skip_reason=only_test_go_files" >> "$GITHUB_OUTPUT"
              echo "::notice::Diff only changes *_test.go files; skipping compilation and security scan"
            fi
            exit 0
          fi
          echo "should_skip=false" >> "$GITHUB_OUTPUT"
          echo "skip_reason=none" >> "$GITHUB_OUTPUT"
          echo "::endgroup::" 

      - name: Upload fs.zip
        if: steps.validate.outputs.should_skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fs.zip
          path: fs.zip

      - name: Check With SyntaxFlow
        if: steps.validate.outputs.should_skip != 'true' && steps.generate_prog.outputs.should_skip != 'true'
        id: scan
        run: |
          echo "::group::Running security scan"
          yak sync-rule
          
          # 直接产出 SARIF：yak code-scan 现在输出的是 GitHub code scanning
          # 可接受的单一文档（合法 kind 枚举、单一 run、仓库相对路径、
          # security-severity/tags、partialFingerprints），不需要后处理转换。
          # 要求 yak >= 1.4.8-alpha0922：该版本之前的 --format sarif 会输出
          # 非法 kind 和多个 run，上传会被 GitHub 拒绝。
          # category / 稳定 ruleId / markdown 渲染需要 >= 1.4.8-alpha0923
          # （#5164 在 alpha0922 构建之后才合并，alpha0922 输出的是无斜杠的
          # automationDetails、sha256 ruleId，且 markdown 不渲染）。
          SCAN_OUTPUT=$(yak code-scan -t ./fs.zip -l golang --rule-keyword golang --format sarif -o results --memory --file-perf-log --rule-perf-log --exclude-file **/vendor/**,vendor/**,**/classes/**,**/target/**,**include/**,**caches/**,**cache/**,**tmp/**,**alipay/**,**includes/**,**temp/**,**zh_cn/**,**zh_en/**,**plugins/**,**PHPExcel/**,**/tests/**,**/test/**,*.pb.go,*_test.go,**vulinbox/** 2>&1) || SCAN_EXIT_CODE=$?
          
          if [ ! -z "$SCAN_EXIT_CODE" ] && [ "$SCAN_EXIT_CODE" != "0" ]; then
            echo "$SCAN_OUTPUT"
            
            # 检查是否是严重的运行时错误（panic、nil pointer等）
            if echo "$SCAN_OUTPUT" | grep -qiE "panic|nil pointer|invalid memory|runtime error|fatal error"; then
              echo "::error::Critical runtime error detected in security scan"
              echo "::error::This indicates a bug in the scanning tool or code"
              echo "scan_result=critical_error" >> $GITHUB_OUTPUT
              echo "risk_count=0" >> $GITHUB_OUTPUT
              echo "::endgroup::"
              exit 1
            fi
            
            # 检查是否是编译失败错误（非严重错误）
            if echo "$SCAN_OUTPUT" | grep -q "record not found\|have err\|get program failed\|parse project.*failed\|not found can compiled file"; then
              echo "::warning::Project compilation failed, skipping security scan"
              echo "::notice::This is usually caused by an empty diff, a test-only diff, or compilation errors"
              echo "scan_result=skipped_compilation_error" >> $GITHUB_OUTPUT
              echo "risk_count=0" >> $GITHUB_OUTPUT
              echo "::endgroup::"
              exit 0
            else
              echo "::error::Security scan failed with unexpected error"
              echo "scan_result=unknown_error" >> $GITHUB_OUTPUT
              echo "risk_count=0" >> $GITHUB_OUTPUT
              echo "::endgroup::"
              exit 1
            fi
          fi
          
          echo "$SCAN_OUTPUT"
          echo "::endgroup::"
          
          echo "::group::Processing scan results"
          if [ ! -s "./results.sarif" ]; then
            echo "::error::results.sarif was not generated"
            exit 1
          fi
          
          # 必须是单个合法 JSON 文档：拼接多个文档会被 upload-sarif 拒绝。
          if ! RULE_COUNT=$(jq -r '.runs[0].tool.driver.rules | length // 0' results.sarif 2>&1); then
            echo "::error::Failed to parse results.sarif"
            echo "::error::jq error output: $RULE_COUNT"
            head -n 40 results.sarif
            exit 1
          fi
          
          RUN_COUNT=$(jq -r '.runs | length' results.sarif)
          if [ "$RUN_COUNT" != "1" ]; then
            echo "::error::Expected exactly one SARIF run, got: $RUN_COUNT"
            echo "::error::GitHub rejects a document whose runs share one tool name"
            exit 1
          fi
          
          NUM=$(jq -r '[.runs[0].results[]?] | length' results.sarif)
          if ! [[ "$NUM" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid SARIF result count: '$NUM'"
            exit 1
          fi
          
          echo "SARIF run: tool=$(jq -r '.runs[0].tool.driver.name' results.sarif) rules=$RULE_COUNT results=$NUM"
          echo "risk_count=$NUM" >> $GITHUB_OUTPUT
          echo "scan_result=success" >> $GITHUB_OUTPUT
          if [ "$NUM" -eq 0 ]; then
            echo "::notice::No security risks found; uploading an empty SARIF result so stale alerts are closed"
          else
            echo "::notice::Found $NUM security risks; GitHub Code Scanning will classify and report them"
          fi
          echo "::endgroup::"

      - name: Notify compilation skip
        if: steps.validate.outputs.should_skip != 'true' && steps.scan.outputs.scan_result == 'skipped_compilation_error'
        run: |
          echo "::notice::✅ Security scan was skipped due to compilation failure"
          echo "::notice::This is usually caused by:"
          echo "::notice::  - Empty diff (no Go files changed)"
          echo "::notice::  - Diff that only changes *_test.go or other excluded files"
          echo "::notice::  - Compilation errors in the code"
          echo "::notice::  - Missing dependencies or broken imports"
          echo "::notice::This does not block the CI pipeline."

      # GitHub code scanning is the one write path that also works for pull
      # requests from forks: the findings are published as a
      # "Code scanning results" check plus annotations on the changed lines,
      # without needing to post a comment with a token.
      #
      # The scan itself already writes results.sarif. A diff with no compilable
      # Go files (none at all, or only *_test.go) never runs it, so an empty run
      # is written here, carrying just the tool identity. The category is left to
      # the uploader, which derives it from the `category` input below, so both
      # paths report the same (tool, category) pair and update one alert set.

      - name: Write empty SARIF when the diff has nothing to scan
        if: steps.validate.outputs.should_skip != 'true' && steps.generate_prog.outputs.should_skip == 'true'
        run: |
          cat > results.sarif <<'SARIF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "yaklang-code-scan",
                    "fullName": "Yaklang SyntaxFlow Static Analysis",
                    "organization": "yaklang.io",
                    "informationUri": "https://github.com/yaklang/yaklang"
                  }
                },
                "results": []
              }
            ]
          }
          SARIF
          jq -e '.runs[0].results | length == 0' results.sarif > /dev/null

      - name: Upload SARIF to code scanning
        if: steps.validate.outputs.should_skip != 'true' && (steps.scan.outputs.scan_result == 'success' || steps.generate_prog.outputs.should_skip == 'true')
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: yaklang-diff-code-check

  post-check:
    name: Save Scan Results to Cache
    needs: setup
    if: needs.setup.outputs.should_skip != 'true' && success()
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      statuses: write
    steps:
      # checkout code for this ./.github/actions/post-check/action.yml to work
      - name: 'Check Out'
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run Post-Check (Save Scan Results)
        uses: ./.github/actions/post-check
        with:
          cache-key-prefix: 'diff-code-check'
