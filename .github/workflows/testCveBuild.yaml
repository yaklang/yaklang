name: testCveBuild

on:
  workflow_dispatch:
  push:
    branches:
      - "rookie/enhance/cve-parse"

jobs:

  test:
    name: Test CVE Database Build (no upload)
    runs-on: ubuntu-22.04

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v2

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version-file: "./go.mod"
          cache: false
        id: go

      - name: Init Module
        run: |
          go mod tidy

      - name: Build yak 
        run: |
          go build -o ./yak ./common/yak/cmd/yak.go
          chmod +x ./yak

      - name: LoadCVE-Description
        run: mkdir -p ~/yakit-projects && wget -O ~/yakit-projects/default-cve-description.db.gzip https://cve-db.oss-cn-beijing.aliyuncs.com/default-cve-description.db.gzip

      - name: Check file size(Pre Checking!)
        run: |
          FILE_PATH=~/yakit-projects/default-cve-description.db.gzip
          FILE_SIZE=$(stat -c%s "$FILE_PATH")
          echo "File size: $FILE_SIZE bytes"

          SIZE_LIMIT=$((10 * 1024 * 1024)) # 10MB size limit
          if [ $FILE_SIZE -lt $SIZE_LIMIT ]; then
            echo "File size is less than 10MB. Aborting GitHub Actions."
            exit 1
          fi

      - name: Loadcve
        run: ./yak build-cve-database --no-gzip && ./yak build-cve-database --cwe

      - name: Check file size
        run: |
          FILE_PATH=~/yakit-projects/default-cve.db
          FILE_SIZE=$(stat -c%s "$FILE_PATH")
          echo "CVE DB size: $FILE_SIZE bytes"

          SIZE_LIMIT=$((10 * 1024 * 1024)) # 10MB size limit
          if [ $FILE_SIZE -lt $SIZE_LIMIT ]; then
            echo "File size is less than 10MB. Aborting GitHub Actions."
            exit 1
          fi

      - name: Verify CVE count
        run: |
          sudo apt-get install -y sqlite3
          COUNT=$(sqlite3 ~/yakit-projects/default-cve.db "SELECT COUNT(*) FROM cves;")
          echo "CVE count in database: $COUNT"
          if [ "$COUNT" -lt 100000 ]; then
            echo "CVE count too low, expected at least 100000. Aborting."
            exit 1
          fi

      - name: Verify CVE V5 fields
        run: |
          # Check that some CVEs have V5-specific fields (title, solution)
          TITLE_COUNT=$(sqlite3 ~/yakit-projects/default-cve.db "SELECT COUNT(*) FROM cves WHERE title != '';")
          echo "CVEs with V5 title: $TITLE_COUNT"
          SOLUTION_COUNT=$(sqlite3 ~/yakit-projects/default-cve.db "SELECT COUNT(*) FROM cves WHERE solution != '';")
          echo "CVEs with V5 solution: $SOLUTION_COUNT"
          if [ "$TITLE_COUNT" -lt 1000 ]; then
            echo "V5 title count too low, expected at least 1000. Aborting."
            exit 1
          fi
