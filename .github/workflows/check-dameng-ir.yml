name: Check optional DM IR driver

on:
  pull_request:
    paths:
      - 'common/utils/damenggorm/**'
      - 'common/consts/**'
      - 'common/yak/ssa/ssadb/**'
      - 'common/yak/ssaapi/dameng_live_test.go'
      - 'scannode/capability*'
      - 'scannode/product_manifest_capabilities_test.go'
      - 'scannode/node.go'
      - '.github/scripts/legion-product-node-capabilities*'
      - '.github/scripts/test-legion-product-node-capabilities.sh'
      - '.github/workflows/check-dameng-ir.yml'
      - '.github/actions/linux-pcap/**'
      - 'scripts/ci/configure-linux-pcap.sh'
      - 'scripts/ci/tests/test_linux_pcap.py'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-dameng-ir-${{ github.ref }}
  cancel-in-progress: true

jobs:
  default-driver-boundary:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify ordinary engine builds omit the DM SDK and Go plugin loader
        shell: bash
        run: |
          set -euo pipefail
          go list -mod=readonly -deps ./common/consts ./common/yak/ssaapi ./scannode > "$RUNNER_TEMP/ssa-default-deps.txt"
          if grep -E '^(plugin|gitee.com/chunanyong/dm(/.*)?)$' "$RUNNER_TEMP/ssa-default-deps.txt"; then
            echo 'Default engine build unexpectedly includes the optional DM driver' >&2
            exit 1
          fi
      - name: Verify SSA policy without the native driver
        run: go test -mod=readonly -race ./common/utils/damenggorm -count=1 -timeout=2m
      - name: Verify ordinary Node omits unavailable DM IR capability
        run: go test -mod=readonly -race ./scannode -run '^Test(NormalizeScanNodeCapabilityKeys.*|Product.*Capabilities.*|DMIRCapability.*)$' -count=1 -timeout=4m
      - name: Verify the public DM dialect without adding its test dependencies to the engine
        shell: bash
        run: |
          set -euo pipefail
          version=$(go list -mod=readonly -m -f '{{.Version}}' github.com/yaklang/gorm)
          work=$(mktemp -d "$RUNNER_TEMP/dm-gorm-tests.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          go mod init example.com/yaklang-dm-dialect-check
          go mod edit -go=1.22 -require="github.com/yaklang/gorm@$version"
          go test -mod=mod -race github.com/yaklang/gorm/dialects/dameng -count=1 -timeout=2m

  native-driver:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/linux-pcap
      - name: Verify SSA policy with the native driver
        run: go test -mod=readonly -race -tags dameng ./common/utils/damenggorm -count=1 -timeout=2m
      - name: Verify the public native driver's races in an isolated module
        shell: bash
        run: |
          set -euo pipefail
          version=$(go list -mod=readonly -m -f '{{.Version}}' github.com/yaklang/gorm)
          work=$(mktemp -d "$RUNNER_TEMP/dm-gorm-tests.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          go mod init example.com/yaklang-dm-native-check
          go mod edit -go=1.22 -require="github.com/yaklang/gorm@$version"
          go test -mod=mod -race -tags dameng github.com/yaklang/gorm/dialects/dameng -count=1 -timeout=2m
      - name: Compile native SSA tests with the supported Go version
        run: go test -mod=readonly -tags dameng ./common/yak/ssaapi -run '^$' -count=1
      - name: Verify production host driver capability and Runtime role boundary
        run: go test -mod=readonly -race -tags hids,dameng ./scannode -run '^Test(NormalizeScanNodeCapabilityKeys.*|Product.*Capabilities.*|DMIRCapability.*)$' -count=1 -timeout=4m
      - name: Check isolated glibc linker setup
        run: python3 -m unittest discover -s scripts/ci/tests -p test_linux_pcap.py -v
