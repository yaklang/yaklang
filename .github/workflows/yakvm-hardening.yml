name: YakVM hardening

on:
  pull_request:
    branches: [main]
    paths:
      - 'common/yak/antlr4yak/**'
      - '.github/workflows/yakvm-hardening.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: yakvm-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  boundaries:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Preserve complete Yak engine and tooling regression coverage
        run: go test ./common/yak/antlr4yak/... -count=1 -timeout=15m
      - name: VM and compiler race coverage
        run: go test -race ./common/yak/antlr4yak/yakvm/... ./common/yak/antlr4yak/yakast -count=1 -timeout=5m
      - name: Incremental engine boundary race coverage
        run: go test -race ./common/yak/antlr4yak -run '^TestCore' -count=1 -timeout=3m
      - name: LL-only semantic and boundary coverage
        env:
          YAK_ANTLR_SLL_FIRST: '0'
        run: go test ./common/yak/antlr4yak ./common/yak/antlr4yak/yakast -run '^TestCore' -count=1 -timeout=3m
      - name: Bounded bytecode fuzz smoke test
        run: go test ./common/yak/antlr4yak/yakvm -run '^$' -fuzz '^FuzzCoreDecode$' -fuzztime=30s -parallel=2
