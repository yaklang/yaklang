syntax = "proto3";

package legion.plugin.v1;

import "google/protobuf/timestamp.proto";
import "legion/node/v1/node.proto";

option go_package = "github.com/yaklang/yaklang/scannode/gen/legionpb/legion/plugin/v1;pluginv1";

message PluginReleaseRef {
  string plugin_id = 1;
  string release_id = 2;
  string version = 3;
  string entry_kind = 4;
}

message PluginArtifactRef {
  string artifact_uri = 1;
  string artifact_sha256 = 2;
  int64 artifact_size_bytes = 3;
}

message SyncPluginCommand {
  legion.node.v1.CommandMetadata metadata = 1;
  string target_node_id = 2;
  PluginReleaseRef release = 3;
  PluginArtifactRef artifact = 4;
}

message PluginSyncStatus {
  legion.node.v1.EventMetadata metadata = 1;
  PluginReleaseRef release = 2;
  string status = 3;
  string local_path = 4;
  int64 cached_size_bytes = 5;
  google.protobuf.Timestamp observed_at = 6;
}

message PluginSyncFailed {
  legion.node.v1.EventMetadata metadata = 1;
  PluginReleaseRef release = 2;
  string error_code = 3;
  string error_message = 4;
  google.protobuf.Timestamp observed_at = 5;
}

// PluginBundleRef identifies one immutable, content-addressed collection of
// plugin releases. The bundle ID is the catalog identity; artifact_sha256 pins
// the exact ZIP bytes a job or node must use.
message PluginBundleRef {
  string bundle_id = 1;
  string artifact_sha256 = 2;
  string archive_format = 3;
  string schema_version = 4;
  int32 item_count = 5;
  int64 artifact_size_bytes = 6;
}

message SyncPluginStoreCommand {
  legion.node.v1.CommandMetadata metadata = 1;
  string target_node_id = 2;
}

message PluginStoreSyncProgress {
  string command_id = 1;
  string status = 2; // running | succeeded | failed
  double progress = 3; // 0..1
  int32 total = 4;
  int32 completed = 5;
  int32 succeeded = 6;
  int32 failed = 7;
  string current_plugin = 8;
  string error_code = 9;
  string error_message = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message QueryPluginStoreSyncStatusCommand {
  legion.node.v1.CommandMetadata metadata = 1;
  string target_node_id = 2;
  string command_id = 3;
}

message ImportPluginStoreCommand {
  legion.node.v1.CommandMetadata metadata = 1;
  string target_node_id = 2;
  // Platform-served download URL of the uploaded SQLite plugin database.
  string artifact_url = 3;
  string artifact_sha256 = 4;
  int64 artifact_size_bytes = 5;
}

message PluginStoreImportResult {
  string command_id = 1;
  string status = 2; // running | succeeded | failed
  int32 plugin_count = 3; // informational count reported by node
  string backup_path = 4;
  string error_code = 5;
  string error_message = 6;
  google.protobuf.Timestamp updated_at = 7;
}
