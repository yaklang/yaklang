syntax = "proto3";

package legion.job.v1;

import "google/protobuf/timestamp.proto";
import "legion/node/v1/node.proto";

option go_package = "github.com/yaklang/yaklang/scannode/gen/legionpb/legion/job/v1;jobv1";

message JobRef {
  string job_id = 1;
  string subtask_id = 2;
  string attempt_id = 3;
}

message ScriptVersionRef {
  string plugin_id = 1;
  string release_id = 2;
  string version = 3;
  string entry_kind = 4;
  string content_sha256 = 5;
}

message InlineScript {
  ScriptVersionRef version = 1;
  string name = 2;
  string content = 3;
}

message RuleSnapshotRef {
  string snapshot_id = 1;
  string content_sha256 = 2;
  string schema_version = 3;
  string bundle_format = 4;
  repeated string asset_ids = 5;
}

// ResourceRequest is an admission charge, not a hard process limit.
message ResourceRequest {
  uint64 cpu_millicores = 1;
  uint64 memory_bytes = 2;
}

message DispatchJobCommand {
  legion.node.v1.CommandMetadata metadata = 1;
  string target_node_id = 2;
  JobRef job = 3;
  reserved 4;
  string execution_kind = 5;
  bytes input_json = 6;
  map<string, string> labels = 7;
  InlineScript script = 8;
  RuleSnapshotRef rule_snapshot = 9;
  ResourceRequest resource_request = 10;
}

message CancelJobCommand {
  legion.node.v1.CommandMetadata metadata = 1;
  JobRef job = 2;
  string reason = 3;
}

message JobClaimed {
  legion.node.v1.EventMetadata metadata = 1;
  JobRef job = 2;
  google.protobuf.Timestamp claimed_at = 3;
}

message JobStarted {
  legion.node.v1.EventMetadata metadata = 1;
  JobRef job = 2;
  google.protobuf.Timestamp started_at = 3;
}

message JobProgressed {
  legion.node.v1.EventMetadata metadata = 1;
  JobRef job = 2;
  string stage = 3;
  string message = 4;
  uint32 completed_units = 5;
  uint32 total_units = 6;
}

message JobRuleSnapshotPrepared {
  legion.node.v1.EventMetadata metadata = 1;
  JobRef job = 2;
  string snapshot_id = 3;
  string content_sha256 = 4;
  string schema_version = 5;
  string bundle_format = 6;
  uint32 rule_count = 7;
  bool cache_hit = 8;
  google.protobuf.Timestamp prepared_at = 9;
}

message JobAsset {
  legion.node.v1.EventMetadata metadata = 1;
  JobRef job = 2;
  string asset_kind = 3;
  string title = 4;
  string target = 5;
  string identity_key = 6;
  bytes asset_json = 7;
}

message JobRisk {
  legion.node.v1.EventMetadata metadata = 1;
  JobRef job = 2;
  string risk_kind = 3;
  string title = 4;
  string target = 5;
  string severity = 6;
  string dedupe_key = 7;
  bytes risk_json = 8;
}

message JobReport {
  legion.node.v1.EventMetadata metadata = 1;
  JobRef job = 2;
  string report_kind = 3;
  bytes report_json = 4;
}

message JobArtifactReady {
  legion.node.v1.EventMetadata metadata = 1;
  JobRef job = 2;
  string artifact_kind = 3;
  string artifact_format = 4;
  string object_key = 5;
  string codec = 6;
  string sha256 = 7;
  uint64 raw_size_bytes = 8;
  uint64 stored_size_bytes = 9;
  bytes metrics_json = 10;
}

message JobArtifactUploadFailed {
  legion.node.v1.EventMetadata metadata = 1;
  JobRef job = 2;
  string object_key = 3;
  string error_code = 4;
  string error_message = 5;
  uint64 uploaded_bytes = 6;
  bytes metrics_json = 7;
}

message JobSucceeded {
  legion.node.v1.EventMetadata metadata = 1;
  JobRef job = 2;
  google.protobuf.Timestamp finished_at = 3;
  bytes result_json = 4;
}

message JobFailed {
  legion.node.v1.EventMetadata metadata = 1;
  JobRef job = 2;
  google.protobuf.Timestamp finished_at = 3;
  // Canonical failure code. Known node-reported codes and retry policies live in
  // scannode/job_failure_codes.go (ResolveJobFailureCode). Unknown codes are
  // bucketed as node_reported_failure_unknown with raw_error_code in detail.
  string error_code = 4;
  string error_message = 5;
  bytes error_detail_json = 6;
}

message JobCancelled {
  legion.node.v1.EventMetadata metadata = 1;
  JobRef job = 2;
  google.protobuf.Timestamp finished_at = 3;
  string reason = 4;
}
